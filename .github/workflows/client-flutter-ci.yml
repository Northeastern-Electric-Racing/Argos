name: Flutter Format Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - "flutter-client/**"
      - ".github/workflows/client-flutter-ci.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "flutter-client/**"
      - ".github/workflows/client-flutter-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flutter-client

    steps:
      # Step 1: Fetch repository files
      - name: Checkout Code
        uses: actions/checkout@v7

      # Step 2: Initialize Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 3: Fetch project dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Step 4: Validate formatting across the project
      - name: Check Formatting
        run: dart format --set-exit-if-changed .
