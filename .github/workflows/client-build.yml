name: Create and publish client docker image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: northeastern-electric-racing/argos-client

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the offline-map release
      packages: write
    defaults:
      run:
        working-directory: ./angular-client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: angular-client/.nvmrc

      - name: Install deps
        run: npm ci

      # One map per quarter and venue list, kept on the offline-map release, so images ship the same map until either
      # changes; delete its asset to refresh it sooner
      - name: Fetch the offline map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="basemap-$(date -u +%Y)q$((($(date -u +%-m) + 2) / 3))-$(sha256sum ../utils/map-venues.txt | cut -c1-12).pmtiles"
          mkdir -p src/assets/map
          if ! gh release download offline-map --pattern "$asset" --output src/assets/map/basemap.pmtiles; then
            sh ../utils/fetch-basemap.sh
            gh release view offline-map > /dev/null 2>&1 ||
              gh release create offline-map --prerelease --title "Offline map" --notes "The client's offline map, built by client-build.yml"
            cp src/assets/map/basemap.pmtiles "$RUNNER_TEMP/$asset" && gh release upload offline-map "$RUNNER_TEMP/$asset"
          fi

      - name: Build production bundle
        run: npm run build:production

      # Stage dist where Dockerfile.prebuilt expects it; /dist is in .dockerignore,
      # so the docker context can't pull from dist/angular-client/browser directly.
      - name: Stage dist into docker context
        run: cp -r dist/angular-client/browser browser

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch in one buildx push — apk add gettext is the only RUN, fine under QEMU.
      # All real CPU work (ng build) ran natively above; arch-sensitive part is just the nginx base layer.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./angular-client
          file: ./angular-client/Dockerfile.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          provenance: false
