name: Frontend Unit Tests

# Always triggers so the required "test-gate" check is never left pending on PRs that don't
# touch the client. The changes job decides whether the tests run; the gate reflects the result.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Detect client changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - "angular-client/**"
              - ".github/workflows/test-check.yml"

  run-frontend-tests:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.17.0
          cache: "npm"
          cache-dependency-path: ./angular-client/package-lock.json
      - name: Install modules
        working-directory: ./angular-client
        run: npm ci
      - name: Run unit tests
        working-directory: ./angular-client
        run: npm run test:ci

  test-gate:
    # Required status check. Always runs; green when tests are skipped or pass, red only on failure.
    needs: [changes, run-frontend-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        run: |
          result="${{ needs.run-frontend-tests.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "Frontend unit tests failed (result: $result)"
            exit 1
          fi
          echo "Test gate passed (result: $result)"
