name: Flutter Web Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - argos2
    paths:
      - 'flutter-client/**'
      - '.github/workflows/client-flutter-build.yml'
  # Compile-only gate: the build job below runs on PRs so a change that breaks
  # `flutter build web` is caught before it merges. The deploy job stays off
  # pull_request — no PR should be able to publish to GitHub Pages.
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'flutter-client/**'
      - '.github/workflows/client-flutter-build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./flutter-client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
           channel: stable # or: beta, master (or main)

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Download Dependencies
        run: flutter pub get

      - name: Build
        run: flutter build web --base-href='/Argos/'

      # Only needed to hand the site to the deploy job, which never runs on a PR.
      - name: Upload static files as artifact
        id: deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5 # or specific "vX.X.X" version tag for this action
        with:
          path: ./flutter-client/build/web/

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
