name: Scylla CI

# Always triggers so the required "scylla-gate" check is never left pending on non-scylla PRs.
# The changes job decides whether the Rust build/test runs; the gate reflects the result.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scylla: ${{ steps.filter.outputs.scylla }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Detect scylla changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scylla:
              - "scylla-server/**"
              - ".github/workflows/scylla-ci.yml"

  build:
    needs: changes
    if: ${{ needs.changes.outputs.scylla == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scylla-server
    steps:
      - name: Setup Rust
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Clippy
        run: cargo clippy --all-targets --locked
      - name: Fmt
        run: cargo fmt --check
      - name: Start DB
        working-directory: compose
        run: docker compose up -d odyssey-db
      - name: Build
        run: cargo build --verbose --locked
      - name: Migrate DB # run the server until it reports the migration, then stop it
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/postgres
        run: |
          cargo run --locked > scylla.log 2>&1 & ID=$!
          for _ in $(seq 300); do
            if grep -q "Successfully migrated DB!" scylla.log; then kill $ID; exit 0; fi
            if grep -q "Encountered Error" scylla.log || ! kill -0 $ID 2>/dev/null; then
              cat scylla.log; echo "::error::Scylla exited or failed before migrating the DB"; kill $ID 2>/dev/null; exit 1
            fi
            sleep 1
          done
          cat scylla.log; echo "::error::Timed out after 5 minutes waiting for the DB migration"; kill $ID; exit 1
      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/postgres
        run: cargo test --locked -- --test-threads=1
      - name: Cleanup
        working-directory: compose
        run: docker compose down

  scylla-gate:
    # Required status check. Always runs; green when the build is skipped or passes, red on failure.
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        run: |
          changes_result="${{ needs.changes.result }}"
          if [ "$changes_result" != "success" ]; then
            echo "Change detection did not succeed (result: $changes_result) - refusing to pass the gate"
            exit 1
          fi
          result="${{ needs.build.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "Scylla CI failed (result: $result)"
            exit 1
          fi
          echo "Scylla gate passed (result: $result)"
