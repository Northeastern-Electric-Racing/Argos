# AGLint trust table for rust: written by `aglint init` (SPEC-v3 section 3.3). First match wins.
# Every rule carries the basis it was proposed from. Edit freely; init never overwrites this file.
version: 1
stack: rust
default_tier: high
rules:
# ARGOS: tower-http is server middleware (CORS, request tracing), not an HTTP client: init's name heuristic (http)
# proposed it LOW and guarded; it makes no outbound call, so it is a third-party dependency like the rest.
- id: tower-http
  tier: medium
  match:
    package:
    - tower-http
  basis: third-party dependency, no evidence (Cargo.toml); server middleware, makes no outbound call
