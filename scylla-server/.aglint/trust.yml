# AGLint trust table for rust: written by `aglint init` (SPEC-v3 section 3.3). First match wins.
# Every rule carries the basis it was proposed from. Edit freely; init never overwrites this file.
version: 1
stack: rust
default_tier: high
rules:
- id: tower-http
  tier: low
  match:
    package:
    - tower-http
  basis: name heuristic (http) (Cargo.toml)
- id: axum-extra
  tier: medium
  match:
    package:
    - axum-extra
  basis: third-party dependency, no evidence (Cargo.toml)
