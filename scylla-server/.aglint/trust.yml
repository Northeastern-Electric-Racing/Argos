  basis: crate allow-list (Cargo.toml)
outcomes:
  db-write:
    aliases:
    - aglint-db-write
    - db-write
    - runtime:db INSERT *
    - runtime:db UPDATE *
    - runtime:db DELETE *
    - runtime:db MERGE *
    - runtime:db REPLACE *
    sink_tier: low
  db-read:
    aliases:
    - aglint-db-read
    - runtime:db SELECT *
  network:
    aliases:
    - aglint-network
    - network
    - runtime:http *
    sink_tier: low
  auth:
    aliases:
    - aglint-auth
    - auth
    - runtime:auth *
  storage:
    aliases:
    - aglint-storage
    - storage
    - runtime:storage *
  exec:
    aliases:
    - aglint-exec
    - runtime:exec *
  perf:
    aliases:
    - perf
    - performance
runtime:
  expect_hooks:
  - db
  - http
  - auth
  - storage
  - exec
  allowed_modules: null
  guarded: []
ignore_change_kinds:
- format-only
- rename-only
