# AGLint project config for rust, written by `aglint init` (SPEC-v3 section 3.2).
# Commit .aglint/; the cache/ and out/ directories are ignored.
# capabilities: what AGLint checks besides the core (the diff and tool health); a capability not listed
# is off. `aglint capabilities list` shows them all, docs/capabilities/<id>.md explains each.
version: 1
stack: rust
root: scylla-server
base:
  ref: origin/develop
  mode: merge-base
capabilities:
  banned-apis: {}
  layering: {}
  blind-spots: {}
  purity: {}
  outcomes-static: {}
  # runtime-trace traces only the DB-backed tests (tests/integration, `test = false`; the unit tests make no DB or
  # network call). The tests read DATABASE_URL from the environment `aglint check` runs in, and they WIPE that database,
  # so point it at a throwaway one, not the dev stack's odyssey-db on 5432:
  #   DATABASE_URL=postgresql://postgres:password@127.0.0.1:5433/postgres aglint check --root scylla-server
  # setup reuses a Postgres already listening on DATABASE_URL's port (a CI service container); otherwise it starts one
  # there, with docker (compose's postgres:17.2) when its daemon answers, else a throwaway cluster from the local Postgres
  # binaries (pg_config --bindir; as root through `runuser -u postgres`) under /tmp/aglint-trace-pg. The tests wait for
  # it and migrate it themselves. teardown stops only what setup started. Inline, not a script in the repo: setup also
  # runs in the base tree, which may predate it.
  runtime-trace:
    test_targets: [integration]
    setup: |
      : "${DATABASE_URL:?set DATABASE_URL to a throwaway database, e.g. postgresql://postgres:password@127.0.0.1:5433/postgres}"
      port=$(printf %s "$DATABASE_URL" | sed -nE 's#^[^@]*@[^:/]+:([0-9]+).*#\1#p')
      port=${port:-5432}; D=/tmp/aglint-trace-pg
      up() { (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; }
      up && exit 0
      if docker info >/dev/null 2>&1; then
        docker run -d --rm --name aglint-trace-db -e POSTGRES_HOST_AUTH_METHOD=trust -p "127.0.0.1:$port:5432" postgres:17.2 >/dev/null || exit 1
      else
        B=$(pg_config --bindir) || exit 1; as=; [ "$(id -u)" = 0 ] && as="runuser -u postgres --"
        rm -rf "$D" && mkdir -p "$D" && { [ -z "$as" ] || chown postgres "$D"; } || exit 1
        $as "$B/initdb" -D "$D/data" -U postgres --auth=trust >/dev/null || exit 1
        $as "$B/pg_ctl" -D "$D/data" -l "$D/log" -w -o "-p $port -k $D -c listen_addresses=127.0.0.1" start >/dev/null || exit 1
      fi
      for _ in $(seq 60); do up && exit 0; sleep 1; done; exit 1
    teardown: |
      D=/tmp/aglint-trace-pg
      if docker info >/dev/null 2>&1; then docker rm -f aglint-trace-db >/dev/null 2>&1; fi
      if [ -f "$D/data/postmaster.pid" ]; then
        as=; [ "$(id -u)" = 0 ] && as="runuser -u postgres --"
        $as "$(pg_config --bindir)/pg_ctl" -D "$D/data" -m fast stop >/dev/null
      fi
      rm -rf "$D"; exit 0
  behaviour: {}
  perf: {}
  tests: {}
package_manager: cargo
test_runner: cargo-test
app:
  roots:
  - .
  vendor_roots: []
  test_dirs:
  - tests
  crates:
  - scylla-server
  # init guarded tower-http by its name (http); it is server middleware, not an effect crate (trust.yml)
  guarded: []
# Portable tool paths: a bare name is looked up on PATH when AGLint runs (the Rust toolchain with clippy, CodeQL with
# codeql/rust-all@0.2.24, ast-grep, and strace plus binutils for runtime-trace). `aglint doctor` names any that are
# missing, `aglint tools install` prints their install lines. The cargo build needs libpq (libpq-dev) for diesel.
tools:
  cargo:
    path: cargo
    group: core
  clippy:
    path: cargo-clippy
    group: lint
  python3:
    path: python3
    group: core
  ast-grep:
    path: ast-grep
    group: astgrep
  codeql:
    path: codeql
    group: codeql
  # the Semgrep-rules engine (Opengrep; Semgrep CE runs the rules too): needed for semgrep-fast/
  semgrep:
    path: opengrep
    group: semgrep
  strace:
    path: strace
    group: trace
  addr2line:
    path: addr2line
    group: trace
  readelf:
    path: readelf
    group: trace
native:
  clippy: clippy.toml
  layers: layers.toml
  ast_grep: sgconfig.yml
  codeql_queries: codeql/queries
  codeql_models: codeql/models
  codeql_purity: codeql/purity
  # Opengrep stand-ins for the CodeQL outcome analysis: step 05b runs them only when CodeQL is skipped (--fast), so the
  # full profile reports each issue once
  semgrep_fast: semgrep-fast
profiles:
  fast:
    skip_groups:
    - codeql
    required_tools: []
  full:
    skip_groups: []
    required_tools: []
default_profile: full
outputs:
  dir: .aglint/out
  formats:
  - md
  - html
  - sarif
cache_dir: .aglint/cache
warn_exit: 4
