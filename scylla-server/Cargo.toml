[package]
name = "scylla-server"
version = "0.0.1"
edition = "2021"
default-run = "scylla-server"

[dependencies]
diesel = { version = "2.2.12", features = ["postgres", "chrono"] }
dotenvy = "0.15"
serde = "1.0.219"
protobuf-codegen = "3.7.1"
protobuf = { version = "3.7.1", features = ["with-bytes"] }
tokio = { version = "1.45.1", features = ["full", "tracing"] }
axum = { version = "0.8.4", features = ["multipart", "macros"] }
tower = { version = "0.5.2", features = ["timeout"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
socketioxide = { version = "0.17.2", features = ["tracing"] }
rumqttc = { git = "https://github.com/bytebeamio/rumqtt", branch = "main"}
tokio-util = { version=  "0.7.16", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["ansi", "env-filter"] }
console-subscriber = { version = "0.4.1", optional = true }
ringbuffer = "0.15.0"
axum-extra = { version = "0.10.0", features = ["query", "typed-header"] }
clap = { version = "4.5.42", features = ["derive", "env"] }
chrono = { version = "0.4.41", features = ["serde"] }
serde_json = "1.0.140"
diesel_migrations = { version = "2.2.0", features = ["postgres"] }
regex = "1.11.1"
rangemap = "1.6.0"
axum-macros = "0.5.0"
diesel-async = { version = "0.5.2", features = ["postgres", "bb8", "async-connection-wrapper", "sync-connection-wrapper", "tokio"] }
rustc-hash = "2.1.1"
evalexpr = "12.0.2"
serde_with = "3.12.0"
derive_more = { version = "2.0.1", features = ["as_ref", "display"] }
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"


[features]
top = ["dep:console-subscriber"]

[build-dependencies]
protobuf-codegen = "3.7.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true  # Automatically strip symbols from the binary.

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bin]]
name = "scylla-server"
path = "src/main.rs"

