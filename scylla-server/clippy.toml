# AGLint Boundaries for clippy, written by `aglint init` (the runner enables only the disallowed_* lints). Paths are
# resolved, so a renamed import or a re-export alias does not hide a call. Existing findings are not new, so only a
# change that adds one is flagged.
# ARGOS: DB queries go through src/services/ only. src/lib.rs allows these lints on that module, so a Diesel query
# anywhere else (controllers, processors, the socket handler) is a new finding. The paths are diesel's and
# diesel-async's public re-exports; clippy warns at startup when one no longer resolves.
disallowed-methods = [
  { path = "diesel_async::RunQueryDsl::load", reason = "DB queries go through src/services/" },
  { path = "diesel_async::RunQueryDsl::load_stream", reason = "DB queries go through src/services/" },
  { path = "diesel_async::RunQueryDsl::execute", reason = "DB queries go through src/services/" },
  { path = "diesel_async::RunQueryDsl::get_result", reason = "DB queries go through src/services/" },
  { path = "diesel_async::RunQueryDsl::get_results", reason = "DB queries go through src/services/" },
  { path = "diesel_async::RunQueryDsl::first", reason = "DB queries go through src/services/" },
  { path = "diesel::insert_into", reason = "DB queries go through src/services/" },
  { path = "diesel::update", reason = "DB queries go through src/services/" },
  { path = "diesel::delete", reason = "DB queries go through src/services/" },
  { path = "diesel::sql_query", reason = "DB queries go through src/services/" },
  { path = "std::fs::write", reason = "file writes only through the storage chokepoint", allow-invalid = true },
]
disallowed-types = [
  { path = "std::process::Command", reason = "no subprocesses in application code", allow-invalid = true },
]
