services:
  scylla-server: # do not run scylla
    entrypoint: ["echo", "DISABLED"]
    restart: "no"

  client:
    extends:
      file: ../angular-client/compose.client.yml
      service: client
    build:
      context: ../angular-client
    environment:
      BACKEND_URL: http://127.0.0.1:${SCYLLA_HOST_PORT:-8000}

  siren:
    extends:
      file: ../siren-base/compose.siren.yml
      service: siren

  calypso:
    extends:
      file: ../siren-base/compose.calypso.yml
      service: calypso
    # this profile runs Mosquitto, so drive Calypso over MQTT not Zenoh
    environment:
      - CALYPSO_ZENOH=false
      - CALYPSO_SIREN_HOST_URL=siren:1883
    depends_on:
      - siren
