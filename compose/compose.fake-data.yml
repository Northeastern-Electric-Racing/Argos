services:
  scylla-server: # do not run scylla
    entrypoint: ["echo", "DISABLED"]
    restart: "no"
  siren:
    extends:
      file: ../siren-base/compose.siren.yml
      service: siren

  grafana:
    extends:
      file: ../siren-base/compose.grafana.yml
      service: grafana
    depends_on:
      - siren

  calypso:
    extends:
      file: ./compose.calypso.yml
      service: calypso
    depends_on:
      - siren
