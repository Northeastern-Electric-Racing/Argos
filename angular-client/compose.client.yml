services:
  client:
    restart: unless-stopped
    image: ghcr.io/northeastern-electric-racing/argos-client:develop
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    ports:
      - ${CLIENT_HOST_PORT:-80}:80
    cpu_shares: 512

    environment:
      BACKEND_URL: "http://192.168.100.11:8000"
      MAP_PMTILES_URL: ${MAP_PMTILES_URL:-}
