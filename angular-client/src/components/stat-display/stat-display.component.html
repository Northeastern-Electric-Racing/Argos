@if (headerLabel()) {
  <div class="mb-1 flex items-center gap-1.5 whitespace-nowrap">
    @if (headerIcon()) {
      <span class="flex h-4.25 w-3.25 shrink-0"><ui-icon [svg]="headerIcon()" size="inline" /></span>
    }
    <span class="font-sans text-sm font-normal whitespace-nowrap text-fg">{{ headerLabel() }}</span>
  </div>
}

<div [class]="valueRowClass()">
  <span class="m-0 font-sans text-xl leading-none font-extrabold text-fg">{{ formattedValue() }}</span>
  <span [class]="unitClass()">{{ unit() }}</span>
  @if (connectionDotStatusColor(); as statusColor) {
    <connection-dot-with-message class="ml-1.25" [getStatusColor]="statusColor" />
  }
  <ng-content />
</div>

@if (subtitle()) {
  <span class="mt-0.5 text-center font-sans text-sm font-bold whitespace-nowrap text-fg-label">{{ subtitle() }}</span>
}
