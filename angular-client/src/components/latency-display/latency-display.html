<info-background title="Latency" svgIcon="speed">
  <hstack spacing="20px">
    <vstack class="pb-10">
      <typography variant="subheader" content="Old" />
      <div class="flex h-2.5 items-center justify-center">
        <div class="mr-2.5 size-2.5 rounded-full" [style.background-color]="mapColor(latency, medVal())"></div>
        <typography variant="subheader" [content]="latency.toString()" />
        <typography variant="info-unit" content="ms" textClass="pt-1.25 text-sm" />
      </div>
    </vstack>

    <divider class="h-17.5" />

    <vstack class="pb-10">
      <typography variant="subheader" content="New" />
      <div class="flex h-2.5 items-center justify-center">
        <div class="mr-2.5 size-2.5 rounded-full" [style.background-color]="mapColor(newLatency, medVal())"></div>
        <typography variant="subheader" [content]="newLatency.toString()" />
        <typography variant="info-unit" content="ms" textClass="pt-1.25 text-sm" />
      </div>
    </vstack>
  </hstack>
</info-background>
