<info-background title="Acceleration" svgIcon="speed">
  <vstack>
    <hstack class="w-full">
      <div class="flex h-62.5 w-7/10 flex-col items-center justify-center">
        <graph-component [data]="xData" color="#4d9ac9" title="Longitudinal Acceleration" graphContainerId="xGraph" />
        <typography variant="info-subtitle" content="Longitudinal Acceleration" textClass="m-0 mt-2.5" />
      </div>
      <div class="flex">
        <div class="mx-7.5 h-50 w-0.5 bg-border"></div>
        <div class="flex flex-col items-center justify-center">
          <div class="flex items-end">
            <typography variant="header" content="{{ xMax }}" textClass="m-0 p-0 text-2xl" />
            <typography variant="info-subtitle" content="g" textClass="m-0 mb-2.5 text-lg text-fg-muted" />
          </div>
          <typography variant="info-subtitle" content="Peak Long. Accel." />
        </div>
      </div>
    </hstack>
    <div class="h-0.5 w-full bg-border"></div>
    <hstack class="w-full">
      <div class="flex h-62.5 w-7/10 flex-col items-center justify-center">
        <graph-component [data]="yData" color="#17ff00" title="Lateral Acceleration" graphContainerId="yGraph" />
        <typography variant="info-subtitle" content="Lateral Acceleration" textClass="m-0 mt-2.5" />
      </div>
      <div class="flex">
        <div class="mx-7.5 h-50 w-0.5 bg-border"></div>
        <div class="flex flex-col items-center justify-center">
          <div class="flex items-end">
            <typography variant="header" content="{{ yMax }}" textClass="m-0 p-0 text-2xl" />
            <typography variant="info-subtitle" content="g" textClass="m-0 mb-2.5 text-lg text-fg-muted" />
          </div>
          <typography variant="info-subtitle" content="Peak Lat. Accel." />
        </div>
      </div>
    </hstack>
  </vstack>
</info-background>
