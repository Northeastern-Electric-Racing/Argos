<info-background svgIcon="timer" title="Timer">
  <div class="flex h-4/5 items-center justify-center pt-5">
    <vstack spacing="10px" class="pl-5">
      <hstack>
        <typography variant="info-subtitle" content="CURRENT:" textClass="text-sm" />
        <typography variant="info-subtitle" [content]="getCurrentTime()" [textClass]="readout" />
      </hstack>
      <hstack spacing="42px">
        <typography variant="info-subtitle" content="TOTAL:" textClass="text-sm" />
        <typography variant="info-subtitle" [content]="getTotalTime()" [textClass]="readout" />
      </hstack>
    </vstack>
  </div>
</info-background>
