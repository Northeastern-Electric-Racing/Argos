<form [class]="classes.form" [formGroup]="form">
  @for (field of fields(); track field) {
    <div [class]="classes.field">
      @if (field.label) {
        <label uiLabel [for]="'form-field-' + field.name">
          {{ field.label }}
          @if (field.required) {
            <span [class]="classes.required" aria-hidden="true">*</span>
          }
        </label>
      }
      <input
        uiInput
        class="w-full"
        [id]="'form-field-' + field.name"
        [attr.placeholder]="field.placeholder"
        [formControlName]="field.name"
        [type]="field.type"
        [value]="'boston'"
        [attr.aria-required]="field.required || null"
        [attr.aria-invalid]="isInvalid(field.name) || null"
        [attr.aria-describedby]="isInvalid(field.name) ? 'form-field-' + field.name + '-error' : null"
      />

      @if (isInvalid(field.name)) {
        <small uiFieldError [id]="'form-field-' + field.name + '-error'">
          {{ getErrorMessage(field) }}
        </small>
      }
    </div>
  }

  <div [class]="classes.actions">
    <button uiButton type="button" [disabled]="!form.valid" (click)="onSubmit()">Submit</button>
  </div>
</form>
