<form class="form" [formGroup]="form">
  <div hlmFieldGroup>
    @for (field of fields(); track field) {
      <div hlmField>
        @if (field.label) {
          <label hlmFieldLabel [for]="'form-field-' + field.name" class="required">{{ field.label }}</label>
        }
        <input
          hlmInput
          [id]="'form-field-' + field.name"
          [attr.placeholder]="field.placeholder"
          [formControlName]="field.name"
          [type]="field.type"
        />
        <hlm-field-error>{{ getErrorMessage(field) }}</hlm-field-error>
      </div>
    }

    <button hlmBtn type="button" [disabled]="!form.valid" (click)="onSubmit()">Submit</button>
  </div>
</form>
