<!-- dynamic-form.component.html -->
<form class="form" [formGroup]="form">
  @for (field of fields(); track field) {
    <div class="field">
      @if (field.label) {
        <label class="field-label" [class.required]="field.required" [for]="'form-field-' + field.name">{{
          field.label
        }}</label>
      }
      <input
        [id]="'form-field-' + field.name"
        [attr.placeholder]="field.placeholder"
        [formControlName]="field.name"
        [type]="field.type"
        pInputText
        [fluid]="true"
        [invalid]="isInvalid(field)"
      />

      <!-- Error Message -->
      @if (isInvalid(field)) {
        <div class="error-msg">
          {{ getErrorMessage(field) }}
        </div>
      }
    </div>
  }

  <button pButton type="button" [disabled]="!form.valid" (click)="onSubmit()"><span pButtonLabel>Submit</span></button>
</form>
