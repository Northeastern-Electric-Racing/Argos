<!-- dynamic-form.component.html -->
<form tuiForm="m" [formGroup]="form" (submit.prevent)="onSubmit()">
  @for (field of fields(); track field) {
    <tui-textfield>
      @if (field.label) {
        <label tuiLabel>{{ field.label }}</label>
      }
      <input tuiInput [attr.placeholder]="field.placeholder" [formControlName]="field.name" [type]="field.type" />
    </tui-textfield>
    <tui-error [error]="form.get(field.name)?.touched ? getErrorMessage(field) || null : null" />
  }

  <footer>
    <button tuiButton type="submit" [disabled]="!form.valid">Submit</button>
  </footer>
</form>
