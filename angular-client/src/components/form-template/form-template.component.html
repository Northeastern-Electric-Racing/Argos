<form nz-form nzLayout="vertical" class="form" [formGroup]="form">
  @for (field of fields(); track field) {
    <nz-form-item>
      @if (field.label) {
        <nz-form-label [nzFor]="'form-' + field.name" nzRequired>{{ field.label }}</nz-form-label>
      }
      <nz-form-control [nzErrorTip]="errorTip">
        <input
          [id]="'form-' + field.name"
          [attr.placeholder]="field.placeholder"
          [formControlName]="field.name"
          [type]="field.type"
          [value]="'boston'"
          nz-input
        />
        <ng-template #errorTip>{{ getErrorMessage(field) }}</ng-template>
      </nz-form-control>
    </nz-form-item>
  }

  <button nz-button nzType="primary" type="button" [disabled]="!form.valid" (click)="onSubmit()">Submit</button>
</form>
