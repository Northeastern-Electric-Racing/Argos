<info-background svgIcon="back_hand" title="Brake Pressure">
  <hstack style="width: 100%; height: 100%">
    <vstack style="width: 50%">
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px">
        <div style="display: flex; align-items: center">
          <typography variant="info-value" [content]="brakePressureFront.toString()" />
          <typography variant="info-unit" content="psi" />
        </div>
        <typography variant="info-subtitle" content="Front Sensor"></typography>
      </div>
    </vstack>
    <divider style="height: 150px" />
    <vstack style="width: 50%">
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px">
        <div style="display: flex; align-items: center">
          <typography variant="info-value" [content]="brakePressureBack.toString()" />
          <typography variant="info-unit" content="psi" />
        </div>
        <typography variant="info-subtitle" content="Back Sensor"></typography>
      </div>
    </vstack>
  </hstack>
</info-background>
