<!-- A fixed id: Brain numbers template and service dialogs from separate counters, so its default
     brn-dialog-N id can match an open HlmDialogService dialog and the confirm would never open. -->
<hlm-alert-dialog
  id="argos-confirm"
  [state]="confirmService.pending() ? 'open' : 'closed'"
  (stateChanged)="onStateChanged($event)"
  (closed)="onClosed()"
>
  <hlm-alert-dialog-content *hlmAlertDialogPortal="let ctx" class="w-[calc(100vw-2rem)] sm:w-md">
    @if (confirmService.pending(); as question) {
      <hlm-alert-dialog-header>
        <h2 hlmAlertDialogTitle>{{ question.header }}</h2>
        <p hlmAlertDialogDescription>{{ question.message }}</p>
      </hlm-alert-dialog-header>
      <hlm-alert-dialog-footer>
        <button hlmAlertDialogCancel (click)="confirmService.answer(false)">{{ question.rejectLabel ?? 'Cancel' }}</button>
        <button
          hlmAlertDialogAction
          [variant]="question.destructive ? 'destructive' : 'default'"
          (click)="confirmService.answer(true)"
        >
          {{ question.acceptLabel ?? 'Confirm' }}
        </button>
      </hlm-alert-dialog-footer>
    }
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
