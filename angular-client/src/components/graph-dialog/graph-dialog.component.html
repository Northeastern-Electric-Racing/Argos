@if (header) {
  <h2 mat-dialog-title>{{ header }}</h2>
}
<mat-dialog-content>
  <div class="graph-container">
    <graph-component
      style="height: 100%; width: 100%"
      [graphContainerId]="graphContainerId"
      [data]="data"
      [title]="title"
      [color]="color"
    />
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Close</button>
</mat-dialog-actions>
