<!-- A native button, so every nav item is reachable and operable from the keyboard; the host's (click) handles it. -->
<button type="button" [class]="classes.chip" [attr.aria-current]="active() ? 'page' : null">
  <ui-icon [class]="classes.icon" [size]="small() ? 'lg' : 'xl'" [svg]="icon()" />
  <typography textClass="text-inherit" [variant]="small() ? 'sidebar-label' : 'header'" [content]="value()" />
</button>
