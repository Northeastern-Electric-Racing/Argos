<info-background svgIcon="electric_car" title="Motor">
  <div [class]="layout.row">
    <hstack>
      <vstack class="pl-5">
        <hstack spacing="5px">
          <typography variant="info-value" [content]="motorTemp.toString() + '°'" />
          <typography variant="info-unit" [content]="'C'" />
          <div class="ml-2.5 flex h-18.5 w-7 items-center justify-center">
            <thermometer [temperature]="motorTemp" [min]="-15" [max]="30" />
          </div>
        </hstack>
        <typography variant="info-subtitle" content="Motor Temp" />
      </vstack>

      <divider class="h-19.5" />

      <vstack>
        <hstack spacing="0px">
          <vstack spacing="0px">
            <hstack spacing="5px">
              <typography variant="info-value" [content]="getTotalUsage([motorUsage, coolUsage]).toString()" />
              <typography variant="info-unit" [content]="'kWh'" />
            </hstack>
            <typography variant="info-subtitle" content="Total Motor Usage" />
          </vstack>
        </hstack>
      </vstack>
    </hstack>
    <pie-chart [class]="layout.pie" [data]="piechartData" title="Current Motor Usage" />
  </div>
</info-background>
