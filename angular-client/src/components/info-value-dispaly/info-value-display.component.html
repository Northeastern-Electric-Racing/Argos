<vstack spacing="0px" [style]="containerStyle()">
  <hstack spacing="5px" [style]="valueUnitContainerStyle()">
    @if (this.boolValue() !== undefined) {
      <typography variant="info-value" [content]="this.boolValue() ? 'YES' : 'NO'" [additionalStyles]="this.valueStyle()" />
      <typography variant="info-unit" [content]="this.unit()" [additionalStyles]="this.unitStyle()" />
    } @else {
      <typography
        class="-mb-2.5"
        variant="info-value"
        [content]="this.formattedValue()"
        [additionalStyles]="this.valueStyle()"
      />
      <typography variant="info-unit" [content]="this.unit()" [additionalStyles]="this.unitStyle()" />
    }

    @if (this.enableWidget() && this.widget(); as widget) {
      @switch (widget.type) {
        @case ('thermometer-config') {
          <div class="flex h-22.5 w-8.75 items-center justify-center self-start">
            <thermometer [temperature]="widget.currentValue" [min]="widget.min" [max]="widget.max" />
          </div>
        }
        @case ('battery-config') {
          <battery-percentage [percentage]="widget.percentage" [height]="widget.height" [width]="widget.width" />
        }
        @case ('connection-dot-config') {
          <connection-dot-with-message
            class="ml-1.25"
            [getStatusColor]="widget.getStatusColor"
            [getStatusMessage]="this.getStatusMessage(widget)"
          />
        }
      }
    }
  </hstack>

  @if (this.subtitle() !== '') {
    <typography
      variant="info-subtitle"
      [content]="subtitle()"
      [textClass]="this.subtitleClass()"
      [additionalStyles]="this.subtitleStyle()"
    />
  }
</vstack>
