<div [class]="panelClass()" [style.padding]="padding()" [style.background-color]="backgroundColor()">
  @if (title()) {
    <div class="flex items-center gap-1 text-fg">
      @if (icon()) {
        <ui-icon size="sm" [name]="icon()" />
      }
      @if (svgIcon()) {
        <ui-icon size="sm" [svg]="svgIcon()" />
      }
      <span class="font-sans text-sm font-medium whitespace-nowrap">{{ title() }}</span>
    </div>
  }
  <ng-content />
</div>
