<div class="battery">
  <div
    class="nub"
    (click)="toggleIsCorrect()"
    [style]="{
      height: nubHeight(),
      width: nubWidth(),
      'background-color': clicked ? 'grey' : backgroundColor,
      'border-top-left-radius': roundCorner(),
      'border-top-right-radius': roundCorner()
    }"
  ></div>
  <div
    class="battery-bar"
    [style]="{
      'background-color': backgroundColor,
      height: heightpx(),
      width: widthpx(),
      'border-top-left-radius': roundCorner(),
      'border-top-right-radius': roundCorner(),
      'border-bottom-left-radius': roundCorner(),
      'border-bottom-right-radius': roundCorner()
    }"
  >
    <div
      [style]="{
        'background-color': getFillColor(percentage()),
        height: getFillHeight(percentage()),
        width: fillWidth(),
        'margin-top': fillMarginBottom(),
        'border-radius': '8px'
      }"
    ></div>
  </div>
</div>
