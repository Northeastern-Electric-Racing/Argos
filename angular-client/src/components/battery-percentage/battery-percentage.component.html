<div class="flex flex-col items-center" aria-hidden="true">
  <div
    data-battery-nub
    [class]="nubClass()"
    [attr.data-clicked]="clicked()"
    (click)="toggleIsCorrect()"
    [style]="{
      height: nubHeight(),
      width: nubWidth(),
      'border-top-left-radius': roundCorner(),
      'border-top-right-radius': roundCorner()
    }"
  ></div>
  <div
    data-battery-bar
    class="flex rotate-180 flex-col items-center bg-battery-shell"
    [style]="{
      height: heightpx(),
      width: widthpx(),
      'border-radius': roundCorner()
    }"
  >
    <div
      data-battery-fill
      class="rounded-md"
      [attr.data-level]="level()"
      [style]="{
        'background-color': fillColor(),
        height: getFillHeight(percentage()),
        width: fillWidth(),
        'margin-top': fillMarginBottom()
      }"
    ></div>
  </div>
</div>
