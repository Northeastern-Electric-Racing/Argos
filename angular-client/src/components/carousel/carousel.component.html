<hlm-dialog-header>
  <h2 hlmDialogTitle>Select a run to view</h2>
</hlm-dialog-header>
<div class="modal-container">
  <hlm-carousel class="mx-12 block" [options]="carouselOptions" [plugins]="plugins">
    <hlm-carousel-content>
      @for (run of runs; track run.id) {
        <hlm-carousel-item>
          <section hlmCard size="sm" class="run-card" [attr.aria-label]="'Run ' + run.id">
            <div hlmCardHeader>
              <h3 hlmCardTitle>Run #{{ run.id }}</h3>
              <p hlmCardDescription>{{ datePipe(run.time) }}</p>
              <div hlmCardAction class="text-sm font-medium">{{ run.driverName }}</div>
            </div>
            <div hlmCardContent class="text-muted-foreground">{{ run.locationName }}</div>
            <div hlmCardFooter class="justify-end">
              <button hlmBtn size="sm" type="button" (click)="selectRun(run)">Select this Run</button>
            </div>
          </section>
        </hlm-carousel-item>
      }
    </hlm-carousel-content>
    <button hlm-carousel-previous></button>
    <button hlm-carousel-next></button>
  </hlm-carousel>
</div>
