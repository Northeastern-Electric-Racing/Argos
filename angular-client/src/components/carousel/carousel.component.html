<section
  class="modal-container"
  aria-roledescription="carousel"
  aria-label="Runs"
  (mouseenter)="setPaused(true)"
  (mouseleave)="setPaused(false)"
  (focusin)="setPaused(true)"
  (focusout)="setPaused(false)"
>
  @if (currentRun(); as run) {
    <div class="carousel-row">
      <button type="button" class="nav-button" aria-label="Previous run" (click)="prev()">
        <mat-icon aria-hidden="true">chevron_left</mat-icon>
      </button>
      <div
        class="slide"
        role="group"
        aria-roledescription="slide"
        [attr.aria-label]="currentIndex() + 1 + ' of ' + runs.length"
        aria-live="polite"
      >
        <div class="run-card">
          <mat-grid-list cols="2" rowHeight="40px">
            <mat-grid-tile>
              <typography class="left" variant="subheader" [content]="'Run #' + run.id"></typography>
            </mat-grid-tile>
            <mat-grid-tile>
              <typography class="right" variant="subheader" [content]="run.driverName"></typography>
            </mat-grid-tile>
            <mat-grid-tile>
              <typography class="left" variant="subheader" [content]="datePipe(run.time)"></typography>
            </mat-grid-tile>
            <mat-grid-tile colspan="2">
              <typography variant="subheader" class="right" [content]="run.locationName"></typography>
            </mat-grid-tile>
          </mat-grid-list>
        </div>
        <div class="select-button-container">
          <button type="button" class="ui-button run-select-button" (click)="selectRun(run)">Select this Run</button>
        </div>
      </div>
      <button type="button" class="nav-button" aria-label="Next run" (click)="next()">
        <mat-icon aria-hidden="true">chevron_right</mat-icon>
      </button>
    </div>
    @if (runs.length <= 12) {
      <div class="indicators">
        @for (r of runs; track r.id; let i = $index) {
          <button
            type="button"
            class="indicator"
            [attr.aria-current]="i === currentIndex()"
            [attr.aria-label]="'Show run ' + r.id"
            (click)="goTo(i)"
          ></button>
        }
      </div>
    } @else {
      <div class="counter">{{ currentIndex() + 1 }} / {{ runs.length }}</div>
    }
  } @else {
    <p class="empty">No runs yet</p>
  }
</section>
