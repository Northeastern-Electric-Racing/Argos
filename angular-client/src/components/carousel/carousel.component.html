<div class="modal-container">
  <button
    appearance="secondary"
    iconStart="@tui.chevron-left"
    size="s"
    tuiIconButton
    type="button"
    [disabled]="!runs.length"
    (click)="carousel.prev()"
  >
    Previous run
  </button>
  <tui-carousel #carousel class="carousel" [duration]="3000" [(index)]="index">
    <div *tuiItem="let i" class="slide">
      @if (runAt(i); as run) {
        <div class="run-card">
          <mat-grid-list cols="2" rowHeight="40px">
            <mat-grid-tile>
              <typography class="left" variant="subheader" [content]="'Run #' + run.id"></typography>
            </mat-grid-tile>
            <mat-grid-tile>
              <typography class="right" variant="subheader" [content]="run.driverName"></typography>
            </mat-grid-tile>
            <mat-grid-tile>
              <typography class="left" variant="subheader" [content]="datePipe(run.time)"></typography>
            </mat-grid-tile>
            <mat-grid-tile colspan="2">
              <typography variant="subheader" class="right" [content]="run.locationName"></typography>
            </mat-grid-tile>
          </mat-grid-list>
        </div>

        <div class="select-button-container">
          <button appearance="outline" size="m" tuiButton type="button" (click)="selectRun(run)">Select this Run</button>
        </div>
      }
    </div>
  </tui-carousel>
  <button
    appearance="secondary"
    iconStart="@tui.chevron-right"
    size="s"
    tuiIconButton
    type="button"
    [disabled]="!runs.length"
    (click)="carousel.next()"
  >
    Next run
  </button>
</div>
