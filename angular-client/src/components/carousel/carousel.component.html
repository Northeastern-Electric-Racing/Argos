<p-carousel
  [value]="runs"
  [numVisible]="1"
  [numScroll]="1"
  [circular]="true"
  [autoplayInterval]="3000"
  (onPage)="handlePageChange($event)"
>
  <ng-template let-run #item>
    <div class="run-slide">
      <div class="run-card">
        <div class="run-card-header">
          <span class="run-id">Run #{{ run.id }}</span>
          <span class="run-meta"><i class="pi pi-user" aria-hidden="true"></i>{{ run.driverName }}</span>
        </div>
        <div class="run-card-footer">
          <span class="run-meta"><i class="pi pi-calendar" aria-hidden="true"></i>{{ datePipe(run.time) }}</span>
          <span class="run-meta"><i class="pi pi-map-marker" aria-hidden="true"></i>{{ run.locationName }}</span>
        </div>
      </div>
      <p-button label="Select this Run" icon="pi pi-check" (onClick)="selectRun(run)" />
    </div>
  </ng-template>
</p-carousel>
