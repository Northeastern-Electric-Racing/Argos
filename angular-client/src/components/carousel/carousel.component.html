<nz-carousel nzArrows nzAutoPlay [nzAutoPlaySpeed]="3000" (nzAfterChange)="updateIndex($event)">
  @for (run of runs; track run.id) {
    <div nz-carousel-content>
      <div class="slide">
        <nz-descriptions nzBordered nzSize="small" [nzColumn]="1" [nzTitle]="'Run #' + run.id">
          <nz-descriptions-item nzTitle="Driver">{{ run.driverName || '—' }}</nz-descriptions-item>
          <nz-descriptions-item nzTitle="Location">{{ run.locationName || '—' }}</nz-descriptions-item>
          <nz-descriptions-item nzTitle="Started">{{ datePipe(run.time) }}</nz-descriptions-item>
        </nz-descriptions>
        <button nz-button nzType="primary" class="select-button" (click)="selectRun(run)">Select this Run</button>
      </div>
    </div>
  }
</nz-carousel>
