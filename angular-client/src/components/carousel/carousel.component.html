<h2 mat-dialog-title>Select a run to view</h2>
<mat-dialog-content>
  @if (runs.length === 0) {
    <p class="empty">No runs recorded yet.</p>
  } @else {
    <mat-action-list class="run-list">
      @for (run of runs; track run.id) {
        <button mat-list-item (click)="selectRun(run)">
          <span matListItemTitle>Run #{{ run.id }} · {{ run.driverName || 'No driver' }}</span>
          <span matListItemLine>{{ run.time | date: 'M/d/yy, HH:mm:ss' }} · {{ run.locationName || 'No location' }}</span>
        </button>
      }
    </mat-action-list>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancel</button>
</mat-dialog-actions>
