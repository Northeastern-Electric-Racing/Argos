<div class="section-header">
  <span class="section-title">{{ leftTitle() }}</span>
  @for (config of selectorConfigs(); track config.placeholder) {
    <!-- The options are longer than the trigger, so let the panel fit them rather than wrap -->
    <select-dropdown
      [options]="config.options"
      [placeholder]="config.placeholder"
      [defaultValue]="config.defaultValue"
      [panelWidth]="null"
    />
  }
  @if (rightTitle(); as right) {
    <span class="section-title section-title-right">{{ right }}</span>
  }
</div>
