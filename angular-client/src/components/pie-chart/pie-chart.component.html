<!-- Chart.js sizes the canvas to this box (responsive, no fixed aspect ratio) -->
<div class="relative size-full" [style.background-color]="backgroundColor()">
  <canvas
    baseChart
    type="pie"
    [data]="chartData()"
    [options]="chartOptions()"
    role="img"
    [attr.aria-label]="title()"
  ></canvas>
</div>
