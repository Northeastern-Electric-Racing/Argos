<info-background>
  <div
    class="flex items-center justify-center rounded-full"
    [style]="{
      background:
        'conic-gradient(from 180deg, ' +
        ringColor() +
        ' ' +
        getFilledAngle(percentage()) +
        'deg, black ' +
        getFilledAngle(percentage()) +
        'deg ' +
        emptyAngle +
        'deg)',
      height: dimension() + 'px',
      width: dimension() + 'px'
    }"
  >
    <div
      class="flex items-center justify-center rounded-full bg-panel"
      data-part="inner"
      [style.height.px]="innerCircleDimension()"
      [style.width.px]="innerCircleDimension()"
    >
      <div class="flex flex-row items-end">
        <p [class]="valueClass" [style.font-size.px]="percentageFontSize()">{{ percentage() }}</p>
        <p
          [class]="signClass"
          [style.font-size.px]="percentageSignFontSize()"
          [style.margin-bottom.px]="percentageSignOffset()"
        >
          %
        </p>
      </div>
    </div>
  </div>
</info-background>
