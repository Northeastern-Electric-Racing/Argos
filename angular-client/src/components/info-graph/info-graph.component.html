<info-background [svgIcon]="icon()" [title]="title()">
  <button type="button" [class]="opener" [attr.aria-label]="'Click for more details: ' + title()" (click)="openDialog()">
    <typography textClass="text-left" variant="info-subtitle" content="Click for more details" />
    <graph-component class="h-50 w-full" [data]="data()" [title]="subTitle()" [color]="color()" />
  </button>
</info-background>
