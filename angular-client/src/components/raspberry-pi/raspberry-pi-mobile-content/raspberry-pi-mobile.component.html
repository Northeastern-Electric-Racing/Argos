<vstack class="w-full">
  <hstack class="h-full w-full">
    <vstack class="w-1/3">
      <circular-percentage [percentage]="cpuUsage()" [dimension]="85" [ringColor]="colorRed" />

      <typography variant="info-subtitle" content="CPU Usage" />
    </vstack>
    <divider class="h-25" />

    <vstack class="w-1/3">
      <hstack>
        <typography variant="info-value" [content]="cpuTemp().toString() + '°'" />
        <div class="flex h-27.5 w-10 items-center justify-center">
          <thermometer [temperature]="cpuTemp()" [min]="-15" [max]="30" />
        </div>
      </hstack>
      <typography variant="info-subtitle" content="CPU Temp" />
    </vstack>

    <divider class="h-25" />

    <vstack class="w-1/3">
      <hstack class="h-27.5">
        <typography variant="info-value" [content]="mcs().toString()" />
      </hstack>
      <typography variant="info-subtitle" content="MCS" />
    </vstack>
  </hstack>

  <hstack class="w-1/2">
    <vstack class="w-1/2">
      <circular-percentage [percentage]="ramUsage()" [dimension]="85" [ringColor]="colorPurple" />
      <div class="flex items-center justify-center">
        <typography variant="info-subtitle" content="RAM Usage" />
      </div>
    </vstack>

    <divider class="h-25" />

    <vstack class="w-1/2">
      <hstack class="h-27.5">
        <typography variant="info-value" [content]="wifiRSSI().toString()" />
        <div>
          <ui-icon svg="wifi" [class]="wifi.icon" />
          <span [class]="wifi.unit">dBM</span>
        </div>
      </hstack>
      <typography variant="info-subtitle" content="Wi-Fi RSSI" />
    </vstack>
  </hstack>
</vstack>
