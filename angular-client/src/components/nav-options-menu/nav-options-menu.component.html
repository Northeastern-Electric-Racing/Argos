<div class="menu-container">
  <div class="menu-grid">
    @for (menuItem of menuItems(); track menuItem) {
      <button type="button" class="menu-item" (click)="select(menuItem)" [attr.data-id]="menuItem.id">
        <mat-icon class="menu-icon" [svgIcon]="menuItem.icon" />
        <span class="menu-label">{{ menuItem.label }}</span>
      </button>
    }
  </div>
</div>
