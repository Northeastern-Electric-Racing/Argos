<div class="menu-container">
  <!-- The dropdown panel is the listbox; tuiOption gives each item role="option" and arrow-key focus -->
  <tui-data-list class="menu-grid">
    @for (menuItem of items(); track menuItem) {
      <button tuiOption type="button" class="menu-item" (click)="itemClick.emit(menuItem)" [attr.data-id]="menuItem.id">
        <mat-icon class="menu-icon" [svgIcon]="menuItem.icon" />
        <span class="menu-label">{{ menuItem.label }}</span>
      </button>
    }
  </tui-data-list>
</div>
