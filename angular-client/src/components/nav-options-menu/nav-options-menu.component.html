<div class="menu-container">
  <div class="menu-grid">
    <div *ngFor="let item of menuItems" class="menu-item" (click)="item.onclick()" [attr.data-id]="item.id">
      <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
      <span class="menu-label">{{ item.label }}</span>
    </div>
  </div>
</div>
