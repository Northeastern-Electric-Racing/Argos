<div class="menu-container">
  <div class="menu-grid">
    @for (menuItem of menuItems; track menuItem) {
      @if (menuItem.route) {
        <div class="menu-item" [routerLink]="menuItem.route" [attr.data-id]="menuItem.route">
          <mat-icon class="menu-icon" [svgIcon]="menuItem.icon" />
          <span class="menu-label">{{ menuItem.label }}</span>
        </div>
      } @else {
        <div class="menu-item" (click)="menuItem.action!()">
          <mat-icon class="menu-icon" [svgIcon]="menuItem.icon" />
          <span class="menu-label">{{ menuItem.label }}</span>
        </div>
      }
    }
  </div>
</div>
