<ng-template #panel>
  <div class="ui-drawer" [attr.data-position]="position()">
    <header class="ui-drawer-header">
      <div class="ui-drawer-title"><ng-content select="[uiDrawerHeader]" /></div>
      <button type="button" class="ui-drawer-close" aria-label="Close" (click)="close()">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </header>
    <div class="ui-drawer-body"><ng-content /></div>
  </div>
</ng-template>
