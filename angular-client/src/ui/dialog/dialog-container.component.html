<div [class]="classes.surface" cdkDrag cdkDragRootElement=".cdk-overlay-pane" [cdkDragDisabled]="!_config.uiDraggable">
  <header [class]="classes.header" cdkDragHandle [class.cursor-move]="_config.uiDraggable">
    <h2 [class]="classes.title" [id]="_config.uiTitleId">{{ _config.uiHeader }}</h2>
  </header>
  <div [class]="classes.content">
    <ng-template cdkPortalOutlet />
  </div>
  <!-- After the content in DOM order, so the CDK's first-tabbable focus lands on the content. -->
  <button type="button" uiIconButton [class]="classes.close" aria-label="Close" (click)="close()">
    <ui-icon name="close" />
  </button>
</div>
