<div
  ngCombobox
  #combobox="ngCombobox"
  [class]="triggerClass()"
  [id]="inputId()"
  [attr.aria-label]="ariaLabel() ?? placeholder()"
  [disabled]="disabled()"
  [(expanded)]="expanded"
  [preserveContent]="true"
>
  <span class="pointer-events-none truncate" [class.text-fg-muted]="display() === undefined">{{
    display() ?? placeholder()
  }}</span>
  <span [class]="arrowClass" aria-hidden="true"><mat-icon [class]="arrowIcon">expand_more</mat-icon></span>
</div>

<ng-template
  [cdkConnectedOverlay]="{ origin: combobox.element, usePopover: 'inline', minWidth: popupMinWidth() }"
  [cdkConnectedOverlayOpen]="expanded()"
>
  <ng-template ngComboboxPopup [combobox]="combobox">
    <div [class]="popupClass()">
      <div
        #listbox="ngListbox"
        ngListbox
        ngComboboxWidget
        [class]="lb.listbox"
        [tabindex]="-1"
        focusMode="activedescendant"
        selectionMode="explicit"
        [value]="selectedValues()"
        (valueChange)="onValuesChange($event)"
        [activeDescendant]="listbox.activeDescendant()"
        (click)="commit()"
        (keydown.enter)="commit()"
        (keydown.space)="commit()"
      >
        @for (option of options(); track $index) {
          <div ngOption [class]="lb.option" [value]="option" [label]="labelOf(option)" [title]="labelOf(option)">
            <span [class]="lb.optionText">{{ labelOf(option) }}</span>
            <mat-icon [class]="checkClass" aria-hidden="true">check</mat-icon>
          </div>
        } @empty {
          <div [class]="lb.empty">No options</div>
        }
      </div>
    </div>
  </ng-template>
</ng-template>
