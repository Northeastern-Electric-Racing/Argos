@if (isMobile || this.sidebarVisible) {
  <mat-sidenav-container class="nav-drawer" [class.nav-drawer--open]="sidebarVisible" [hasBackdrop]="true">
    <mat-sidenav mode="over" [(opened)]="sidebarVisible">
      <div class="drawer-header">
        <typography style="width: 100%; text-align: center" variant="large-header" content="Argos" />
      </div>
      <!-- mat-nav-list is the drawer's navigation landmark; its items are buttons because one opens a dialog. -->
      <mat-nav-list aria-label="Navigation">
        @for (navItem of allNavItems; track navItem) {
          <button
            mat-list-item
            type="button"
            [activated]="this.isSelected(navItem)"
            [attr.aria-current]="this.isSelected(navItem) ? 'page' : null"
            (click)="navItem.onClick()"
          >
            <mat-icon matListItemIcon [svgIcon]="navItem.icon" />
            <span matListItemTitle>{{ navItem.label }}</span>
          </button>
        }
      </mat-nav-list>
    </mat-sidenav>
  </mat-sidenav-container>
} @else {
  <mat-toolbar class="navbar">
    <a matIconButton class="home-logo" [routerLink]="homeNavItem.id" aria-label="Argos home">
      <mat-icon [svgIcon]="this.homeNavItem.icon" />
    </a>
    <!-- Page links as a Material tab nav bar: links with hrefs, arrow-key focus and the active ink bar. -->
    <nav
      mat-tab-nav-bar
      mat-stretch-tabs="false"
      class="navbar-nav"
      [class.navbar-nav--compact]="isNavCompact"
      [class.navbar-nav--icons]="isWindowSmall"
      [tabPanel]="tabPanel()"
      aria-label="Pages"
    >
      @for (navItem of onlyDesktopNavItems; track navItem.id) {
        <!-- Narrow windows show icon-only tabs; the tooltip and aria-label keep the page name. -->
        <a
          mat-tab-link
          [routerLink]="navItem.id"
          [active]="this.isSelected(navItem)"
          [attr.aria-label]="isWindowSmall ? navItem.label : null"
          [matTooltip]="navItem.label"
          [matTooltipDisabled]="!isWindowSmall"
        >
          <mat-icon class="nav-link-icon" [svgIcon]="navItem.icon" />
          @if (!isWindowSmall) {
            <span class="nav-link-label">{{ navItem.label }}</span>
          }
        </a>
      }
    </nav>

    <div class="navbar-end">
      <button matButton="filled" class="new-run-button" (click)="onStartNewRun()">Start New Run</button>
      <current-run-display [navBarStyle]="true" [small]="this.isWindowSmall" />
      <typography
        [variant]="this.isWindowSmall ? 'sidebar-label' : 'large-header'"
        content="{{ time$ | async | date: 'HH:mm:ss' }}"
        additionalStyles="fontSize: 36px"
      />
      <messages-per-second />
      <button
        matIconButton
        type="button"
        class="navbar-notification"
        aria-label="Notifications"
        aria-haspopup="dialog"
        [attr.aria-expanded]="notificationsOpen()"
        cdkOverlayOrigin
        #notificationOrigin="cdkOverlayOrigin"
        (click)="toggleNotifications()"
        [matBadge]="notificationLogService.unreadCount()"
        [matBadgeHidden]="notificationLogService.unreadCount() === 0"
        [matBadgeDescription]="notificationLogService.unreadCount() + ' unread notifications'"
      >
        <mat-icon [svgIcon]="'notifications'" />
      </button>
      <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="notificationOrigin"
        [cdkConnectedOverlayOpen]="notificationsOpen()"
        [cdkConnectedOverlayPositions]="overlayPositions"
        [cdkConnectedOverlayHasBackdrop]="true"
        cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
        (attach)="onNotificationPanelShow()"
        (backdropClick)="notificationsOpen.set(false)"
        (detach)="notificationsOpen.set(false)"
        (overlayKeydown)="closeOnEscape($event, notificationsOpen)"
      >
        <!-- Focus moves into the panel on open and back to the bell on close. -->
        <notification-list
          variant="popover"
          class="notification-popover"
          role="dialog"
          aria-label="Notifications"
          cdkTrapFocus
          [cdkTrapFocusAutoCapture]="true"
        />
      </ng-template>
      <button
        matIconButton
        type="button"
        class="navbar-menu"
        aria-label="More pages"
        [cdkMenuTriggerFor]="appsMenu"
        [cdkMenuPosition]="overlayPositions"
        (cdkMenuOpened)="menuOpen.set(true)"
        (cdkMenuClosed)="menuOpen.set(false)"
        [class.selected]="menuOpen()"
      >
        <mat-icon [svgIcon]="'apps'" />
      </button>
      <ng-template #appsMenu>
        <app-nav-options-menu [items]="navMenuItems" />
      </ng-template>
    </div>
  </mat-toolbar>
}
