@if (isMobile || this.sidebarVisible) {
  <ui-drawer [(visible)]="sidebarVisible" position="left" width="20rem" ariaLabel="Navigation">
    <typography uiDrawerHeader style="width: 100%; text-align: center" variant="large-header" content="Argos" />
    @for (navItem of allNavItems; track navItem) {
      <sidebar-chip
        icon="{{ navItem.icon }}"
        value="{{ navItem.label }}"
        [active]="this.isSelected(navItem)"
        (click)="navItem.onClick()"
      >
      </sidebar-chip>
    }
  </ui-drawer>
} @else {
  <nav class="navbar">
    <button type="button" class="home-logo" aria-label="Home" (click)="this.homeNavItem.onClick()">
      <mat-icon aria-hidden="true" [svgIcon]="this.homeNavItem.icon" />
    </button>
    <div class="navbar-nav">
      @for (navItem of onlyDesktopNavItems; track navItem) {
        <sidebar-chip
          icon="{{ navItem.icon }}"
          value="{{ navItem.label }}"
          [small]="this.isWindowSmall"
          [active]="this.isSelected(navItem)"
          (click)="navItem.onClick()"
          additionalStyles=".mat-icon {width: 36px; height: 36px;}"
        >
        </sidebar-chip>
      }
    </div>

    <hstack>
      <toast-button
        [onClick]="this.onStartNewRun"
        buttonLabel="Start New Run"
        popUpSeverity="success"
        popUpTitle="New Run Started"
        popUpDetails="Your new run has started successfully."
        additionalStyles="min-height: 36px; min-width: 130px"
      />
      <current-run-display [navBarStyle]="true" [small]="this.isWindowSmall" />
      <typography
        [variant]="this.isWindowSmall ? 'sidebar-label' : 'large-header'"
        content="{{ time$ | async | date: 'HH:mm:ss' }}"
        additionalStyles="fontSize: 36px"
      />
      <messages-per-second />
      <button
        type="button"
        class="navbar-notification"
        [attr.aria-label]="'Notifications, ' + notificationLogService.unreadCount() + ' unread'"
        aria-haspopup="dialog"
        [attr.aria-expanded]="notificationPanel.isOpen()"
        (click)="notificationPanel.toggle($event)"
      >
        <mat-icon [svgIcon]="'notifications'" />
        @if (notificationLogService.unreadCount() > 0) {
          <span class="ui-badge notification-badge" aria-hidden="true">{{ notificationLogService.unreadCount() }}</span>
        }
      </button>
      <ui-popover #notificationPanel (shown)="onNotificationPanelShow()" ariaLabel="Notifications">
        <notification-list variant="popover" />
      </ui-popover>
      <app-nav-options-menu [items]="navMenuItems" />
    </hstack>
  </nav>
}
