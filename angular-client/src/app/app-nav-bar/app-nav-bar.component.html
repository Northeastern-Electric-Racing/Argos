<ng-template #drawerTitle>
  <typography style="width: 100%; text-align: center" variant="large-header" content="Argos" />
</ng-template>
<ng-template #drawerContent>
  @for (navItem of allNavItems; track navItem) {
    <sidebar-chip
      icon="{{ navItem.icon }}"
      value="{{ navItem.label }}"
      [active]="this.isSelected(navItem)"
      (click)="navItem.onClick()"
    >
    </sidebar-chip>
  }
</ng-template>
@if (!isMobile && !sidebarVisible()) {
  <nav class="navbar">
    <div class="home-logo" (click)="this.homeNavItem.onClick()">
      <mat-icon [svgIcon]="this.homeNavItem.icon" />
    </div>
    <div class="navbar-nav">
      @for (navItem of onlyDesktopNavItems; track navItem) {
        <sidebar-chip
          icon="{{ navItem.icon }}"
          value="{{ navItem.label }}"
          [small]="this.isWindowSmall"
          [active]="this.isSelected(navItem)"
          (click)="navItem.onClick()"
          additionalStyles=".mat-icon {width: 36px; height: 36px;}"
        >
        </sidebar-chip>
      }
    </div>

    <hstack>
      <button nz-button nzType="primary" [nzLoading]="newRunIsLoading" (click)="onStartNewRun()">Start New Run</button>
      <current-run-display [navBarStyle]="true" [small]="this.isWindowSmall" />
      <typography
        [variant]="this.isWindowSmall ? 'sidebar-label' : 'large-header'"
        content="{{ time$ | async | date: 'HH:mm:ss' }}"
        additionalStyles="fontSize: 36px"
      />
      <messages-per-second />
      <button
        type="button"
        class="navbar-notification"
        aria-label="Notifications"
        nz-popover
        nzPopoverTrigger="click"
        nzPopoverPlacement="bottomRight"
        nzPopoverOverlayClassName="notification-popover"
        [nzPopoverContent]="notificationPanel"
        (nzPopoverVisibleChange)="$event && onNotificationPanelShow()"
      >
        <mat-icon [svgIcon]="'notifications'" />
        @if (notificationLogService.unreadCount() > 0) {
          <nz-badge
            nzStandalone
            [nzCount]="notificationLogService.unreadCount()"
            [nzStyle]="{ boxShadow: 'none' }"
            class="notification-badge"
          />
        }
      </button>
      <ng-template #notificationPanel>
        <notification-list variant="popover" />
      </ng-template>
      <button
        type="button"
        class="navbar-menu"
        aria-label="More pages"
        nz-popover
        nzPopoverTrigger="click"
        nzPopoverPlacement="bottomRight"
        nzPopoverOverlayClassName="nav-options-popover"
        [(nzPopoverVisible)]="menuOpen"
        [nzPopoverContent]="navOptionsMenu"
        [class.selected]="menuOpen"
      >
        <mat-icon [svgIcon]="'apps'" />
      </button>
      <ng-template #navOptionsMenu>
        <app-nav-options-menu [menuItems]="navMenuItems" (itemSelected)="menuOpen = false" />
      </ng-template>
    </hstack>
  </nav>
}
