@if (isMobile || this.sidebarVisible) {
  <hlm-sheet side="left" [state]="sidebarVisible ? 'open' : 'closed'" (stateChanged)="onSidebarStateChanged($event)">
    <hlm-sheet-content *hlmSheetPortal="let ctx" class="w-80 overflow-y-auto">
      <hlm-sheet-header>
        <h2 hlmSheetTitle class="text-center">
          <typography variant="large-header" content="Argos" />
        </h2>
      </hlm-sheet-header>
      <nav class="px-4 pb-4">
        @for (navItem of allNavItems; track navItem) {
          <sidebar-chip
            icon="{{ navItem.icon }}"
            value="{{ navItem.label }}"
            [active]="this.isSelected(navItem)"
            (click)="navItem.onClick()"
          >
          </sidebar-chip>
        }
      </nav>
    </hlm-sheet-content>
  </hlm-sheet>
} @else {
  <nav class="navbar">
    <div class="home-logo" (click)="this.homeNavItem.onClick()">
      <mat-icon [svgIcon]="this.homeNavItem.icon" />
    </div>
    <div class="navbar-nav">
      @for (navItem of onlyDesktopNavItems; track navItem) {
        <sidebar-chip
          icon="{{ navItem.icon }}"
          value="{{ navItem.label }}"
          [small]="this.isWindowSmall"
          [active]="this.isSelected(navItem)"
          (click)="navItem.onClick()"
          additionalStyles=".mat-icon {width: 36px; height: 36px;}"
        >
        </sidebar-chip>
      }
    </div>

    <hstack>
      <toast-button
        [onClick]="this.onStartNewRun"
        buttonLabel="Start New Run"
        popUpSeverity="success"
        popUpTitle="New Run Started"
        popUpDetails="Your new run has started successfully."
        additionalStyles="height: 36px; width: 130px"
      />
      <current-run-display [navBarStyle]="true" [small]="this.isWindowSmall" />
      <typography
        [variant]="this.isWindowSmall ? 'sidebar-label' : 'large-header'"
        content="{{ time$ | async | date: 'HH:mm:ss' }}"
        additionalStyles="fontSize: 36px"
      />
      <messages-per-second />
      <hlm-popover align="end" sideOffset="8" (stateChanged)="onNotificationPanelStateChanged($event)">
        <button hlmPopoverTrigger type="button" class="navbar-notification" aria-label="Notifications">
          <mat-icon [svgIcon]="'notifications'" />
          @if (notificationLogService.unreadCount() > 0) {
            <span hlmBadge variant="destructive" class="notification-badge">{{ notificationLogService.unreadCount() }}</span>
          }
        </button>
        <hlm-popover-content *hlmPopoverPortal="let ctx" class="notification-popover w-auto p-0">
          <notification-list variant="popover" />
        </hlm-popover-content>
      </hlm-popover>
      <hlm-popover #menuPopover align="end" sideOffset="8" (stateChanged)="menuOpen = $event === 'open'">
        <button hlmPopoverTrigger type="button" class="navbar-menu" [class.selected]="menuOpen" aria-label="More pages">
          <mat-icon [svgIcon]="'apps'" />
        </button>
        <hlm-popover-content *hlmPopoverPortal="let ctx" class="w-auto p-0">
          <app-nav-options-menu [menuItems]="navMenuItems" (itemSelected)="closeMenu()" />
        </hlm-popover-content>
      </hlm-popover>
    </hstack>
  </nav>
}
