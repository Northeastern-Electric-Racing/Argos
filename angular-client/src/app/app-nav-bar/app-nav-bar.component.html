@if (isMobile || this.sidebarVisible()) {
  <ui-drawer [(visible)]="sidebarVisible" position="left" width="20rem" ariaLabel="Navigation">
    <typography uiDrawerHeader textClass="w-full text-center" variant="large-header" content="Argos" />
    @for (navItem of allNavItems; track navItem) {
      <sidebar-chip
        icon="{{ navItem.icon }}"
        value="{{ navItem.label }}"
        [active]="this.isSelected(navItem)"
        (click)="navItem.onClick()"
      >
      </sidebar-chip>
    }
  </ui-drawer>
} @else {
  <nav class="mb-4 flex h-15 w-full flex-row items-center justify-between self-center bg-panel p-2.5">
    <button
      type="button"
      class="flex cursor-pointer items-center justify-center rounded-sm border-0 bg-transparent p-2.5 text-inherit focus-visible:focus-ring"
      aria-label="Home"
      (click)="this.homeNavItem.onClick()"
    >
      <span class="inline-flex size-12"
        ><mat-icon aria-hidden="true" [inline]="true" [svgIcon]="this.homeNavItem.icon"
      /></span>
    </button>
    <div class="inline-flex flex-1">
      @for (navItem of onlyDesktopNavItems; track navItem) {
        <sidebar-chip
          icon="{{ navItem.icon }}"
          value="{{ navItem.label }}"
          [small]="this.isWindowSmall"
          [active]="this.isSelected(navItem)"
          (click)="navItem.onClick()"
        >
        </sidebar-chip>
      }
    </div>

    <hstack>
      <button type="button" uiButton class="min-w-[130px]" (click)="startNewRun()">Start New Run</button>
      <current-run-display [navBarStyle]="true" [small]="this.isWindowSmall" />
      <typography
        [variant]="this.isWindowSmall ? 'sidebar-label' : 'large-header'"
        content="{{ time$ | async | date: 'HH:mm:ss' }}"
        textClass="text-[36px]"
      />
      <messages-per-second />
      <notification-bell />
      <app-nav-options-menu [items]="navMenuItems" />
    </hstack>
  </nav>
}
