@if (isMobile || this.sidebarVisible) {
  <tui-drawer *tuiPopup="sidebarVisible" direction="start" class="nav-drawer" [overlay]="true" (click.self)="closeSidebar()">
    <header>
      <typography style="width: 100%; text-align: center" variant="large-header" content="Argos" />
    </header>
    @for (navItem of allNavItems; track navItem) {
      <sidebar-chip
        icon="{{ navItem.icon }}"
        value="{{ navItem.label }}"
        [active]="this.isSelected(navItem)"
        (click)="navItem.onClick()"
      >
      </sidebar-chip>
    }
  </tui-drawer>
} @else {
  <nav class="navbar">
    <div class="home-logo" (click)="this.homeNavItem.onClick()">
      <mat-icon [svgIcon]="this.homeNavItem.icon" />
    </div>
    <div class="navbar-nav">
      @for (navItem of onlyDesktopNavItems; track navItem) {
        <sidebar-chip
          icon="{{ navItem.icon }}"
          value="{{ navItem.label }}"
          [small]="this.isWindowSmall"
          [active]="this.isSelected(navItem)"
          (click)="navItem.onClick()"
          additionalStyles=".mat-icon {width: 36px; height: 36px;}"
        >
        </sidebar-chip>
      }
    </div>

    <hstack>
      <toast-button
        [onClick]="this.onStartNewRun"
        buttonLabel="Start New Run"
        popUpSeverity="success"
        popUpTitle="New Run Started"
        popUpDetails="Your new run has started successfully."
        additionalStyles="height: 36px; width: 130px"
      />
      <current-run-display [navBarStyle]="true" [small]="this.isWindowSmall" />
      <typography
        [variant]="this.isWindowSmall ? 'sidebar-label' : 'large-header'"
        content="{{ time$ | async | date: 'HH:mm:ss' }}"
        additionalStyles="fontSize: 36px"
      />
      <messages-per-second />
      <button
        type="button"
        class="navbar-notification"
        aria-label="Notifications"
        tuiDropdownAlign="end"
        [tuiDropdown]="notificationPanel"
        [tuiDropdownOpen]="notificationsOpen"
        (tuiDropdownOpenChange)="onNotificationPanelChange($event)"
      >
        <mat-icon [svgIcon]="'notifications'" />
        @if (notificationLogService.unreadCount() > 0) {
          <tui-badge-notification size="s" class="notification-badge">
            {{ notificationLogService.unreadCount() }}
          </tui-badge-notification>
        }
      </button>
      <ng-template #notificationPanel>
        <notification-list variant="popover" />
      </ng-template>
      <button
        type="button"
        class="navbar-menu"
        aria-label="More pages"
        tuiDropdownAlign="end"
        [class.selected]="menuOpen"
        [tuiDropdown]="menu"
        [(tuiDropdownOpen)]="menuOpen"
      >
        <mat-icon [svgIcon]="'apps'" />
      </button>
      <ng-template #menu>
        <app-nav-options-menu [items]="navMenuItems" (itemClick)="onMenuItemClick($event)" />
      </ng-template>
    </hstack>
  </nav>
}
