@if (isMobile || this.sidebarVisible) {
  <p-sidebar [(visible)]="sidebarVisible">
    <ng-template pTemplate="header">
      <typography style="width: 100%; text-align: center" variant="large-header" content="Argos" />
    </ng-template>
    <ng-template pTemplate="content">
      @for (navItem of allNavItems; track navItem) {
        <sidebar-chip
          icon="{{ navItem.icon }}"
          value="{{ navItem.label }}"
          [active]="this.isSelected(navItem)"
          (click)="navItem.onClick()"
        >
        </sidebar-chip>
      }
    </ng-template>
  </p-sidebar>
} @else {
  <nav class="navbar">
    <div class="home-logo" (click)="this.homeNavItem.onClick()">
      <mat-icon [svgIcon]="this.homeNavItem.icon" />
    </div>
    <div class="navbar-nav">
      @for (navItem of onlyDesktopNavItems; track navItem) {
        <sidebar-chip
          icon="{{ navItem.icon }}"
          value="{{ navItem.label }}"
          [active]="this.isSelected(navItem)"
          (click)="navItem.onClick()"
        >
        </sidebar-chip>
      }
    </div>

    <hstack>
      <toast-button
        [onClick]="this.onStartNewRun"
        buttonLabel="Start New Run"
        popUpSeverity="success"
        popUpTitle="New Run Started"
        popUpDetails="Your new run has started successfully."
        additionalStyles="height: 36px; width: 150px"
      />
      <current-run-display [navBarStyle]="true" />
      <typography
        variant="large-header"
        content="{{ time$ | async | date: 'HH:mm:ss' }}"
        additionalStyles="fontSize: 36px"
      />
      <messages-per-second />
      <div class="navbar-menu" (click)="toggleMenu()" [class.selected]="menuRef !== undefined">
        <mat-icon [svgIcon]="'apps'" />
      </div>
    </hstack>
  </nav>
}
