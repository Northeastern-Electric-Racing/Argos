@if (isMobile || this.sidebarVisible) {
  <p-drawer [(visible)]="sidebarVisible">
    <ng-template #header>
      <typography style="width: 100%; text-align: center" variant="large-header" content="Argos" />
    </ng-template>
    <ng-template #content>
      @for (navItem of allNavItems; track navItem) {
        <sidebar-chip
          icon="{{ navItem.icon }}"
          value="{{ navItem.label }}"
          [active]="this.isSelected(navItem)"
          (click)="navItem.onClick()"
        >
        </sidebar-chip>
      }
    </ng-template>
  </p-drawer>
} @else {
  <nav class="navbar">
    <button type="button" class="home-logo" aria-label="Home" (click)="this.homeNavItem.onClick()">
      <mat-icon [svgIcon]="this.homeNavItem.icon" />
    </button>
    <div class="navbar-nav">
      @for (navItem of onlyDesktopNavItems; track navItem) {
        <sidebar-chip
          icon="{{ navItem.icon }}"
          value="{{ navItem.label }}"
          [small]="this.isWindowSmall"
          [active]="this.isSelected(navItem)"
          (click)="navItem.onClick()"
          additionalStyles=".mat-icon {width: 36px; height: 36px;}"
        >
        </sidebar-chip>
      }
    </div>

    <hstack>
      <p-button
        label="Start New Run"
        icon="pi pi-plus"
        size="small"
        [loading]="newRunIsLoading()"
        (onClick)="onStartNewRun()"
      />
      <current-run-display [navBarStyle]="true" [small]="this.isWindowSmall" />
      <typography
        [variant]="this.isWindowSmall ? 'sidebar-label' : 'large-header'"
        content="{{ time$ | async | date: 'HH:mm:ss' }}"
        additionalStyles="fontSize: 36px"
      />
      <messages-per-second />
      <button
        type="button"
        class="navbar-notification"
        aria-label="Notifications"
        (click)="notificationPanel.toggle($event)"
      >
        <mat-icon [svgIcon]="'notifications'" />
        @if (notificationLogService.unreadCount() > 0) {
          <p-badge [value]="notificationLogService.unreadCount().toString()" severity="danger" class="notification-badge" />
        }
      </button>
      <p-popover
        #notificationPanel
        (onShow)="onNotificationPanelShow()"
        styleClass="notification-popover"
        [dt]="notificationPopoverTokens"
      >
        <ng-template #content>
          <notification-list variant="popover" />
        </ng-template>
      </p-popover>
      <button
        type="button"
        class="navbar-menu"
        aria-label="More pages"
        aria-haspopup="menu"
        [attr.aria-expanded]="appsMenuOpen"
        [class.selected]="appsMenuOpen"
        (click)="appsMenu.toggle($event)"
      >
        <mat-icon [svgIcon]="'apps'" />
      </button>
    </hstack>
  </nav>
  <!-- Outside the nav so the popup menu host takes no slot in the toolbar layout -->
  <p-menu
    #appsMenu
    [model]="appsMenuItems"
    [popup]="true"
    appendTo="body"
    styleClass="nav-apps-menu"
    [dt]="appsMenuTokens"
    ariaLabel="More pages"
    (onShow)="appsMenuOpen = true"
    (onHide)="appsMenuOpen = false"
  >
    <ng-template #item let-item>
      <a class="nav-apps-item" tabindex="-1">
        <mat-icon class="nav-apps-icon" [svgIcon]="item.icon" />
        <span class="nav-apps-label">{{ item.label }}</span>
      </a>
    </ng-template>
  </p-menu>
}
