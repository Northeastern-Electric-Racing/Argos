@if (isMobile) {
  <sidebar-toggle class="w-full" />
}
@if (isError) {
  <div>
    <error-page [errorMessage]="error!.message" />
  </div>
} @else {
  @if (isLoading) {
    <div>
      <loading-page />
    </div>
  } @else {
    <div id="map" class="absolute h-full w-full">
      <run-selector class="absolute right-0 bottom-0 mr-4 mb-4" [selectRun]="onRunSelected" />
    </div>
  }
}
