<div class="mx-4 h-full">
  @if (isMobile) {
    <charging-page-mobile class="w-full" />
  } @else {
    <div [class]="grid">
      <!-- Left: Combined Status Display -->
      <div [class]="tiles.status">
        <combined-status-display class="size-full" />
      </div>

      <!-- Middle: Vertically Stacked Displays -->
      <div [class]="tiles.stack">
        <div class="flex size-full flex-col gap-2.5">
          <pack-temp class="max-h-7/20 w-full" />
          <state-of-charge-display class="max-h-7/20 w-full" />
          <current-display class="max-h-3/10 w-full" />
        </div>
      </div>

      <!-- Right: Fault Display -->
      <div [class]="tiles.faults">
        <fault-display class="size-full" />
      </div>

      <!-- Bottom section -->
      <div [class]="tiles.graph">
        <cell-temp-display class="size-full" />
      </div>

      <div [class]="tiles.graph">
        <high-low-cell-display class="size-full" />
      </div>

      <div [class]="tiles.graph">
        <pack-voltage-display class="size-full" />
      </div>
    </div>
  }
</div>
