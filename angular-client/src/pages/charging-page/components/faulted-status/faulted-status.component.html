<info-background title="FAULTED" [graphTopics]="graphTopics">
  <hstack>
    <current-total-timer class="pl-5" [currentTime]="currentSeconds()" [totalTime]="totalSeconds()" />
    <div class="pt-10">
      @if (displayLight()) {
        <div
          role="img"
          [class]="lightClass()"
          [attr.data-on]="isFaulted()"
          [attr.aria-label]="isFaulted() ? 'Faulted' : 'Not faulted'"
        ></div>
      }
    </div>
  </hstack>
</info-background>
