<info-background title="Faults" svgIcon="warning" [button]="resetButton">
  <div class="flex h-19/20 w-full overflow-y-auto pr-1.25">
    <vstack class="w-full">
      <div class="pb-2.5"></div>
      @for (fault of faults(); track fault; let i = $index) {
        <div [attr.data-fault]="fault.name" [attr.data-lit]="isLit(i)" [class]="rowClass(i)">
          <div class="flex min-h-11.25 flex-row justify-between p-2.5">
            <typography class="self-center" variant="info-subtitle" textClass="text-inherit" [content]="fault.type" />
            <typography
              class="self-center pl-1.25"
              variant="info-subtitle"
              textClass="text-inherit font-bold"
              [content]="fault.name"
            />
            <typography class="self-center" variant="info-subtitle" textClass="text-inherit" [content]="fault.time" />
          </div>
        </div>
        <div class="pb-0.5"></div>
      }
      <div class="h-12.5"></div>
    </vstack>
  </div>
</info-background>
