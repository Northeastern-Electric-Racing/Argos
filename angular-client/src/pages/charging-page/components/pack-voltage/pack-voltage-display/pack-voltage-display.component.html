@if (isDesktop) {
  <info-background svgIcon="electric_meter" title="Pack Voltage" [button]="resetGraphButton" [graphTopics]="graphTopics">
    <hstack>
      <hstack class="mb-10 w-3/20">
        <typography variant="info-value" [content]="voltage.toFixed(1) + 'V'" />
      </hstack>
      <pack-voltage-graph class="w-4/5 pb-7.5" [packVoltData]="packVoltData" />
    </hstack>
  </info-background>
} @else {
  <pack-voltage-mobile
    [packVoltData]="packVoltData"
    [voltage]="voltage"
    [resetGraphButton]="resetGraphButton"
    [graphTopics]="graphTopics"
  />
}
