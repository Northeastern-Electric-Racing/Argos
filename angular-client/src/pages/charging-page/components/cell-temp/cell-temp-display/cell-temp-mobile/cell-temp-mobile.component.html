<info-background svgIcon="thermostat" title="Cell Temp" [button]="resetGraphButton()">
  <div class="pt-5"></div>
  <vstack>
    <hstack>
      <vstack class="w-1/10 pb-2.5">
        <typography variant="info-value" [content]="avgTemp().toString() + '°'" textClass="text-stat" />
        <typography variant="info-subtitle" content="Avg. Temp" textClass="text-sm" />
      </vstack>

      <div class="pl-5"></div>
      <divider class="h-25" />
      <div class="pl-5"></div>

      <vstack class="w-1/10 pb-2.5">
        <typography variant="info-value" [content]="maxTemp().toString() + '°'" textClass="text-stat" />
        <typography variant="info-subtitle" content="Max. Temp" textClass="text-sm" />
      </vstack>
    </hstack>
    <cell-temp-graph class="w-full pb-7.5" [maxCellTempData]="cellTempData()" />
  </vstack>
</info-background>
