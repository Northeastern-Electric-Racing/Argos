@if (isDesktop) {
  <info-background svgIcon="thermostat" title="Cell Temp" [button]="resetGraphButton" [graphTopics]="graphTopics">
    <hstack>
      <vstack class="mb-10 w-1/10">
        <typography variant="info-value" [content]="avgTemp.toString() + '°'" />
        <typography variant="info-subtitle" content="Avg. Temp" />
      </vstack>
      <divider class="mb-10 h-25" />
      <vstack class="mb-10 w-1/10">
        <typography variant="info-value" [content]="maxTemp.toString() + '°'" />
        <typography variant="info-subtitle" content="Max. Temp" />
      </vstack>
      <!-- the bottom padding keeps the graph off the card's lower edge -->
      <cell-temp-graph class="w-17/20 pb-7.5" [maxCellTempData]="cellTempData" />
    </hstack>
  </info-background>
}
@if (!isDesktop) {
  <cell-temp-mobile
    [cellTempData]="cellTempData"
    [avgTemp]="avgTemp"
    [maxTemp]="maxTemp"
    [resetGraphButton]="resetGraphButton"
    [graphTopics]="graphTopics"
  />
}
