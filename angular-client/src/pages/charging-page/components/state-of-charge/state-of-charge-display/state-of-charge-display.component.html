<info-background title="SOC" svgIcon="battery_charging_full" [graphTopics]="graphTopics">
  <hstack>
    <battery-percentage [percentage]="stateOfCharge" [height]="50" [width]="25" />
    <div class="flex h-4/5 items-center justify-center">
      <typography variant="info-value" [content]="stateOfCharge.toString()" textClass="text-display" />
      <typography variant="info-unit" content="%" textClass="text-lg" />
    </div>
  </hstack>
</info-background>
