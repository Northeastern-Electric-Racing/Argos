<info-background svgIcon="electric_meter" title="Cell Voltage" [button]="resetGraphButton()">
  <vstack>
    <hstack class="w-full">
      <vstack class="w-1/10">
        <hstack>
          @if (isDesktop) {
            <typography variant="info-value" [content]="delta().toFixed(3) + 'V'" textClass="text-stat" />
          } @else {
            <typography variant="info-value" [content]="delta().toFixed(3) + 'V'" textClass="text-lg" />
          }
        </hstack>
        <typography variant="info-subtitle" content="Delta" textClass="text-sm" />
      </vstack>

      <divider class="h-25" />

      <vstack class="w-1/10">
        @if (isDesktop) {
          <typography variant="info-value" [content]="lowCellVoltage().toFixed(3) + 'V'" textClass="text-stat" />
        } @else {
          <typography variant="info-value" [content]="lowCellVoltage().toFixed(3) + 'V'" textClass="text-lg" />
        }
        <typography variant="info-subtitle" content="Low Cell" textClass="text-sm" />
      </vstack>

      <divider class="h-25" />

      <vstack class="w-1/10">
        <hstack>
          @if (isDesktop) {
            <typography variant="info-value" [content]="highCellVoltage().toFixed(3) + 'V'" textClass="text-stat" />
          } @else {
            <typography variant="info-value" [content]="highCellVoltage().toFixed(3) + 'V'" textClass="text-lg" />
          }
        </hstack>
        <typography variant="info-subtitle" content="High Cell" textClass="text-sm" />
      </vstack>
    </hstack>
    @if (!isDesktop) {
      <high-low-cell-graph class="w-full pb-8.75" [highVoltsData]="highVoltsData()" [lowVoltsData]="lowVoltsData()" />
    }
  </vstack>
</info-background>
