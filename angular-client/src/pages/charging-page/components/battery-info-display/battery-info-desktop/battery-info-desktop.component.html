<hstack class="size-full">
  <vstack class="w-1/5">
    <hstack>
      <typography variant="info-value" [content]="stateOfCharge().toString() + '%'" />
      <battery-percentage [percentage]="stateOfCharge()" [height]="60" [width]="30" />
    </hstack>
    <typography variant="info-subtitle" content="Charge State" />
  </vstack>

  <divider />
  <vstack class="w-1/5">
    <hstack>
      <typography variant="info-value" [content]="packTemp().toString() + '°'" />
      <div class="flex h-18.5 w-7 items-center justify-center">
        <thermometer [temperature]="packTemp()" [min]="-15" [max]="30" />
      </div>
    </hstack>
    <typography variant="info-subtitle" content="Pack Temperature" />
  </vstack>

  <divider />
  <vstack class="w-1/5">
    <hstack>
      <typography variant="info-value" [content]="voltage().toFixed(1) + 'V'" />
    </hstack>
    <typography variant="info-subtitle" content="Pack Voltage" />
  </vstack>

  <divider />
  <vstack class="w-1/5">
    <hstack>
      <typography variant="info-value" [content]="chargeCurrentLimit().toString() + 'A'" />
    </hstack>
    <typography variant="info-subtitle" content="CCL" />
  </vstack>

  <divider />
  <vstack class="w-1/5">
    <hstack>
      <typography variant="info-value" [content]="dischargeCurrentLimit().toString() + 'A'" />
    </hstack>
    <typography variant="info-subtitle" content="DCL" />
  </vstack>
</hstack>
