<info-background title="Battery" svgIcon="battery_charging_full" [graphTopics]="graphTopics">
  @if (isMobile) {
  <battery-info-mobile
    class="w-full"
    [voltage]="voltage"
    [chargeCurrentLimit]="chargeCurrentLimit"
    [dischargeCurrentLimit]="dischargeCurrentLimit"
    [packTemp]="packTemp"
    [stateOfCharge]="stateOfCharge"
  />
  } @else {
  <battery-info-desktop
    class="w-full"
    [voltage]="voltage"
    [chargeCurrentLimit]="chargeCurrentLimit"
    [dischargeCurrentLimit]="dischargeCurrentLimit"
    [packTemp]="packTemp"
    [stateOfCharge]="stateOfCharge"
  />
  }
</info-background>
