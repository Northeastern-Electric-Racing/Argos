<info-background title="CHARGING" [graphTopics]="graphTopics">
  <hstack>
    <current-total-timer class="pl-5" [currentTime]="currentSeconds()" [totalTime]="totalSeconds()" />
    <div class="pt-10">
      @if (displayLight()) {
        <div
          role="img"
          [class]="lightClass()"
          [attr.data-on]="isCharging()"
          [attr.aria-label]="isCharging() ? 'Charging' : 'Not charging'"
        ></div>
      }
    </div>
  </hstack>
</info-background>
