<info-background title="CHARGING">
  <hstack>
    <current-total-timer class="min-h-25 pl-5" [currentTime]="currentSeconds()" [totalTime]="totalSeconds()" />
    <div class="pt-10">
      @if (displayLight()) {
        <div
          role="img"
          class="size-10 rounded-full border-3 border-solid border-fg data-[on=true]:border-warn data-[on=true]:bg-warn"
          [attr.data-on]="isCharging()"
          [attr.aria-label]="isCharging() ? 'Charging' : 'Not charging'"
        ></div>
      }
    </div>
  </hstack>
</info-background>
