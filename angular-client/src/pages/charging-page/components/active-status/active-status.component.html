<info-background title="ACTIVE" [graphTopics]="graphTopics">
  <hstack>
    <current-total-timer class="pl-5" [currentTime]="currentSeconds()" [totalTime]="totalSeconds()" />
    <div class="pt-10">
      @if (displayLight()) {
        <div
          role="img"
          [class]="lightClass()"
          [attr.data-on]="isActive()"
          [attr.aria-label]="isActive() ? 'Active' : 'Not active'"
        ></div>
      }
    </div>
  </hstack>
</info-background>
