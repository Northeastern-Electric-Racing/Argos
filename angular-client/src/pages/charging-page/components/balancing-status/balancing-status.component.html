<info-background title="BALANCING" [graphTopics]="graphTopics">
  <hstack>
    <current-total-timer class="pl-5" [currentTime]="currentSeconds()" [totalTime]="totalSeconds()" />
    <div class="pt-10">
      @if (displayLight()) {
        <div
          role="img"
          [class]="lightClass()"
          [attr.data-on]="isBalancing()"
          [attr.aria-label]="isBalancing() ? 'Balancing' : 'Not balancing'"
        ></div>
      }
    </div>
  </hstack>
</info-background>
