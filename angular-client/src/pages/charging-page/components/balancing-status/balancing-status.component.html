<info-background title="BALANCING">
  <hstack>
    <current-total-timer class="min-h-25 pl-5" [currentTime]="currentSeconds()" [totalTime]="totalSeconds()" />
    <div class="pt-10">
      @if (displayLight()) {
        <div
          role="img"
          class="size-10 rounded-full border-3 border-solid border-fg data-[on=true]:border-info data-[on=true]:bg-info"
          [attr.data-on]="isBalancing()"
          [attr.aria-label]="isBalancing() ? 'Balancing' : 'Not balancing'"
        ></div>
      }
    </div>
  </hstack>
</info-background>
