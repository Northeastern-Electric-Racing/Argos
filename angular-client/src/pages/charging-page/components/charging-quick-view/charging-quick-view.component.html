<quick-view-chip label="State of Charge" unit="%" [precision]="0" [value]="socPercent()" />
<quick-view-chip label="Pack Voltage" unit="V" [value]="packVoltage()" />
<quick-view-chip label="Charging Current" unit="A" [value]="current()" />
<quick-view-chip
  label="BMS State"
  [value]="modeName()"
  [status]="modeStatus()"
  [statusLabel]="'BMS ' + (modeName() ?? '')"
/>
<quick-view-chip label="Balancing" [value]="balancingLabel()" />
<quick-view-chip label="Highest Cell Temp" unit="°C" [value]="highTemp()" />
<quick-view-chip label="Cell Spread" unit="mV" [precision]="0" [value]="spreadMillivolts()" [detail]="spreadDetail()" />
<quick-view-chip
  label="Charger Fault"
  [value]="chargerFaultsValue()"
  [detail]="chargerFaultDetail()"
  [status]="chargerFaults().length ? 'fault' : 'ok'"
  [statusLabel]="chargerFaults().length ? 'Charger fault active' : 'No charger fault'"
/>
