<div class="image-container" style="margin-right: 16px; margin-left: 16px">
  <mat-grid-list cols="6" gutterSize="15px" rowHeight="1.5rem" style="margin-top: -20px">
    <mat-grid-tile [colspan]="6" rowspan="3">
      <bms-header style="width: 100%" [pageTitle]="'Segment ' + this.segmentId" />
    </mat-grid-tile>
    <mat-grid-tile colspan="6" rowspan="5">
      <segment-at-a-glance style="width: 100%; height: 100%" />
    </mat-grid-tile>
    <mat-grid-tile colspan="1" rowspan="8">
      <cell-view style="width: 100%; height: 100%"></cell-view>
    </mat-grid-tile>
    <mat-grid-tile colspan="5" rowspan="8">
      <cell-by-cell-heat-map style="width: 100%; height: 100%"></cell-by-cell-heat-map>
    </mat-grid-tile>
    <mat-grid-tile colspan="3" rowspan="8">
      <!-- Alpha -->
      <chip-diagnostics style="width: 100%; height: 100%" [chip]="this.chipAlpha" />
    </mat-grid-tile>
    <mat-grid-tile colspan="3" rowspan="8">
      <!-- Beta -->
      <chip-diagnostics style="width: 100%; height: 100%" [chip]="this.chipBeta" />
    </mat-grid-tile>
    <mat-grid-tile colspan="3" rowspan="10">
      <chip-faults style="width: 100%; height: 100%" [chip]="this.chipAlpha"></chip-faults>
    </mat-grid-tile>
    <mat-grid-tile colspan="3" rowspan="10">
      <chip-faults style="width: 100%; height: 100%" [chip]="this.chipBeta"></chip-faults>
    </mat-grid-tile>
  </mat-grid-list>
</div>
