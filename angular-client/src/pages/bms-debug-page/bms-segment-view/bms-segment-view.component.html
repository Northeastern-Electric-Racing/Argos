<div class="image-container" style="margin-right: 16px; margin-left: 16px">
  <mat-grid-list cols="6" gutterSize="15px" rowHeight="1.5rem" style="margin-top: -20px">
    <mat-grid-tile [colspan]="6" rowspan="3">
      <!-- Display values are 1-based index for segments-->
      <bms-header
        class="bms-header"
        style="width: 100%"
        [pageTitle]="(this.changeTitleSize ? 'Seg. ' : 'Segment ') + (this.segmentId + 1)"
      />
    </mat-grid-tile>
    <mat-grid-tile colspan="6" rowspan="5">
      <segment-at-a-glance style="width: 100%; height: 100%" [segmentNumber]="this.segmentId" />
    </mat-grid-tile>
    <mat-grid-tile colspan="6" rowspan="8">
      <info-background
        style="width: 100%; height: 100%"
        [title]="this.getHeatmapTitle()"
        svgIcon="battery_charging_2"
        [slicedLeftCorner]="true"
        [selectorConfigs]="[this.currentSegmentSelectorConfig, this.allSegSelectorConfig]"
      >
        <div style="padding-top: 20px"></div>
        <segment-heatmap class="segment-page-heatmap" [segment]="this.segmentId" />
      </info-background>
    </mat-grid-tile>
    <mat-grid-tile colspan="3" rowspan="8">
      <!-- Alpha -->
      <chip-diagnostics style="width: 100%; height: 100%" [chip]="this.chipAlpha" [segment]="this.segmentId" />
    </mat-grid-tile>
    <mat-grid-tile colspan="3" rowspan="8">
      <!-- Beta -->
      <chip-diagnostics style="width: 100%; height: 100%" [chip]="this.chipBeta" [segment]="this.segmentId" />
    </mat-grid-tile>
    <mat-grid-tile colspan="3" rowspan="10">
      <chip-faults style="width: 100%; height: 100%" [chip]="this.chipAlpha" [segment]="this.segmentId"></chip-faults>
    </mat-grid-tile>
    <mat-grid-tile colspan="3" rowspan="10">
      <chip-faults style="width: 100%; height: 100%" [chip]="this.chipBeta" [segment]="this.segmentId"></chip-faults>
    </mat-grid-tile>
  </mat-grid-list>
</div>
