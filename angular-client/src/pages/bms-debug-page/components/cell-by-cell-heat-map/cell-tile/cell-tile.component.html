<div
  class="cell-tile"
  [style.background-color]="this.color()"
  [style.box-shadow]="this.boxShadowColor() ? '0px 0px 30px ' + this.color() + ', 0px 0px 50px rgba(0, 0, 0, 0.5)' : ''"
>
  <typography
    variant="info-value"
    [content]="this.getDisplayValue()"
    additionalStyles="fontSize: 2.3vw; color: #2C2C2C;   margin-left: 10px;"
  />
</div>
