<info-background [title]="this.title" svgIcon="battery_charging_2">
  <div class="table-scroll">
    <table mat-table [dataSource]="chipFaults" class="fault-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let fault">{{ fault.name }}</td>
      </ng-container>
      <ng-container matColumnDef="occurredAt">
        <th mat-header-cell *matHeaderCellDef>Occurred At</th>
        <td mat-cell *matCellDef="let fault">{{ fault.occurredAt | date: 'HH:mm:ss' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
      <tr
        mat-row
        *matRowDef="let fault; columns: columns"
        class="clickable-row"
        tabindex="0"
        (click)="onRowSelect(fault)"
        (keyup.enter)="onRowSelect(fault)"
      ></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-row" [attr.colspan]="columns.length">No faults</td>
      </tr>
    </table>
  </div>
</info-background>
