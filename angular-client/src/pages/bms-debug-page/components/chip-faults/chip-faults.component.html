<info-background [title]="this.title" svgIcon="battery_charging_2">
  <div style="padding-top: 20px"></div>
  <nz-table
    #faultsTable
    class="faults-table argos-striped argos-sticky-header"
    nzSize="small"
    [nzData]="chipFaults()"
    [nzFrontPagination]="false"
    [nzShowPagination]="false"
    [nzNoResult]="noFaults"
  >
    <thead>
      <tr>
        <th>Name</th>
        <th>Occurred At</th>
      </tr>
    </thead>
    <tbody>
      @for (fault of faultsTable.data; track $index) {
        <tr class="fault-row" tabindex="0" (click)="onRowSelect(fault)" (keydown.enter)="onRowSelect(fault)">
          <td>{{ fault.name }}</td>
          <td>{{ fault.occurredAt | date: 'HH:mm:ss' }}</td>
        </tr>
      }
    </tbody>
  </nz-table>
  <ng-template #noFaults><span class="empty-text">No faults</span></ng-template>
</info-background>
