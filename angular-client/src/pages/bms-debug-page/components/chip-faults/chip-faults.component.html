<info-background [title]="this.title" svgIcon="battery_charging_2">
  <div style="padding-top: 20px"></div>
  <div class="fault-scroll">
    <table tuiTable size="s" class="fault-table">
      <thead>
        <tr>
          <th tuiTh>Name</th>
          <th tuiTh>Occurred At</th>
        </tr>
      </thead>
      <tbody tuiTbody>
        @for (fault of this.chipFaults; track fault) {
          <tr tuiTr class="selectable-row" tabindex="0" (click)="onRowSelect(fault)" (keydown.enter)="onRowSelect(fault)">
            <td tuiTd>{{ fault.name }}</td>
            <td tuiTd>{{ fault.occurredAt | date: 'HH:mm:ss' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</info-background>
