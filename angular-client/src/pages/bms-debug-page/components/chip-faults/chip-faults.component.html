<info-background [title]="this.title" svgIcon="battery_charging_2">
  <div class="ui-table-wrapper chip-faults-table">
    <table cdk-table class="ui-table ui-table--striped ui-table--hover" [dataSource]="this.chipFaults()">
      <ng-container cdkColumnDef="name">
        <th cdk-header-cell *cdkHeaderCellDef>Name</th>
        <td cdk-cell *cdkCellDef="let fault">
          <button type="button" class="ui-cell-button" (click)="onRowSelect(fault); $event.stopPropagation()">
            {{ fault.name }}
          </button>
        </td>
      </ng-container>
      <ng-container cdkColumnDef="occurredAt">
        <th cdk-header-cell *cdkHeaderCellDef>Occurred At</th>
        <td cdk-cell *cdkCellDef="let fault">{{ fault.occurredAt | date: 'HH:mm:ss' }}</td>
      </ng-container>
      <tr cdk-header-row *cdkHeaderRowDef="columns; sticky: true"></tr>
      <!-- The whole row is a mouse target; keyboard and screen-reader users get the Name button. -->
      <tr cdk-row *cdkRowDef="let fault; columns: columns" (click)="onRowSelect(fault)"></tr>
    </table>
  </div>
</info-background>
