<info-background [title]="this.title" svgIcon="battery_charging_2">
  <div style="padding-top: 20px"></div>
  <div hlmTableContainer class="max-h-[300px] overflow-y-auto">
    <table hlmTable>
      <thead hlmTHead>
        <tr hlmTr>
          <th hlmTh>Name</th>
          <th hlmTh>Occurred At</th>
        </tr>
      </thead>
      <tbody hlmTBody>
        @for (fault of this.chipFaults; track $index) {
          <tr
            hlmTr
            class="cursor-pointer even:bg-muted/30"
            tabindex="0"
            (click)="onRowSelect(fault)"
            (keydown.enter)="onRowSelect(fault)"
          >
            <td hlmTd>{{ fault.name }}</td>
            <td hlmTd>{{ fault.occurredAt | date: 'HH:mm:ss' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</info-background>
