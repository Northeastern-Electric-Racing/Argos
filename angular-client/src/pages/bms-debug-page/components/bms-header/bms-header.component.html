<!-- 814's 6-column mat-grid-list as the grid recipe; these tiles let their content spill -->
<div [class]="grid">
  <div [class]="titleTile">
    <typography
      class="mb-2.5 ml-7.5 grid h-full w-full items-center text-ellipsis whitespace-nowrap"
      variant="x-large-title"
      textClass="m-0 mt-2.5 text-left text-banner leading-0 tracking-[0.2rem] [word-spacing:0.2rem]"
      [content]="this.pageTitle()"
    />
  </div>

  <div [class]="tile">
    <segment-selector class="mt-2.5 h-4/5 w-full" />
  </div>
  <div [class]="tile">
    <crc class="mt-2.5 h-4/5 w-full" />
  </div>
  <div [class]="tile">
    <bms-overflow class="mt-2.5 h-4/5 w-full" />
  </div>
</div>
