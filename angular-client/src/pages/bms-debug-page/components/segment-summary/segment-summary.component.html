<info-background [title]="'Segment ' + (this.segmentNumber() + 1)" svgIcon="battery_charging_2">
  <vstack spacing="20px">
    <info-value-display class="mt-2.5" [value]="this.temperature" unit="C" subtitle="Temperature" />

    <divider class="mt-3.75 w-25" />
    <info-value-display class="-mt-1.25" [value]="this.voltage" unit="V" [precision]="2" subtitle="Avg Voltage" />
    <divider class="mt-6.25 w-25" />
    <info-value-display class="-mt-1.25" [value]="this.alphaChipTemp" unit="C" subtitle="Chip Temp" />
    <toast-button
      buttonLabel="See More ➜"
      variant="secondary"
      additionalStyles="border-radius: var(--ui-radius-full)"
      class="mt-5"
      [disableToast]="true"
      [onClick]="this.openSegmentPage"
    />
  </vstack>
</info-background>
