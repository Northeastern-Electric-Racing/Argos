<info-background>
  <hstack justifyContent="space-evenly" class="bms-container">
    <info-value-display [value]="this.temperature" unit="C" subtitle="Temperature" size="large" />
    <div class="divider"></div>
    <info-value-display [value]="this.voltage" unit="V" subtitle="Voltages" size="large" />
    <div class="divider"></div>
    <info-value-display [value]="this.alphaChipTemp" unit="C" subtitle="Chip Temp" size="large" />
  </hstack>
</info-background>
