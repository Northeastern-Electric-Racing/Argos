<info-background title="At A Glance" svgIcon="battery_charging_2">
  <hstack justifyContent="space-evenly" class="bms-container">
    <!-- Voltage -->
    <info-value-display [value]="voltage" unit="V" [widget]="this.connectionDotConfig" [enableWidget]="this.enableWidgets" />
    <div class="divider"></div>

    <!-- Temperature -->
    <info-value-display
      [value]="temperature"
      unit="C"
      subtitle="Average Temperature"
      [widget]="this.thermometerConfig"
      [enableWidget]="this.enableWidgets"
    />
    <div class="divider"></div>

    <!-- Charge State -->
    <info-value-display
      [value]="chargeState"
      unit="%"
      subtitle="Charge State"
      [widget]="this.batteryConfig"
      [enableWidget]="this.enableWidgets"
    />
    <div class="divider"></div>

    <!-- CCL -->
    <info-value-display [value]="this.ccl" unit="A" subtitle="CCL" />
    <div class="divider"></div>

    <!-- DCL -->
    <info-value-display [value]="this.dcl" unit="A" subtitle="DCL" />
  </hstack>
</info-background>
