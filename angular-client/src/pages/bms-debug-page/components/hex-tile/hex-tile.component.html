<div [class]="tileClass()" [style.background-color]="color()">
  <span [class]="numberClass()">{{ cellNumber() }}</span>
  <span [class]="containerClass()">
    <span [class]="valueClass()">{{ displayValue() }}</span>
    @if (unitLabel()) {
      <sup [class]="unitClass">{{ unitLabel() }}</sup>
    }
  </span>
</div>
