<div class="compare-grid">
  <!-- Header row -->
  <div class="label-col">
    <div class="corner-cell"></div>
    <span class="row-label">Voltage</span>
    <span class="row-label">Temp</span>
    <span class="row-label">Balancing</span>
  </div>
  @for (cell of cells; track cell.reading) {
    <div class="data-col">
      <div class="col-header">
        <span class="col-title">{{ cell.cellNum }}</span>
        <span class="col-subtitle">{{ chipLabel(cell.reading.chip) }} · S{{ cell.segment + 1 }}</span>
      </div>
      <span class="data-value">{{ formatVoltage(cell.reading.voltage) }}</span>
      <span class="data-value">{{ formatTemp(cell.reading.temp) }}</span>
      <span
        class="data-value"
        [class.bal-yes]="cell.reading.balancing === true"
        [class.bal-no]="cell.reading.balancing === false"
        >{{ formatBool(cell.reading.balancing) }}</span
      >
    </div>
  }
</div>
