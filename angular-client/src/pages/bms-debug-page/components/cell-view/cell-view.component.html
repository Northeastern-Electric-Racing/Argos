<info-background [title]="this.getTitle()" svgIcon="battery_charging_2" [topRightInfo]="this.getUpperRightTitle()">
  <hstack justifyContent="center" alignItems="center" spacing="5vw" style="height: 100%">
    <info-value-display
      [value]="this.displayCellIndex"
      valueStyle="fontSize: 30px;"
      [subtitle]="this.getCellNumTitle()"
      [precision]="0"
      style="padding-top: 25px"
    ></info-value-display>
    <info-value-display
      [value]="this.getAverageVoltage()"
      [precision]="3"
      valueStyle="fontSize: 30px;"
      unit="V"
      [subtitle]="this.getCellVoltageTitle()"
      style="margin-top: 0.8vh"
    ></info-value-display>
    <info-value-display
      [boolValue]="this.getBalancing()"
      [subtitle]="this.getBalancingTitle()"
      valueStyle="fontSize: 30px;"
      style="padding-top: 25px"
    ></info-value-display>
  </hstack>
</info-background>
