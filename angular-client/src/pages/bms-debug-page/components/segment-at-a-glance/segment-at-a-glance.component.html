<info-background title="Segment At A Glance" svgIcon="battery_charging_2">
  <hstack justifyContent="space-evenly">
    <!-- Voltage -->
    <info-value-display
      [value]="this.voltage"
      unit="V"
      [precision]="2"
      subtitle="Avg Voltage"
      [widget]="this.connectionDotConfig"
      [enableWidget]="this.enableWidgets"
    />
    <div class="h-12.5 w-0.5 bg-border-strong"></div>

    <!-- Temperature -->
    <info-value-display
      [value]="temperature"
      unit="C"
      subtitle="Average Temperature"
      [widget]="this.thermometerConfigSegment"
      [enableWidget]="this.enableWidgets"
    />
    <div class="h-12.5 w-0.5 bg-border-strong"></div>

    <!-- Chip Alpha Temperature -->
    <info-value-display
      [value]="this.alphaChipTemp"
      unit="C"
      subtitle="Chip Alpha Temperature"
      [widget]="this.thermometerConfigAlphaChip"
      [enableWidget]="this.enableWidgets"
    />
    <div class="h-12.5 w-0.5 bg-border-strong"></div>

    <!-- Chip Beta Temperature -->
    <info-value-display
      [value]="this.betaChipTemp"
      unit="C"
      subtitle="Chip Beta Temperature"
      [widget]="this.thermometerConfigBetaChip"
      [enableWidget]="this.enableWidgets"
    />
    <div class="h-12.5 w-0.5 bg-border-strong"></div>

    <!-- Chip CRC -->
    <vstack>
      <hstack class="mb-2.5">
        <vstack>
          <connection-dot-with-message [getStatusColor]="this.getAlphaCrcColor" />
          <connection-dot-with-message class="mt-5" [getStatusColor]="this.getBetaCrcColor" />
        </vstack>
        <vstack>
          <typography variant="info-title" content="Alpha CRC" textClass="text-title font-black" />
          <typography variant="info-title" content="Beta CRC" textClass="m-0 mt-[12.5px] text-title font-black" />
        </vstack>
      </hstack>
      <typography variant="info-subtitle" content="Chip CRCs"></typography>
    </vstack>
  </hstack>
</info-background>
