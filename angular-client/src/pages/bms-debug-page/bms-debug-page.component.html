<div class="mx-4 block">
  @if (isMobile) {
    <!-- TODO: Add mobile display component -->
  } @else {
    <!-- 814's 6-column mat-grid-list: 1.5rem rows, 15px gutters, each tile a centred cell that clips -->
    <div class="-mt-5 grid auto-rows-6 grid-cols-6 gap-3.75">
      <div [class]="tile.header">
        <bms-header class="w-full" [pageTitle]="this.windowSize < 1300 ? 'ACCU' : 'Accumulator'" />
      </div>
      <div [class]="tile.header">
        <bms-at-a-glance class="h-full w-full" />
      </div>
    </div>

    <!-- Section header with "Set ALL Maps" dropdown -->
    <section-header
      leftTitle="Cell-by-Cell Heat Map"
      rightTitle="Segment Overview"
      [selectorConfigs]="[allSegSelectorConfig]"
    />

    <!-- Unified segment rows -->
    <div class="flex flex-col gap-[clamp(2px,0.35vw,8px)]">
      @for (segment of segments; track segment) {
        <segment-row [segment]="segment" />
      }
    </div>
  }
</div>
