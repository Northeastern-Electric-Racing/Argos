@if (this.urlAvailable) {
  <div class="background">
    <div class="top-right">
      <hlm-select [value]="selectedVideoName" (valueChange)="onDropdownChange($event)">
        <hlm-select-trigger class="min-w-48">
          <hlm-select-value placeholder="Select a Video" />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (video of videoUrls; track video) {
            <hlm-select-item [value]="video">{{ video }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>

    <div class="video-container">
      @if (this.liveStream) {
        <video #remoteVideo controls autoplay muted style="width: 100%; height: 90vh"></video>
      } @else {
        <video #playbackVideo controls autoplay muted style="width: 100%; height: 90vh">
          <source [src]="playbackVideoUrl" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      }
    </div>
  </div>
} @else {
  <div hlmEmpty class="min-h-[60vh]" role="status">
    <div hlmEmptyHeader>
      <div hlmEmptyMedia variant="icon" class="text-destructive">
        <ng-icon name="lucideVideoOff" />
      </div>
      <h2 hlmEmptyTitle>Camera Not Reachable</h2>
      <p hlmEmptyDescription>
        The car's camera stream isn't responding. Check that the camera is powered and on the network.
      </p>
    </div>
  </div>
}
