@if (this.urlAvailable) {
  <div class="background">
    <p-select
      [options]="videoUrls"
      [(ngModel)]="selectedVideoName"
      placeholder="Select a Video"
      class="top-right"
      (onChange)="onDropdownChange($event)"
    />

    <div class="video-container">
      @if (this.liveStream) {
        <video #remoteVideo controls autoplay muted style="width: 100%; height: 95vh"></video>
      } @else {
        <video #playbackVideo controls autoplay muted style="width: 100%; height: 95vh">
          <source [src]="playbackVideoUrl" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      }
    </div>
  </div>
} @else {
  <div style="display: flex; justify-content: center; align-items: center; height: 100%">
    <typography content="Camera Not Reachable" variant="xx-large-title" additionalStyles="color: red" />
  </div>
}
