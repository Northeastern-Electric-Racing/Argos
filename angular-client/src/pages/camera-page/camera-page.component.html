@if (this.urlAvailable) {
  <div class="relative">
    <div class="absolute top-2.5 right-2.5 z-10 flex items-center gap-2.5">
      <ui-select
        class="min-w-56"
        [options]="videoUrls"
        [(ngModel)]="selectedVideoName"
        placeholder="Select a Video"
        ariaLabel="Video"
        (selectionChange)="onDropdownChange($event)"
      />
    </div>

    <div class="h-[90vh] w-full">
      @if (this.liveStream) {
        <video #remoteVideo class="block h-[90vh] w-full" controls autoplay muted></video>
      } @else {
        <video #playbackVideo class="block h-[90vh] w-full" controls autoplay muted>
          <source [src]="playbackVideoUrl" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      }
    </div>
  </div>
} @else {
  <!-- 7.5rem bold like the xx-large title, 3rem on phones so the longest word fits a 390px screen. -->
  <div class="flex h-full items-center justify-center px-4">
    <p class="m-0 text-center font-sans text-[7.5rem] font-bold text-accent-fg select-none max-md:text-2xl" role="status">
      Camera Not Reachable
    </p>
  </div>
}
