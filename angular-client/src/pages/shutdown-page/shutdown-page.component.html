<div class="page">
  <h1 class="title">Shutdown Loop</h1>
  <loop-banner [status]="status()" [tsOn]="tsOn()" />
  <section class="panel" aria-label="Car view">
    <car-view-switch [nodes]="status().nodes" />
  </section>
  <section class="panel" aria-label="Loop in series order">
    <h2 class="section-title">Loop order</h2>
    <loop-strip [nodes]="status().nodes" />
  </section>
  @if (devMode) {
    <shutdown-mock-panel />
  }
</div>
