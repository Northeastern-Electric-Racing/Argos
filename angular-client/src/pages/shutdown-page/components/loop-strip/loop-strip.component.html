<ol class="strip" aria-label="Shutdown loop in series order">
  @for (s of nodes(); track s.node.id; let last = $last) {
    <li
      class="item"
      [class]="display[s.state].cssClass"
      [class.unmeasured]="!s.node.topic"
      [class.mismatch]="s.mismatch"
      [attr.data-node-id]="s.node.id"
      [attr.aria-label]="s.node.label + ': ' + display[s.state].label + (s.node.topic ? '' : ' (no sensor)')"
    >
      <span class="marker"><status-glyph [state]="s.state" /></span>
      <span class="label">{{ s.node.label }}</span>
      <span class="state">{{ display[s.state].label }}</span>
      @if (s.node.placeholder) {
        <span class="tag">{{ placeholderTag }}</span>
      }
      @if (s.mismatch) {
        <span class="tag mismatch-tag">mismatch</span>
      }
      @if (!last) {
        <span class="connector" aria-hidden="true"></span>
      }
    </li>
  }
</ol>
