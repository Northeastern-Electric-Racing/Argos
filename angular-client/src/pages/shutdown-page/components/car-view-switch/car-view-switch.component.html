<div role="group" aria-label="Car view mode" [class]="listClass">
  @for (m of modes; track m.id) {
    <button type="button" [class]="itemClass" [attr.aria-pressed]="mode() === m.id" (click)="setMode(m.id)">
      {{ m.label }}
    </button>
  }
</div>
@if (mode() === '3d') {
  <car-view-3d [nodes]="nodes()" />
} @else {
  <car-view [nodes]="nodes()" />
}
