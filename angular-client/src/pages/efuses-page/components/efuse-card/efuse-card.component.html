<info-background
  [svgIcon]="'electrical_services'"
  [title]="efuseName() + ' - ' + maxCurrent() + 'A'"
  [topRightInfo]="notice()"
  [topRightInfoSize]="'12px'"
>
  <div class="h-full pt-5 pr-7.5 pb-2.5 pl-10 max-md:px-0">
    <div class="flex flex-col gap-7.5">
      <!-- Current display + ADC displays side by side; on phones the ADC column wraps below -->
      <div class="mt-2.5 flex flex-wrap items-center justify-center gap-x-25 gap-y-4 max-md:gap-x-6">
        <!-- Main Current Value (Large) -->
        <div class="flex flex-col items-start gap-1.25">
          <seven-segment-display
            [value]="current.toFixed(2)"
            [digits]="3"
            [decimals]="2"
            [fontSize]="largeDisplayFontSize"
            [unit]="'A'"
            [unitFontSize]="largeDisplayUnitFontSize"
          />
          <!-- the same size as the unit beside it, so the two always move together -->
          <div class="leading-[1.2] font-bold text-fg" [style.font-size.px]="largeDisplayUnitFontSize">Current</div>
        </div>

        <!-- ADC Voltage + ADC Raw stacked vertically -->
        <div class="flex flex-col items-start gap-2.5">
          <div class="flex flex-col items-start gap-1.25">
            <seven-segment-display
              [value]="voltage.toFixed(2)"
              [digits]="3"
              [decimals]="2"
              [fontSize]="smallDisplayFontSize"
              [unit]="'V'"
              [unitFontSize]="smallDisplayUnitFontSize"
              [paddingBottom]="smallDisplayPaddingBottom"
              [paddingLeft]="smallDisplayPaddingLeft"
              [paddingRight]="smallDisplayPaddingRight"
              [paddingTop]="smallDisplayPaddingTop"
            />
            <div [class]="displayLabelClass">ADC Voltage</div>
          </div>

          <div class="flex flex-col items-start gap-1.25">
            <seven-segment-display
              [value]="adcRaw.toFixed(0).padStart(4, '0')"
              [digits]="4"
              [decimals]="0"
              [fontSize]="smallDisplayFontSize"
              [unit]="'RAW'"
              [unitFontSize]="smallDisplayUnitFontSize"
              [paddingBottom]="smallDisplayPaddingBottom"
              [paddingLeft]="smallDisplayPaddingLeft"
              [paddingRight]="smallDisplayPaddingRight"
              [paddingTop]="smallDisplayPaddingTop"
            />
            <div [class]="displayLabelClass">ADC</div>
          </div>
        </div>
      </div>

      <!-- Status Indicators + Switch (centered, stacked) -->
      <div class="flex flex-col items-center gap-7.5">
        <div class="flex items-center justify-center gap-3.75">
          <indicator-light [label]="'FAULTED'" [active]="isFaulted" [color]="'red'" [fontSize]="14" />
          <indicator-light [label]="'ENABLED'" [active]="isEnabled" [color]="'green'" [fontSize]="14" />
        </div>

        <!-- Switch + optional AUTO telemetry display -->
        <div [class]="controlRowClass()">
          <div class="flex flex-col items-center gap-1.5">
            <div class="flex items-center justify-center gap-2.5">
              <efuse-switch
                [ariaLabel]="efuseName() + ' mode'"
                [fontSize]="14"
                [options]="switchOptions()"
                [selectedState]="switchState()"
                [disabled]="effectivelyLocked()"
                (stateChange)="onSwitchStateChange($event)"
              />
              @if (showsLockButton()) {
                <lock-button [ariaLabel]="'Lock ' + efuseName()" [locked]="isLocked()" (pressed)="onLockButtonClick()" />
              }
            </div>
            <seven-segment-display
              [value]="controlStateDisplay()"
              [digits]="4"
              [decimals]="0"
              [fontSize]="controlDisplayFontSize"
              [textAlign]="'left'"
              [stackAlign]="'start'"
              [unitFontSize]="0"
              [paddingBottom]="controlDisplayPaddingBottom"
              [paddingLeft]="controlDisplayPaddingLeft"
              [paddingRight]="controlDisplayPaddingRight"
              [paddingTop]="controlDisplayPaddingTop"
            />
          </div>
          @if (hasAutoMode()) {
            <div class="flex flex-col items-start gap-0.5">
              <seven-segment-display
                [value]="autoValue.toFixed(autoDecimals()).padStart(autoDigits() + (autoDecimals() > 0 ? 1 : 0), '0')"
                [digits]="autoDigits()"
                [decimals]="autoDecimals()"
                [fontSize]="smallDisplayFontSize"
                [unit]="autoUnit()"
                [unitFontSize]="smallDisplayUnitFontSize"
                [paddingBottom]="smallDisplayPaddingBottom"
                [paddingLeft]="smallDisplayPaddingLeft"
                [paddingRight]="smallDisplayPaddingRight"
                [paddingTop]="smallDisplayPaddingTop"
              />
              <div [class]="displayLabelClass">{{ autoLabel() }}</div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</info-background>
