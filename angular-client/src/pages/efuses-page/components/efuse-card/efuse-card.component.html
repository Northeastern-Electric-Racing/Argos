<info-background [svgIcon]="'electrical_services'" [title]="efuseName()">
  <vstack style="padding: 20px 20px 30px 20px; gap: 20px; height: 100%; justify-content: space-between">
    <!-- Main Current Value (Large) -->
    <vstack [align]="'flex-start'" style="margin-top: 10px">
      <seven-segment-display [value]="current.toFixed(2)" [digits]="3" [decimals]="2" [fontSize]="80" [unit]="'A'" [unitFontSize]="30" />
      <div class="current-label">Current</div>
      <!-- uncomment this eventually <div class="max-current-text">{{ maxCurrent() }} A</div> -->
    </vstack>

    <!-- ADC Voltage -->
    <hstack style="align-items: center; margin-top: 10px">
      <div class="adc-voltage-label">ADC Voltage:</div>
      <seven-segment-display [value]="voltage.toFixed(2)" [digits]="3" [decimals]="2" [fontSize]="40" [unit]="'V'" [unitFontSize]="20" [paddingBottom]="4" [paddingLeft]="12" [paddingRight]="12" [paddingTop]="10" />
      <seven-segment-display [value]="adcRaw.toFixed(2)" [digits]="4" [decimals]="0" [fontSize]="40" [unit]="'RAW'" [unitFontSize]="20" [paddingBottom]="4" [paddingLeft]="12" [paddingRight]="12" [paddingTop]="10" />
      <!-- uncomment this eventually <div class="max-current-text">{{ maxCurrent() }} A</div> -->
    </hstack>

    <!-- Status Indicators -->
    <vstack style="gap: 10px; margin-top: 10px">
      <hstack style="align-items: center; gap: 10px; justify-content: space-between">
        <typography variant="sidebar-label" content="Faulted:" />
        <div 
          [style.background-color]="isFaulted ? '#ef4444' : '#6b7280'" 
          style="width: 50px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold">
          {{ isFaulted ? 'YES' : 'NO' }}
        </div>
      </hstack>

      <hstack style="align-items: center; gap: 10px; justify-content: space-between">
        <typography variant="sidebar-label" content="Enabled:" />
        <div 
          [style.background-color]="isEnabled ? '#22c55e' : '#6b7280'" 
          style="width: 50px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold">
          {{ isEnabled ? 'YES' : 'NO' }}
        </div>
      </hstack>
    </vstack>
  </vstack>
</info-background>
