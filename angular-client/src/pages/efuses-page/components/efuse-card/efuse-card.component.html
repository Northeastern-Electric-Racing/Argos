<info-background [svgIcon]="'electrical_services'" [title]="efuseName()">
  <div style="padding: 20px 30px 30px 40px; height: 100%; box-sizing: border-box;">
    <vstack [align]="'flex-center'" [spacing]="'30px'" style="height: 100%; justify-content: space-between;">
    <!-- Current display + ADC displays side by side -->
    <hstack [spacing]="'100px'" style="align-items: flex-start; margin-top: 10px">
      <!-- Main Current Value (Large) -->
      <vstack [align]="'flex-start'">
        <seven-segment-display [value]="current.toFixed(2)" [digits]="3" [decimals]="2" [fontSize]="80" [unit]="'A'" [unitFontSize]="30" />
        <div class="current-label">Current</div>
      </vstack>

      <!-- ADC Voltage + ADC Raw stacked vertically -->
      <vstack [spacing]="'10px'" [align]="'flex-start'">
        <!-- ADC Voltage -->
        <vstack [align]="'flex-start'">
          <seven-segment-display [value]="voltage.toFixed(2)" [digits]="3" [decimals]="2" [fontSize]="40" [unit]="'V'" [unitFontSize]="20" [paddingBottom]="4" [paddingLeft]="12" [paddingRight]="12" [paddingTop]="10" />
          <div class="adc-voltage-label">ADC Voltage</div>
        </vstack>

        <!-- ADC Raw -->
        <vstack [align]="'flex-start'">
          <seven-segment-display [value]="adcRaw.toFixed(0).padStart(4, '0')" [digits]="4" [decimals]="0" [fontSize]="40" [unit]="'RAW'" [unitFontSize]="20" [paddingBottom]="4" [paddingLeft]="12" [paddingRight]="12" [paddingTop]="10" />
          <div class="adc-voltage-label">ADC</div>
        </vstack>
      </vstack>
    </hstack>

    <!-- Status Indicators -->

  </div>
</info-background>
