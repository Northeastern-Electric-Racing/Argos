<div class="switch-group">
  <button
    type="button"
    class="switch-button"
    [attr.aria-pressed]="locked()"
    [class.active]="locked()"
    [class.state-locked]="locked()"
    (click)="pressed.emit()"
    aria-label="Toggle lock"
  >
    <span class="material-icons switch-label">{{ locked() ? 'lock' : 'lock_open' }}</span>
  </button>
</div>
