<div class="switch-group">
  <button
    class="switch-button"
    [class.active]="locked()"
    [class.state-locked]="locked()"
    (click)="pressed.emit()"
    aria-label="Toggle lock"
  >
    <span class="material-symbols-outlined switch-label" aria-hidden="true">{{ locked() ? 'lock' : 'lock_open' }}</span>
  </button>
</div>
