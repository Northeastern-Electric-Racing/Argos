<div role="group" [attr.aria-label]="ariaLabel()" [class]="groupClass">
  @for (option of orderedOptions(); track option) {
    <button
      type="button"
      [class]="classFor()(option)"
      [attr.aria-pressed]="selected() === option"
      [style.font-size.px]="fontSize()"
      [disabled]="disabled()"
      (click)="select(option)"
    >
      {{ option }}
    </button>
  }
</div>
