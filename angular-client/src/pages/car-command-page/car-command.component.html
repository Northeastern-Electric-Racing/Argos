<div class="page-container">
  @if (dataTypesError()) {
    <error-page [errorMessage]="dataTypesError()!.message" />
  } @else if (settingsError()) {
    <error-page [errorMessage]="settingsError()!.message" />
  } @else if (dataTypesIsLoading() || settingsIsLoading()) {
    <loading-page />
  } @else if (!isAuthenticated()) {
    <div class="auth-section">
      <info-background title="Car Commands" icon="lock">
        <div class="auth-content">
          <p class="auth-description">Enter the command password to access car controls.</p>
          <form nz-form nzLayout="vertical" class="auth-form" (ngSubmit)="authenticatePw()">
            <nz-form-item>
              <nz-form-label nzFor="password">Password</nz-form-label>
              <nz-form-control [nzValidateStatus]="authError() ? 'error' : ''" [nzErrorTip]="authError()">
                <nz-input-password>
                  <input nz-input id="password" name="password" [(ngModel)]="enteredPw" />
                </nz-input-password>
              </nz-form-control>
            </nz-form-item>
            <button nz-button nzType="primary" nzBlock type="submit">Authenticate</button>
          </form>
        </div>
      </info-background>
    </div>
  } @else {
    <div class="page-header">
      <typography variant="large-header" content="Car Commands" />
      <button nz-button (click)="onUpdateVideosPressed()">Update Videos</button>
    </div>

    <div class="commands-grid">
      @for (command of carCommandTopics(); track command.title) {
        <command-card [command]="command" (sendCommand)="confirmSendCommand($event.title, $event.value)" />
      }
    </div>

    <div class="section-spacer">
      <info-background title="Scylla Settings" icon="settings">
        <div class="settings-content">
          <div class="settings-grid">
            <setting-input [label]="'Batch Time (s)'" [(value)]="batchTime" [min]="0" [max]="3600" />
            <setting-input [label]="'Rate Limit Mode'" [(value)]="rateLimitMode" [min]="0" [max]="10" />
            <setting-input [label]="'Rate Limit Time (ms)'" [(value)]="rateLimitTime" [min]="0" [max]="60000" />
            <setting-input [label]="'Discard Percentage'" [(value)]="discardPercentage" [min]="0" [max]="100" />
          </div>
          <div class="settings-footer">
            <setting-toggle [label]="'Upload Enabled'" [(value)]="uploadEnabled" />
            <button nz-button nzType="primary" (click)="confirmSaveSettings()">Save Settings</button>
          </div>
        </div>
      </info-background>
    </div>
  }
</div>
