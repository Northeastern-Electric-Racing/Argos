<div class="flex flex-col gap-1.5">
  <label uiLabel [for]="inputId()">{{ label() }}</label>
  <input
    uiInput
    [class]="numberInput"
    type="number"
    [id]="inputId()"
    [(ngModel)]="value"
    [attr.min]="min()"
    [attr.max]="max()"
    (change)="onValueChange($any($event.target).value)"
    autocomplete="off"
  />
</div>
