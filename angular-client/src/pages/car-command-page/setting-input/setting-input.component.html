<mat-form-field class="setting-field" subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    type="number"
    [(ngModel)]="value"
    [attr.min]="min()"
    [attr.max]="max()"
    (change)="onValueChange($any($event.target).value)"
    autocomplete="off"
  />
</mat-form-field>
