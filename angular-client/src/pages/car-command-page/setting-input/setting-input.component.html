<div class="setting-input-wrapper">
  <label [for]="label() + '-input'" class="setting-label">{{ label() }}</label>
  <input
    pInputText
    type="number"
    [id]="label() + '-input'"
    [(ngModel)]="value"
    [attr.min]="min()"
    [attr.max]="max()"
    (change)="onValueChange($any($event.target).value)"
    autocomplete="off"
  />
</div>
