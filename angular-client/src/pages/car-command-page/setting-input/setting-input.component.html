<div class="setting-input-wrapper">
  <label [for]="label() + '-input'" class="setting-label">{{ label() }}</label>
  <tui-textfield tuiTextfieldSize="m" [tuiTextfieldCleaner]="false">
    <input
      tuiInputNumber
      [id]="label() + '-input'"
      [min]="min() ?? null"
      [max]="max() ?? null"
      [ngModel]="value() ?? null"
      (ngModelChange)="onValueChange($event)"
      autocomplete="off"
    />
  </tui-textfield>
</div>
