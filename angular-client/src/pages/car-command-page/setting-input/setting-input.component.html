<p-floatlabel>
  <input
    pInputText
    type="number"
    [id]="label() + '-input'"
    [(ngModel)]="value"
    [attr.min]="min()"
    [attr.max]="max()"
    (change)="onValueChange($any($event.target).value)"
    autocomplete="off"
  />
  <label [for]="label() + '-input'">{{ label() }}</label>
</p-floatlabel>
