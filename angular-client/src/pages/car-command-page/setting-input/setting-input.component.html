<div class="flex flex-col gap-1.5">
  <label uiLabel [for]="label() + '-input'">{{ label() }}</label>
  <input
    uiInput
    class="w-full tabular-nums"
    type="number"
    [id]="label() + '-input'"
    [(ngModel)]="value"
    [attr.min]="min()"
    [attr.max]="max()"
    (change)="onValueChange($any($event.target).value)"
    autocomplete="off"
  />
</div>
