<div class="value-row">
  <span class="row-label">{{ row().label }}</span>
  <span class="value-label">{{ currentValue() ?? '--' }}</span>
  <tui-textfield tuiTextfieldSize="s" [tuiTextfieldCleaner]="false">
    <input
      tuiInputNumber
      [id]="inputId()"
      [attr.aria-label]="row().label"
      [min]="-1000000"
      [max]="1000000"
      [tuiNumberFormat]="{ precision: 6 }"
      [ngModel]="value()"
      (ngModelChange)="value.set($event ?? 0)"
    />
  </tui-textfield>
</div>
