<div class="value-row">
  <span class="row-label">{{ row().label }}</span>
  <span class="value-label">{{ currentValue() ?? '--' }}</span>
  <mat-form-field class="row-input dense-controls" subscriptSizing="dynamic">
    <input
      matInput
      type="number"
      [(ngModel)]="value"
      [id]="inputId()"
      [min]="-1000000"
      [max]="1000000"
      [attr.aria-label]="row().label"
    />
  </mat-form-field>
</div>
