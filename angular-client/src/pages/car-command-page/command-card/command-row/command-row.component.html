<label class="self-center text-sm text-fg" [for]="inputId()">{{ row().label }}</label>
<span class="self-center text-sm text-fg-muted tabular-nums">{{ currentValue() ?? '--' }}</span>
<input
  #field="ngModel"
  uiInput
  type="number"
  [class]="numberInput"
  [ngModel]="value()"
  (ngModelChange)="onValueChange($event, field)"
  [id]="inputId()"
  [min]="min"
  [max]="max"
  step="any"
/>
