<div class="value-row">
  <span class="row-label">{{ row().label }}</span>
  <span class="value-label">{{ currentValue() ?? '--' }}</span>
  <input
    type="number"
    class="ui-input ui-input--fluid"
    [(ngModel)]="value"
    [id]="inputId()"
    min="-1000000"
    max="1000000"
    step="any"
  />
</div>
