<info-background [title]="command().title" icon="terminal" [fill]="true">
  <div class="card-content">
    <div class="value-grid">
      <div class="header-row">
        <span>Name</span>
        <span>Current</span>
        <span>New Value</span>
      </div>
      @for (row of command().rows; track row.dataType.name) {
        <command-row [row]="row" (valueChange)="onValueChange($event)" />
      }
    </div>
    <div class="card-footer">
      <button hlmBtn type="button" (click)="handleSend()">
        <ng-icon name="lucideSend" />
        Send Command
      </button>
    </div>
  </div>
</info-background>
