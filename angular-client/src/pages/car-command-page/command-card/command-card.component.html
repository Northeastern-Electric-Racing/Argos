<info-background class="block h-full" [title]="command().title" icon="terminal" [fill]="true">
  <div class="flex flex-1 flex-col gap-4 pt-2">
    <div class="grid grid-cols-[110px_auto_1fr] items-center gap-x-4 gap-y-3">
      <div class="contents text-xs tracking-wider text-fg-muted uppercase">
        <span>Name</span>
        <span>Current</span>
        <span>New Value</span>
      </div>
      @for (row of command().rows; track row.dataType.name) {
        <command-row [row]="row" (valueChange)="onValueChange($event)" />
      }
    </div>
    <div class="mt-auto flex justify-end pt-1">
      <argos-button label="Send Command" [onClick]="handleSend" />
    </div>
  </div>
</info-background>
