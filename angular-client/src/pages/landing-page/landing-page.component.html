<div class="mx-4 h-full">
  @if (isMobile) {
    <landing-page-mobile class="w-full" [time]="time" />
  } @else {
    <div class="flex flex-col">
      <div [class]="grid">
        <div [class]="tiles.dateLocation">
          <date-location class="mb-10 h-full w-full" />
        </div>
        <div [class]="tiles.small">
          <connection-display class="h-full w-full" />
        </div>
        <div [class]="tiles.small">
          <current-run-display class="h-full w-full" />
        </div>
        <div [class]="tiles.small">
          <viewer-display class="h-full w-full" />
        </div>
        <div [class]="tiles.small">
          <latency-display class="h-full w-full" />
        </div>

        <div [class]="tiles.torque">
          <torque-display class="h-full w-full" />
        </div>
        <div [class]="tiles.motor">
          <motor-info class="h-full w-full" />
        </div>
        <div [class]="tiles.driver">
          <driver-component class="h-full w-full" />
        </div>

        <div [class]="tiles.overTime">
          <speed-over-time-display class="h-full w-full" />
        </div>
        <div [class]="tiles.acceleration">
          <acceleration-graphs class="h-full w-full" />
        </div>
        <div [class]="tiles.overTime">
          <acceleration-over-time-display class="h-full w-full" />
        </div>

        <div [class]="tiles.raspberryPi">
          <raspberry-pi class="h-full w-full" />
        </div>
        <div [class]="tiles.brakes">
          <brake-pressure-display class="h-full w-full" />
        </div>
      </div>
    </div>
  }
</div>
