<sidebar-toggle style="width: 100%" />

<div class="tab-bar" role="tablist" aria-label="Mobile view tabs">
  <button
    class="tab-button"
    [class.active]="activeTab() === 'dashboard'"
    role="tab"
    [attr.aria-selected]="activeTab() === 'dashboard'"
    aria-controls="dashboard-panel"
    (click)="setTab('dashboard')"
  >
    Dashboard
  </button>
  <button
    class="tab-button"
    [class.active]="activeTab() === 'mqtt'"
    role="tab"
    [attr.aria-selected]="activeTab() === 'mqtt'"
    aria-controls="mqtt-panel"
    (click)="setTab('mqtt')"
  >
    MQTT Values
  </button>
</div>

@switch (activeTab()) {
  @case ('dashboard') {
    <vstack id="dashboard-panel" role="tabpanel" style="width: 100%" spacing="20px">
      <typography variant="xx-large-title" content="Argos" />
      <typography variant="x-large-title" [content]="time() | date: 'HH:mm:ss'" />
      <typography variant="x-large-title" content="{{ time() | date: 'MM/dd/yyyy' }}" />

      <driver-component style="width: 100%" />

      <speed-over-time-display style="width: 100%" />
      <acceleration-over-time-display style="width: 100%" />

      <acceleration-graphs style="width: 100%" />

      <motor-info style="width: 100%; height: 250px" />
      <battery-info-display style="width: 100%; height: 250px" />
      <raspberry-pi style="width: 100%" />
    </vstack>
  }
  @case ('mqtt') {
    <div id="mqtt-panel" role="tabpanel" class="mqtt-panel">
      <mqtt-mobile-view />
    </div>
  }
}
