<div class="mqtt-mobile-container">
  <div class="search-bar">
    <input
      type="text"
      class="search-input"
      placeholder="Search topics..."
      [value]="searchQuery()"
      (input)="onSearchInput($event)"
      aria-label="Search MQTT topics"
    />
  </div>

  @if (isLoading()) {
    <div class="loading-container">
      <typography variant="subheader" content="Loading MQTT values..." />
    </div>
  } @else {
    <div class="values-list" role="list">
      @for (entry of filteredEntries(); track entry.name) {
        <div class="value-row" role="listitem">
          <div class="topic-info">
            <span class="topic-name">{{ entry.displayName }}</span>
          </div>
          <div class="value-info">
            <span class="topic-value">{{ entry.value }}</span>
            <span class="topic-unit">{{ entry.unit }}</span>
          </div>
        </div>
      } @empty {
        <div class="empty-state">
          <typography variant="subheader" content="No matching topics found" />
        </div>
      }
    </div>
  }
</div>
