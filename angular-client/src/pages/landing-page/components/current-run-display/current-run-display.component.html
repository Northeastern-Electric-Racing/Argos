@if (this.navBarStyle()) {
  <hstack spacing="5px">
    <typography
      [variant]="small() ? 'sidebar-label' : 'large-header'"
      content="Run"
      textClass="m-0 text-readout text-accent"
    />
    <typography
      [variant]="small() ? 'sidebar-label' : 'large-header'"
      content="#{{ currentRun }}"
      textClass="m-0 text-readout text-accent"
    />
  </hstack>
} @else {
  <info-background>
    <div class="flex h-full flex-col items-center justify-center">
      <typography variant="header" content="Run" textClass="m-0" />
      <typography variant="info-subtitle" content="#{{ currentRun }}" />
    </div>
  </info-background>
}
