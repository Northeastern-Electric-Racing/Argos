<info-background backgroundColor="var(--color-page)">
  <vstack spacing="20px">
    <typography variant="x-large-title" content="Argos" textClass="text-numeral" />
    <div class="flex h-full w-full flex-row items-center justify-center">
      <typography variant="subheader" content="{{ time | date: 'MM/dd/yyyy' }} " textClass="m-0 text-lg" />
      <divider class="mx-5 h-5" />
      <typography variant="subheader" content="{{ location }}" textClass="m-0 text-lg" />
    </div>
  </vstack>
</info-background>
