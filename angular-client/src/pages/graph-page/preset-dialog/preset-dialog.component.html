<div class="dialog-content">
  <input
    #fileInput
    type="file"
    accept=".json,application/json"
    class="hidden-file-input"
    (change)="onFileSelected($event)"
    aria-hidden="true"
  />

  <section class="save-section">
    <div class="actions-row">
      <div class="save-form">
        <label for="preset-name">Save current selection</label>
        <div class="save-form-controls">
          <input
            id="preset-name"
            nz-input
            [ngModel]="newPresetName()"
            (ngModelChange)="newPresetName.set($event)"
            placeholder="Preset name…"
            (keyup.enter)="onSaveCurrent()"
          />
          <button
            nz-button
            nzType="primary"
            type="button"
            (click)="onSaveCurrent()"
            [disabled]="!hasSelection() || newPresetName().trim().length === 0"
          >
            Save
          </button>
        </div>
      </div>

      <button nz-button type="button" (click)="onUploadClick()">Upload JSON</button>
    </div>
    @if (!hasSelection()) {
      <small class="hint">Select a topic to save a preset</small>
    }
  </section>

  <section class="presets-list">
    <nz-table
      #presetTable
      nzSize="small"
      nzTableLayout="fixed"
      [nzData]="presets()"
      [nzFrontPagination]="false"
      [nzShowPagination]="false"
      [nzNoResult]="noPresets"
    >
      <thead>
        <tr>
          <th>Name</th>
          <th nzWidth="70px" nzAlign="right">Topics</th>
          <th nzWidth="16rem" nzAlign="right">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (preset of presetTable.data; track preset.id) {
          <tr>
            <td nzEllipsis [title]="preset.name">{{ preset.name }}</td>
            <td nzAlign="right">{{ preset.topicNames.length }}</td>
            <td nzAlign="right" class="actions">
              <button nz-button nzType="primary" nzSize="small" type="button" (click)="onApply(preset)">Apply</button>
              <button nz-button nzSize="small" type="button" (click)="onDownload(preset)">Download</button>
              <button nz-button nzType="text" nzDanger nzSize="small" type="button" (click)="onDelete(preset)">
                Delete
              </button>
            </td>
          </tr>
        }
      </tbody>
    </nz-table>
    <ng-template #noPresets>
      <nz-empty
        nzNotFoundImage="simple"
        nzNotFoundContent="No presets yet. Save your current topic selection or upload a JSON of your preset."
      />
    </ng-template>
  </section>

  <div class="footer">
    <button nz-button nzType="text" type="button" (click)="onAddDefaultPresets()">Add Default Presets</button>
    <button nz-button nzType="text" type="button" (click)="onClose()">Close</button>
  </div>
</div>
