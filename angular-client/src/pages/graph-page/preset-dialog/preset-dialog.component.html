<h2 mat-dialog-title>Topic Presets</h2>
<mat-dialog-content class="dialog-content">
  <input
    #fileInput
    type="file"
    accept=".json,application/json"
    class="hidden-file-input"
    (change)="onFileSelected($event)"
    aria-hidden="true"
  />
  <section class="save-section">
    <div class="actions-row">
      <mat-form-field class="save-field" subscriptSizing="dynamic">
        <mat-label>Save current selection</mat-label>
        <input
          matInput
          [ngModel]="newPresetName()"
          (ngModelChange)="newPresetName.set($event)"
          placeholder="Preset name…"
          (keyup.enter)="onSaveCurrent()"
        />
        @if (!hasSelection()) {
          <mat-hint>Select a topic to save a preset</mat-hint>
        }
      </mat-form-field>
      <button
        matButton="filled"
        type="button"
        (click)="onSaveCurrent()"
        [disabled]="!hasSelection() || newPresetName().trim().length === 0"
      >
        Save
      </button>
      <button matButton="outlined" type="button" (click)="onUploadClick()">Upload JSON</button>
    </div>
  </section>

  <section class="presets-list">
    @if (presets().length === 0) {
      <div class="empty-state">
        <p>No presets yet</p>
        <small> Save your current topic selection or upload a JSON of your preset </small>
      </div>
    } @else {
      <table mat-table [dataSource]="presets()" class="preset-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="name">Name</th>
          <td mat-cell *matCellDef="let preset" class="name" [title]="preset.name">
            <span class="name-text">{{ preset.name }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="topics">
          <th mat-header-cell *matHeaderCellDef class="topic-count">Topics</th>
          <td mat-cell *matCellDef="let preset" class="topic-count">{{ preset.topicNames.length }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions">Actions</th>
          <td mat-cell *matCellDef="let preset" class="actions">
            <button matButton="filled" type="button" (click)="onApply(preset)">Apply</button>
            <button matButton="outlined" type="button" (click)="onDownload(preset)">Download</button>
            <button matButton type="button" class="danger-action" (click)="onDelete(preset)">Delete</button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let preset; columns: columns"></tr>
      </table>
    }
  </section>
</mat-dialog-content>
<mat-dialog-actions align="end" class="footer">
  <button matButton type="button" (click)="onAddDefaultPresets()">Add Default Presets</button>
  <span class="spacer"></span>
  <button matButton type="button" (click)="onClose()">Close</button>
</mat-dialog-actions>
