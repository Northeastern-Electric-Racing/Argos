<div class="flex flex-row flex-wrap items-center gap-2 max-md:w-full max-md:gap-1.5">
  <run-selector [selectRun]="onRunSelected()" />
  @if (historicalOn()) {
    <argos-button [onClick]="onSetRealTime()" label="Realtime" size="sm" />
  }
  <argos-button [onClick]="onClearDataType()" label="Clear Graph" size="sm" variant="tonal" />

  <div
    class="flex flex-row items-center gap-1.5 border-l border-solid border-secondary-border/25 pl-2.5 max-md:flex-wrap max-md:border-l-0 max-md:pl-0"
  >
    <span class="text-xs font-semibold tracking-[0.04em] text-secondary-border uppercase">Historical:</span>
    <!-- The Quick Select at the sm Custom button's font size, through the select's own size hook. -->
    <select-dropdown
      class="[--ui-select-font-size:var(--text-xs)] max-md:min-w-32.5"
      [options]="quickSelectConfig().options"
      [placeholder]="quickSelectConfig().placeholder"
      [defaultValue]="selectedPresetLabel()"
    />
    <div class="flex flex-col items-start gap-0.5">
      <argos-button
        [onClick]="toggleCustomPopover"
        label="Custom"
        size="sm"
        [variant]="customActive() ? 'secondary' : 'tonal'"
        ariaHaspopup="dialog"
        [ariaExpanded]="customPopover.isOpen()"
      />
      @if (customActive() && customCaption()) {
        <span class="text-badge leading-none whitespace-nowrap text-secondary-border">{{ customCaption() }}</span>
      }
    </div>
  </div>

  <ui-popover #customPopover ariaLabel="Custom time range" (shown)="onCustomPopoverShow()">
    <div class="flex min-w-65 flex-col gap-3 p-4" ngTabs>
      <div
        ngTabList
        [class]="segmented.list"
        aria-label="Range type"
        [selectedTab]="customMode()"
        (selectedTabChange)="setCustomMode($event)"
      >
        <div ngTab value="last-x" [class]="segmented.item">Last X</div>
        <div ngTab value="date-range" [class]="segmented.item">Date Range</div>
      </div>

      <div ngTabPanel value="last-x" [class]="segmented.panel">
        <ng-template ngTabContent>
          <div [class]="field.field">
            <label uiLabel for="custom-hours">Hours</label>
            <input
              #hoursField="ngModel"
              id="custom-hours"
              type="number"
              uiInput="sm"
              [class]="numberInputClass"
              [ngModel]="customHours()"
              (ngModelChange)="setLastX(customHours, $event, hoursField)"
              min="0"
              step="1"
              placeholder="0"
            />
          </div>
          <div [class]="field.field">
            <label uiLabel for="custom-minutes">Minutes</label>
            <input
              #minutesField="ngModel"
              id="custom-minutes"
              type="number"
              uiInput="sm"
              [class]="numberInputClass"
              [ngModel]="customMinutes()"
              (ngModelChange)="setLastX(customMinutes, $event, minutesField)"
              min="0"
              step="1"
              placeholder="30"
            />
          </div>
          <argos-button [onClick]="applyCustomLastX" label="Apply" size="sm" variant="secondary" />
        </ng-template>
      </div>

      <div ngTabPanel value="date-range" [class]="segmented.panel">
        <ng-template ngTabContent>
          <div [class]="field.field">
            <label uiLabel for="custom-from">From</label>
            <ui-datetime-input
              inputId="custom-from"
              [ngModel]="customFromDate()"
              (ngModelChange)="customFromDate.set($event)"
              [maxDate]="maxDate()"
            />
          </div>
          <div [class]="field.field">
            <label uiLabel for="custom-to">To</label>
            <ui-datetime-input
              inputId="custom-to"
              [ngModel]="customToDate()"
              (ngModelChange)="customToDate.set($event)"
              [maxDate]="maxDate()"
            />
          </div>
          <argos-button [onClick]="applyCustomDateRange" label="Apply" size="sm" variant="secondary" />
        </ng-template>
      </div>
    </div>
  </ui-popover>
</div>
