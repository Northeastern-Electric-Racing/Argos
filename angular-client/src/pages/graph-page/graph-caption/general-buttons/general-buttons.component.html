<div class="general-buttons-row">
  <run-selector [selectRun]="onRunSelected()" />
  @if (historicalOn()) {
    <argos-button [onClick]="onSetRealTime()" label="Realtime" size="sm" />
  }
  <argos-button [onClick]="onClearDataType()" label="Clear Graph" size="sm" variant="tonal" />

  <div class="historical-section">
    <span class="historical-label">Historical:</span>
    <select-dropdown
      [options]="quickSelectConfig().options"
      [placeholder]="quickSelectConfig().placeholder"
      [defaultValue]="selectedPresetLabel()"
    />
    <div class="custom-stack">
      <argos-button
        [onClick]="toggleCustomPopover"
        label="Custom"
        size="sm"
        [variant]="customActive() ? 'secondary' : 'tonal'"
        ariaHaspopup="dialog"
        [ariaExpanded]="customPopover.isOpen()"
      />
      @if (customActive() && customCaption()) {
        <span class="custom-caption">{{ customCaption() }}</span>
      }
    </div>
  </div>

  <ui-popover #customPopover panelClass="custom-range-popover" ariaLabel="Custom time range" (shown)="onCustomPopoverShow()">
    <div class="custom-popover-body" ngTabs>
      <div
        ngTabList
        class="ui-segmented"
        aria-label="Range type"
        [selectedTab]="customMode()"
        (selectedTabChange)="setCustomMode($event)"
      >
        <div ngTab value="last-x">Last X</div>
        <div ngTab value="date-range">Date Range</div>
      </div>

      <div ngTabPanel value="last-x" class="mode-body">
        <ng-template ngTabContent>
          <div class="ui-field">
            <label class="ui-label" for="custom-hours">Hours</label>
            <input
              id="custom-hours"
              type="number"
              class="ui-input ui-input--sm"
              [ngModel]="customHours()"
              (ngModelChange)="customHours.set($event)"
              min="0"
              step="1"
              placeholder="0"
            />
          </div>
          <div class="ui-field">
            <label class="ui-label" for="custom-minutes">Minutes</label>
            <input
              id="custom-minutes"
              type="number"
              class="ui-input ui-input--sm"
              [ngModel]="customMinutes()"
              (ngModelChange)="customMinutes.set($event)"
              min="0"
              step="1"
              placeholder="30"
            />
          </div>
          <argos-button [onClick]="applyCustomLastX" label="Apply" size="sm" variant="secondary" />
        </ng-template>
      </div>

      <div ngTabPanel value="date-range" class="mode-body">
        <ng-template ngTabContent>
          <div class="ui-field">
            <label class="ui-label" for="custom-from">From</label>
            <ui-datetime-input
              inputId="custom-from"
              [ngModel]="customFromDate()"
              (ngModelChange)="customFromDate.set($event)"
              [maxDate]="maxDate()"
            />
          </div>
          <div class="ui-field">
            <label class="ui-label" for="custom-to">To</label>
            <ui-datetime-input
              inputId="custom-to"
              [ngModel]="customToDate()"
              (ngModelChange)="customToDate.set($event)"
              [maxDate]="maxDate()"
            />
          </div>
          <argos-button [onClick]="applyCustomDateRange" label="Apply" size="sm" variant="secondary" />
        </ng-template>
      </div>
    </div>
  </ui-popover>
</div>
