<div class="general-buttons-row">
  <run-selector [selectRun]="onRunSelected()" />
  @if (historicalOn()) {
    <argos-button [onClick]="onSetRealTime()" label="Realtime" size="sm" additionalStyles="border: 1.4px solid #000" />
  }
  <argos-button
    [onClick]="onClearDataType()"
    label="Clear Graph"
    size="sm"
    additionalStyles="background-color: #323232; border: 1.4px solid #027bd7;"
  />

  <div class="historical-section">
    <span class="historical-label">Historical:</span>
    <select-dropdown
      [options]="quickSelectConfig().options"
      [placeholder]="quickSelectConfig().placeholder"
      [defaultValue]="selectedPresetLabel()"
    />
    <div
      class="custom-stack"
      tuiDropdownAlign="end"
      [tuiDropdown]="customPopover"
      [tuiDropdownOpen]="customOpen()"
      (tuiDropdownOpenChange)="onCustomOpenChange($event)"
    >
      <!-- tuiDropdownOpen toggles the popover on the button's click, Esc and outside clicks -->
      <argos-button
        [onClick]="noop"
        label="Custom"
        size="sm"
        [additionalStyles]="
          customActive()
            ? 'background-color: #027bd7; border: 1.4px solid #8fcadd;'
            : 'background-color: #0c2026; border: 1.4px solid #8fcadd;'
        "
      />
      @if (customActive() && customCaption()) {
        <span class="custom-caption">{{ customCaption() }}</span>
      }
    </div>
  </div>

  <ng-template #customPopover>
    <div class="custom-popover-body">
      <tui-segmented
        size="s"
        class="mode-toggle"
        [activeItemIndex]="customMode() === 'last-x' ? 0 : 1"
        (activeItemIndexChange)="setCustomMode($event === 0 ? 'last-x' : 'date-range')"
      >
        <button type="button">Last X</button>
        <button type="button">Date Range</button>
      </tui-segmented>

      @if (customMode() === 'last-x') {
        <div class="mode-body">
          <div class="field-row">
            <label class="popover-label">Hours</label>
            <tui-textfield tuiTextfieldSize="s" class="number-field" [tuiTextfieldCleaner]="false">
              <input
                tuiInputNumber
                aria-label="Hours"
                placeholder="0"
                [min]="0"
                [step]="1"
                [ngModel]="customHours()"
                (ngModelChange)="customHours.set($event)"
              />
            </tui-textfield>
          </div>
          <div class="field-row">
            <label class="popover-label">Minutes</label>
            <tui-textfield tuiTextfieldSize="s" class="number-field" [tuiTextfieldCleaner]="false">
              <input
                tuiInputNumber
                aria-label="Minutes"
                placeholder="30"
                [min]="0"
                [step]="1"
                [ngModel]="customMinutes()"
                (ngModelChange)="customMinutes.set($event)"
              />
            </tui-textfield>
          </div>
          <argos-button
            [onClick]="applyCustomLastX"
            label="Apply"
            size="sm"
            additionalStyles="background-color: #027bd7; border: 1.4px solid #8fcadd;"
          />
        </div>
      } @else {
        <div class="mode-body">
          <div class="field-row">
            <label class="popover-label">From</label>
            <tui-textfield tuiTextfieldSize="s" class="date-field" [tuiTextfieldCleaner]="false">
              <input
                tuiInputDateTime
                timeMode="HH:MM:SS"
                aria-label="From"
                [max]="maxDayTime()"
                [ngModel]="customFromDayTime()"
                (ngModelChange)="setCustomFrom($event)"
              />
              <tui-calendar *tuiDropdown />
            </tui-textfield>
          </div>
          <div class="field-row">
            <label class="popover-label">To</label>
            <tui-textfield tuiTextfieldSize="s" class="date-field" [tuiTextfieldCleaner]="false">
              <input
                tuiInputDateTime
                timeMode="HH:MM:SS"
                aria-label="To"
                [max]="maxDayTime()"
                [ngModel]="customToDayTime()"
                (ngModelChange)="setCustomTo($event)"
              />
              <tui-calendar *tuiDropdown />
            </tui-textfield>
          </div>
          <argos-button
            [onClick]="applyCustomDateRange"
            label="Apply"
            size="sm"
            additionalStyles="background-color: #027bd7; border: 1.4px solid #8fcadd;"
          />
        </div>
      }
    </div>
  </ng-template>
</div>
