<div class="general-buttons-row">
  <run-selector [selectRun]="onRunSelected()" />
  @if (historicalOn()) {
    <argos-button [onClick]="onSetRealTime()" label="Realtime" size="sm" additionalStyles="border: 1.4px solid #000" />
  }
  <argos-button
    [onClick]="onClearDataType()"
    label="Clear Graph"
    size="sm"
    additionalStyles="background-color: #323232; border: 1.4px solid #027bd7;"
  />

  <div class="historical-section">
    <span class="historical-label">Historical:</span>
    <select-dropdown
      [options]="quickSelectConfig().options"
      [placeholder]="quickSelectConfig().placeholder"
      [defaultValue]="selectedPresetLabel()"
    />
    <div class="custom-stack" #customAnchor>
      <argos-button
        [onClick]="toggleCustomPopover"
        label="Custom"
        size="sm"
        [additionalStyles]="
          customActive()
            ? 'background-color: #027bd7; border: 1.4px solid #8fcadd;'
            : 'background-color: #0c2026; border: 1.4px solid #8fcadd;'
        "
      />
      @if (customActive() && customCaption()) {
        <span class="custom-caption">{{ customCaption() }}</span>
      }
    </div>
  </div>

  <hlm-popover
    align="start"
    sideOffset="8"
    [attachTo]="customAnchor"
    [state]="customPopoverOpen() ? 'open' : 'closed'"
    (stateChanged)="onCustomPopoverStateChanged($event)"
  >
    <hlm-popover-content *hlmPopoverPortal="let ctx" class="w-auto">
      <div class="custom-popover-body">
        <hlm-toggle-group
          class="w-full"
          type="single"
          variant="outline"
          size="sm"
          aria-label="Custom range mode"
          [nullable]="false"
          [value]="customMode()"
          (valueChange)="setCustomMode($event)"
        >
          @for (mode of customModes; track mode.value) {
            <button
              hlmToggleGroupItem
              class="flex-1 text-xs aria-pressed:bg-[#027bd7] aria-pressed:text-white data-[state=on]:bg-[#027bd7]"
              [value]="mode.value"
            >
              {{ mode.label }}
            </button>
          }
        </hlm-toggle-group>

        @if (customMode() === 'last-x') {
          <div class="mode-body">
            <div class="field-row">
              <label hlmLabel class="popover-label" for="custom-hours">Hours</label>
              <input
                hlmInput
                id="custom-hours"
                type="number"
                class="h-8 text-xs"
                [ngModel]="customHours()"
                (ngModelChange)="customHours.set($event)"
                min="0"
                step="1"
                placeholder="0"
              />
            </div>
            <div class="field-row">
              <label hlmLabel class="popover-label" for="custom-minutes">Minutes</label>
              <input
                hlmInput
                id="custom-minutes"
                type="number"
                class="h-8 text-xs"
                [ngModel]="customMinutes()"
                (ngModelChange)="customMinutes.set($event)"
                min="0"
                step="1"
                placeholder="30"
              />
            </div>
            <argos-button
              [onClick]="applyCustomLastX"
              label="Apply"
              size="sm"
              additionalStyles="background-color: #027bd7; border: 1.4px solid #8fcadd;"
            />
          </div>
        } @else {
          <div class="mode-body">
            <div class="field-row">
              <label hlmLabel class="popover-label" for="custom-from-date">From</label>
              <div class="date-time-row">
                <hlm-date-picker
                  [date]="customFromDate()"
                  (dateChange)="customFromDate.set(withDay(customFromDate(), $event))"
                  [maxDate]="maxDate()"
                  [formatDate]="formatDay"
                >
                  <hlm-date-picker-trigger buttonId="custom-from-date" class="h-8 text-xs" />
                </hlm-date-picker>
                <input
                  hlmInput
                  type="time"
                  step="1"
                  class="time-input h-8 text-xs"
                  [value]="timeOf(customFromDate())"
                  (change)="customFromDate.set(withTime(customFromDate(), $any($event.target).value))"
                  aria-label="From time"
                />
              </div>
            </div>
            <div class="field-row">
              <label hlmLabel class="popover-label" for="custom-to-date">To</label>
              <div class="date-time-row">
                <hlm-date-picker
                  [date]="customToDate()"
                  (dateChange)="customToDate.set(withDay(customToDate(), $event))"
                  [maxDate]="maxDate()"
                  [formatDate]="formatDay"
                >
                  <hlm-date-picker-trigger buttonId="custom-to-date" class="h-8 text-xs" />
                </hlm-date-picker>
                <input
                  hlmInput
                  type="time"
                  step="1"
                  class="time-input h-8 text-xs"
                  [value]="timeOf(customToDate())"
                  (change)="customToDate.set(withTime(customToDate(), $any($event.target).value))"
                  aria-label="To time"
                />
              </div>
            </div>
            <argos-button
              [onClick]="applyCustomDateRange"
              label="Apply"
              size="sm"
              additionalStyles="background-color: #027bd7; border: 1.4px solid #8fcadd;"
            />
          </div>
        }
      </div>
    </hlm-popover-content>
  </hlm-popover>
</div>
