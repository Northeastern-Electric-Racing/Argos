<div class="general-buttons-row">
  <run-selector [selectRun]="onRunSelected()" />
  @if (historicalOn()) {
    <button hlmBtn variant="secondary" size="sm" type="button" (click)="onSetRealTime()()">
      <ng-icon name="lucideRadio" />
      Realtime
    </button>
  }
  <button hlmBtn variant="outline" size="sm" type="button" (click)="onClearDataType()()">
    <ng-icon name="lucideEraser" />
    Clear Graph
  </button>

  <div class="historical-section">
    <span class="historical-label">Historical:</span>
    <select-dropdown
      [options]="quickSelectConfig().options"
      [placeholder]="quickSelectConfig().placeholder"
      [defaultValue]="selectedPresetLabel()"
    />
    <div class="custom-stack" #customAnchor>
      <button
        hlmBtn
        size="sm"
        type="button"
        [variant]="customActive() ? 'secondary' : 'outline'"
        aria-haspopup="dialog"
        [attr.aria-expanded]="customPopoverOpen()"
        (click)="toggleCustomPopover()"
      >
        <ng-icon name="lucideCalendarRange" />
        Custom
      </button>
      @if (customActive() && customCaption()) {
        <span class="custom-caption">{{ customCaption() }}</span>
      }
    </div>
  </div>

  <hlm-popover
    align="start"
    sideOffset="8"
    [attachTo]="customAnchor"
    [state]="customPopoverOpen() ? 'open' : 'closed'"
    (stateChanged)="onCustomPopoverStateChanged($event)"
  >
    <hlm-popover-content *hlmPopoverPortal="let ctx" class="w-auto">
      <div class="custom-popover-body">
        <hlm-toggle-group
          class="w-full"
          type="single"
          variant="outline"
          size="sm"
          aria-label="Custom range mode"
          [nullable]="false"
          [value]="customMode()"
          (valueChange)="setCustomMode($event)"
        >
          @for (mode of customModes; track mode.value) {
            <button hlmToggleGroupItem class="flex-1 text-xs" [value]="mode.value">
              {{ mode.label }}
            </button>
          }
        </hlm-toggle-group>

        @if (customMode() === 'last-x') {
          <div class="mode-body">
            <div class="field-row">
              <label hlmLabel class="popover-label" for="custom-hours">Hours</label>
              <input
                hlmInput
                id="custom-hours"
                type="number"
                class="h-8 text-xs md:text-xs"
                [ngModel]="customHours()"
                (ngModelChange)="customHours.set($event)"
                min="0"
                step="1"
                placeholder="0"
              />
            </div>
            <div class="field-row">
              <label hlmLabel class="popover-label" for="custom-minutes">Minutes</label>
              <input
                hlmInput
                id="custom-minutes"
                type="number"
                class="h-8 text-xs md:text-xs"
                [ngModel]="customMinutes()"
                (ngModelChange)="customMinutes.set($event)"
                min="0"
                step="1"
                placeholder="30"
              />
            </div>
            <button hlmBtn size="sm" type="button" (click)="applyCustomLastX()">Apply</button>
          </div>
        } @else {
          <div class="mode-body">
            <div class="field-row">
              <label hlmLabel class="popover-label" for="custom-from-date">From</label>
              <div class="date-time-row">
                <hlm-date-picker
                  [date]="customFromDate()"
                  (dateChange)="customFromDate.set(withDay(customFromDate(), $event))"
                  [maxDate]="maxDate()"
                  [formatDate]="formatDay"
                >
                  <hlm-date-picker-trigger buttonId="custom-from-date" class="h-8 text-xs md:text-xs" />
                </hlm-date-picker>
                <input
                  hlmInput
                  type="time"
                  step="1"
                  class="time-input h-8 text-xs md:text-xs"
                  [value]="timeOf(customFromDate())"
                  (change)="customFromDate.set(withTime(customFromDate(), $any($event.target).value))"
                  aria-label="From time"
                />
              </div>
            </div>
            <div class="field-row">
              <label hlmLabel class="popover-label" for="custom-to-date">To</label>
              <div class="date-time-row">
                <hlm-date-picker
                  [date]="customToDate()"
                  (dateChange)="customToDate.set(withDay(customToDate(), $event))"
                  [maxDate]="maxDate()"
                  [formatDate]="formatDay"
                >
                  <hlm-date-picker-trigger buttonId="custom-to-date" class="h-8 text-xs md:text-xs" />
                </hlm-date-picker>
                <input
                  hlmInput
                  type="time"
                  step="1"
                  class="time-input h-8 text-xs md:text-xs"
                  [value]="timeOf(customToDate())"
                  (change)="customToDate.set(withTime(customToDate(), $any($event.target).value))"
                  aria-label="To time"
                />
              </div>
            </div>
            <button hlmBtn size="sm" type="button" (click)="applyCustomDateRange()">Apply</button>
          </div>
        }
      </div>
    </hlm-popover-content>
  </hlm-popover>
</div>
