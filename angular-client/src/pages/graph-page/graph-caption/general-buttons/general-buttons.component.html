<div class="general-buttons-row">
  <run-selector [selectRun]="onRunSelected()" />
  @if (historicalOn()) {
    <p-button label="Realtime" icon="pi pi-bolt" size="small" (onClick)="onSetRealTime()()" />
  }
  <p-button label="Clear Graph" icon="pi pi-eraser" severity="secondary" size="small" (onClick)="onClearDataType()()" />

  <div class="historical-section">
    <span class="historical-label">Historical:</span>
    <select-dropdown
      [options]="quickSelectConfig().options"
      [placeholder]="quickSelectConfig().placeholder"
      [defaultValue]="selectedPresetLabel()"
    />
    <div class="custom-stack">
      <p-button
        label="Custom"
        icon="pi pi-calendar"
        size="small"
        [severity]="customActive() ? 'info' : 'secondary'"
        [outlined]="!customActive()"
        (onClick)="toggleCustomPopover($event)"
      />
      @if (customActive() && customCaption()) {
        <span class="custom-caption">{{ customCaption() }}</span>
      }
    </div>
  </div>

  <p-popover #customPopover styleClass="custom-range-popover" (onShow)="onCustomPopoverShow()">
    <ng-template #content>
      <div class="custom-popover-body">
        <p-selectbutton
          [options]="customModeOptions"
          [ngModel]="customMode()"
          (ngModelChange)="setCustomMode($event)"
          optionLabel="label"
          optionValue="value"
          [allowEmpty]="false"
          size="small"
          [fluid]="true"
        />

        @if (customMode() === 'last-x') {
          <div class="mode-body">
            <div class="field-row">
              <label class="popover-label" for="custom-last-hours">Hours</label>
              <p-inputnumber
                [ngModel]="customHours()"
                (ngModelChange)="customHours.set($event)"
                mode="decimal"
                [min]="0"
                [step]="1"
                inputId="custom-last-hours"
                placeholder="0"
              />
            </div>
            <div class="field-row">
              <label class="popover-label" for="custom-last-minutes">Minutes</label>
              <p-inputnumber
                [ngModel]="customMinutes()"
                (ngModelChange)="customMinutes.set($event)"
                mode="decimal"
                [min]="0"
                [step]="1"
                inputId="custom-last-minutes"
                placeholder="30"
              />
            </div>
            <p-button label="Apply" icon="pi pi-check" size="small" [fluid]="true" (onClick)="applyCustomLastX()" />
          </div>
        } @else {
          <div class="mode-body">
            <div class="field-row">
              <label class="popover-label" for="custom-range-from">From</label>
              <p-datepicker
                inputId="custom-range-from"
                [ngModel]="customFromDate()"
                (ngModelChange)="customFromDate.set($event)"
                [showTime]="true"
                [showSeconds]="true"
                [showIcon]="true"
                [maxDate]="maxDate()"
                appendTo="body"
                hourFormat="24"
                dateFormat="yy-mm-dd"
              />
            </div>
            <div class="field-row">
              <label class="popover-label" for="custom-range-to">To</label>
              <p-datepicker
                inputId="custom-range-to"
                [ngModel]="customToDate()"
                (ngModelChange)="customToDate.set($event)"
                [showTime]="true"
                [showSeconds]="true"
                [showIcon]="true"
                [maxDate]="maxDate()"
                appendTo="body"
                hourFormat="24"
                dateFormat="yy-mm-dd"
              />
            </div>
            <p-button label="Apply" icon="pi pi-check" size="small" [fluid]="true" (onClick)="applyCustomDateRange()" />
          </div>
        }
      </div>
    </ng-template>
  </p-popover>
</div>
