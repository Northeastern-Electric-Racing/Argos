<div class="general-buttons-row">
  <run-selector [selectRun]="onRunSelected()" />
  @if (historicalOn()) {
    <button nz-button nzSize="small" nzType="primary" (click)="onSetRealTime()()">Realtime</button>
  }
  <button nz-button nzSize="small" (click)="onClearDataType()()">Clear Graph</button>

  <div class="historical-section">
    <span class="historical-label">Historical:</span>
    <select-dropdown
      size="small"
      [options]="quickSelectConfig().options"
      [placeholder]="quickSelectConfig().placeholder"
      [defaultValue]="selectedPresetLabel()"
    />
    <div class="custom-stack">
      <button
        nz-button
        nzSize="small"
        [nzType]="customActive() ? 'primary' : 'default'"
        nz-popover
        nzPopoverTrigger="click"
        nzPopoverPlacement="bottom"
        nzPopoverOverlayClassName="custom-range-popover"
        [nzPopoverContent]="customRangeContent"
        [(nzPopoverVisible)]="customPopoverOpen"
        (nzPopoverVisibleChange)="$event && onCustomPopoverShow()"
      >
        Custom
      </button>
      @if (customActive() && customCaption()) {
        <span class="custom-caption">{{ customCaption() }}</span>
      }
    </div>
  </div>

  <ng-template #customRangeContent>
    <div class="custom-popover-body">
      <nz-segmented
        nzBlock
        nzSize="small"
        aria-label="Custom range type"
        [nzOptions]="customModeOptions"
        [ngModel]="customMode()"
        (ngModelChange)="setCustomMode($event)"
      />

      @if (customMode() === 'last-x') {
        <div class="mode-body">
          <div class="field-row">
            <label class="popover-label" for="custom-range-hours">Hours</label>
            <nz-input-number
              nzId="custom-range-hours"
              [ngModel]="customHours()"
              (ngModelChange)="customHours.set($event)"
              [nzMin]="0"
              [nzStep]="1"
              nzSize="small"
              nzPlaceHolder="0"
            />
          </div>
          <div class="field-row">
            <label class="popover-label" for="custom-range-minutes">Minutes</label>
            <nz-input-number
              nzId="custom-range-minutes"
              [ngModel]="customMinutes()"
              (ngModelChange)="customMinutes.set($event)"
              [nzMin]="0"
              [nzStep]="1"
              nzSize="small"
              nzPlaceHolder="30"
            />
          </div>
          <button nz-button nzType="primary" nzSize="small" nzBlock (click)="applyCustomLastX()">Apply</button>
        </div>
      } @else {
        <div class="mode-body">
          <div class="field-row">
            <label class="popover-label" for="custom-range-from">From</label>
            <nz-date-picker
              nzId="custom-range-from"
              [ngModel]="customFromDate()"
              (ngModelChange)="customFromDate.set($event)"
              nzShowTime
              nzFormat="yyyy-MM-dd HH:mm:ss"
              nzSize="small"
              [nzDisabledDate]="isAfterMaxDate"
            />
          </div>
          <div class="field-row">
            <label class="popover-label" for="custom-range-to">To</label>
            <nz-date-picker
              nzId="custom-range-to"
              [ngModel]="customToDate()"
              (ngModelChange)="customToDate.set($event)"
              nzShowTime
              nzFormat="yyyy-MM-dd HH:mm:ss"
              nzSize="small"
              [nzDisabledDate]="isAfterMaxDate"
            />
          </div>
          <button nz-button nzType="primary" nzSize="small" nzBlock (click)="applyCustomDateRange()">Apply</button>
        </div>
      }
    </div>
  </ng-template>
</div>
