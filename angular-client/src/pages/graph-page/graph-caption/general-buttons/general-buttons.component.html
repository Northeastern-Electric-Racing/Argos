<div class="general-buttons-row">
  <run-selector [selectRun]="onRunSelected()" />
  @if (historicalOn()) {
    <button matButton="filled" (click)="onSetRealTime()()">Realtime</button>
  }
  <button matButton="outlined" (click)="onClearDataType()()">Clear Graph</button>

  <div class="historical-section">
    <span class="historical-label">Historical:</span>
    <select-dropdown
      [options]="quickSelectConfig().options"
      [placeholder]="quickSelectConfig().placeholder"
      [defaultValue]="selectedPresetLabel()"
    />
    <div class="custom-stack" cdkOverlayOrigin #customOrigin="cdkOverlayOrigin">
      <button
        [matButton]="customActive() ? 'tonal' : 'outlined'"
        aria-haspopup="dialog"
        [attr.aria-expanded]="customPopoverOpen()"
        (click)="toggleCustomPopover()"
      >
        Custom
      </button>
      @if (customActive() && customCaption()) {
        <span class="custom-caption">{{ customCaption() }}</span>
      }
    </div>
  </div>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="customOrigin"
    [cdkConnectedOverlayOpen]="customPopoverOpen()"
    [cdkConnectedOverlayPositions]="popoverPositions"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (attach)="onCustomPopoverShow()"
    (backdropClick)="closeCustomPopover()"
    (detach)="closeCustomPopover()"
    (overlayKeydown)="onPopoverKeydown($event)"
  >
    <div class="custom-popover-body" role="dialog" aria-label="Custom range" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
      <mat-button-toggle-group
        class="mode-toggle"
        [value]="customMode()"
        (change)="setCustomMode($event.value)"
        aria-label="Custom range mode"
        hideSingleSelectionIndicator
      >
        <mat-button-toggle value="last-x">Last X</mat-button-toggle>
        <mat-button-toggle value="date-range">Date Range</mat-button-toggle>
      </mat-button-toggle-group>
      @if (customMode() === 'last-x') {
        <div class="mode-body">
          <mat-form-field subscriptSizing="dynamic">
            <mat-label>Hours</mat-label>
            <input
              matInput
              type="number"
              [ngModel]="customHours()"
              (ngModelChange)="customHours.set($event)"
              [min]="0"
              [step]="1"
              placeholder="0"
            />
          </mat-form-field>
          <mat-form-field subscriptSizing="dynamic">
            <mat-label>Minutes</mat-label>
            <input
              matInput
              type="number"
              [ngModel]="customMinutes()"
              (ngModelChange)="customMinutes.set($event)"
              [min]="0"
              [step]="1"
              placeholder="30"
            />
          </mat-form-field>
          <button matButton="filled" class="apply-button" (click)="applyCustomLastX()">Apply</button>
        </div>
      } @else {
        <div class="mode-body">
          <!-- One range calendar picks both days (and keeps end >= start); the time fields set the hours. -->
          <mat-form-field subscriptSizing="dynamic">
            <mat-label>Date range</mat-label>
            <mat-date-range-input [rangePicker]="rangePicker" [max]="maxDate()">
              <input
                matStartDate
                placeholder="From"
                aria-label="From date"
                [ngModel]="customFromDate()"
                (ngModelChange)="setFromDay($event)"
              />
              <input
                matEndDate
                placeholder="To"
                aria-label="To date"
                [ngModel]="customToDate()"
                (ngModelChange)="setToDay($event)"
              />
            </mat-date-range-input>
            <mat-datepicker-toggle matSuffix [for]="rangePicker" />
            <mat-date-range-picker #rangePicker />
          </mat-form-field>
          <div class="datetime-row">
            <mat-form-field subscriptSizing="dynamic" class="time-field">
              <mat-label>From time</mat-label>
              <input
                matInput
                [matTimepicker]="fromTimePicker"
                [ngModel]="customFromDate()"
                (ngModelChange)="setFromTime($event)"
              />
              <mat-timepicker-toggle matSuffix [for]="fromTimePicker" />
              <mat-timepicker #fromTimePicker interval="15m" />
            </mat-form-field>
            <mat-form-field subscriptSizing="dynamic" class="time-field">
              <mat-label>To time</mat-label>
              <input
                matInput
                [matTimepicker]="toTimePicker"
                [ngModel]="customToDate()"
                (ngModelChange)="setToTime($event)"
              />
              <mat-timepicker-toggle matSuffix [for]="toTimePicker" />
              <mat-timepicker #toTimePicker interval="15m" />
            </mat-form-field>
          </div>
          <button matButton="filled" class="apply-button" (click)="applyCustomDateRange()">Apply</button>
        </div>
      }
    </div>
  </ng-template>
</div>
