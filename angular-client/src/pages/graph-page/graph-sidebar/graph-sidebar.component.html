@if (isMobile) {
  <div>
    <graph-sidebar-mobile [dataTypes]="this.dataTypes()" [selectedDataTypes]="this.selectDataTypes()" />
  </div>
} @else {
  <graph-sidebar-desktop
    [dataTypes]="this.dataTypes()"
    [selectedDataTypes]="this.selectDataTypes()"
    [currentSelectedDataTypes]="this.currentSelectedDataTypes()"
  />
}
