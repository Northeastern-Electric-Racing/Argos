<div class="flex min-h-0 flex-col gap-2" [style.height]="height()">
  <div class="relative">
    <mat-icon
      [class]="icon.sm"
      class="pointer-events-none absolute top-1/2 left-2 -translate-y-1/2 text-fg-muted"
      aria-hidden="true"
      >search</mat-icon
    >
    <input
      type="search"
      uiInput
      class="w-full pl-8"
      [placeholder]="filterPlaceholder()"
      [attr.aria-label]="filterPlaceholder()"
      [value]="filter()"
      (input)="onFilterInput($event)"
    />
  </div>

  <ul
    ngTree
    #tree="ngTree"
    class="m-0 min-h-0 flex-1 list-none overflow-auto p-1 select-none"
    aria-label="Topics"
    [multi]="true"
    [value]="selectedKeys()"
    (valueChange)="onValueChange($event)"
  >
    <ng-template [ngTemplateOutlet]="treeNodes" [ngTemplateOutletContext]="{ nodes: visibleNodes(), parent: tree }" />
  </ul>
  @if (visibleNodes().length === 0) {
    <p class="m-0 text-center text-ctrl-sm text-fg-muted">No topics found</p>
  }
</div>

<ng-template #treeNodes let-nodes="nodes" let-parent="parent">
  @for (node of nodes; track node.key) {
    <li
      ngTreeItem
      #treeItem="ngTreeItem"
      [parent]="parent"
      [value]="node.key"
      [label]="node.label"
      [selectable]="!!node.selectable"
      [(expanded)]="node.expanded"
      class="group flex min-h-7.5 cursor-pointer list-none items-center gap-2 rounded-sm px-2 text-fg outline-none not-aria-selected:hover:bg-fg/7 focus-visible:focus-ring focus-visible:-outline-offset-2 aria-selected:bg-accent/33"
    >
      @if (node.children?.length) {
        <mat-icon
          [class]="icon.md"
          class="text-fg-muted transition-transform duration-150 group-aria-expanded:rotate-90"
          aria-hidden="true"
          >chevron_right</mat-icon
        >
      } @else {
        <!-- No checkbox (814 parity): the row's tint shows selection; this keeps leaf labels in line with their parents'. -->
        <span class="size-5 shrink-0" aria-hidden="true"></span>
      }
      <!-- The accent label on hover, except on a selected (red-tinted) row, where it would be red on red. -->
      <span class="min-w-0 flex-1 font-sans text-base font-bold group-hover:group-not-aria-selected:text-accent-fg">{{
        node.label
      }}</span>
      @if (!node.children?.length) {
        <span class="shrink-0 font-sans text-base text-fg">{{ node.data.displayValue() }}</span>
      }
    </li>

    @if (node.children?.length) {
      <ul role="group" class="m-0 list-none pl-4.5 [li[aria-expanded='false']+&]:hidden">
        <ng-template ngTreeItemGroup [ownedBy]="treeItem" #group="ngTreeItemGroup">
          <ng-template [ngTemplateOutlet]="treeNodes" [ngTemplateOutletContext]="{ nodes: node.children, parent: group }" />
        </ng-template>
      </ul>
    }
  }
</ng-template>
