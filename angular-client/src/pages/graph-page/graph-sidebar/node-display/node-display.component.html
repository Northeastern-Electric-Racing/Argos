<div [class]="isDesktop() ? '' : row">
  <sidebar-card
    [title]="node().name"
    (click)="onSelect(node())"
    [dropDown]="node().nodes.value.length > 0"
    [open]="node().subnodesVisible"
    [topicName]="node().topicName"
    [isDesktop]="isDesktop()"
  />
  @if (node().subnodesVisible) {
    <div
      [class]="isDesktop() ? '' : row"
      [animate.enter]="isDesktop() ? expandDownEnter : expandAcrossEnter"
      [animate.leave]="isDesktop() ? expandDownLeave : expandAcrossLeave"
    >
      @for (subNode of node().nodes | async | nodeFilter: 'name' : searchFilter(); track subNode) {
        <div [class]="isDesktop() ? centred : row">
          <node-display
            [class]="isDesktop() ? indented : ''"
            [node]="subNode"
            [searchFilter]="searchFilter()"
            [isDesktop]="isDesktop()"
          />
        </div>
      }
    </div>
  }
</div>
