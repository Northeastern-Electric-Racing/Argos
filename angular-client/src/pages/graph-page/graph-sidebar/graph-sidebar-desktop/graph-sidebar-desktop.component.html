<div class="background">
  <div class="presets-row">
    <select-dropdown
      class="preset-select"
      [options]="presetSelectorConfig().options"
      [placeholder]="presetSelectorConfig().placeholder"
      [defaultValue]="activePresetName()"
    />
    <argos-button
      [onClick]="openPresetsDialog"
      label="Manage Presets"
      size="sm"
      additionalStyles="background-color: #323232; border: 1.4px solid #027bd7;"
    />
  </div>
  <div class="header-row">
    <argos-button
      [onClick]="clearSelections"
      label="Clear Topics"
      size="sm"
      additionalStyles="background-color: #323232; border: 1.4px solid #027bd7;"
    />
    <div class="toggle-group">
      <label class="flatten-toggle">
        <typography content="Selected" variant="sidebar-label" additionalStyles="padding: 0px;" />
        <p-toggleswitch
          [ngModel]="selectedOnly()"
          (ngModelChange)="toggleSelectedOnly($event)"
          ariaLabel="Show only selected topics"
        />
      </label>
      <label class="flatten-toggle">
        <typography content="Flat" variant="sidebar-label" additionalStyles="padding: 0px;" />
        <p-toggleswitch
          [ngModel]="flattenMode()"
          (ngModelChange)="toggleFlattenMode($event)"
          ariaLabel="Flatten topic tree"
        />
      </label>
    </div>
  </div>
  <p-tree
    [value]="activeNodes()"
    (onNodeSelect)="nodeSelect($event)"
    (onNodeUnselect)="onNodeUnselect($event)"
    [(selection)]="selectedNodes"
    [filter]="true"
    filterPlaceholder="Select Data Type"
    ariaLabel="Data types"
    [autofocus]="true"
    [style]="{ height: '80vh', overflow: 'auto' }"
    [metaKeySelection]="false"
    selectionMode="multiple"
  >
    <!-- PrimeNG 21 Tree reads node templates only from pTemplate, not #node: keep this on the fork -->
    <ng-template let-node pTemplate="default">
      <div class="tree-node-container" (click)="onRowClick($event, node)">
        <typography additionalStyles="padding: 0px;" [content]="node.label" variant="sidebar-label" />
        @if (node.children?.length === 0) {
          <typography [content]="node.data.displayValue()" variant="subheader" />
        }
      </div>
    </ng-template>
  </p-tree>
</div>
