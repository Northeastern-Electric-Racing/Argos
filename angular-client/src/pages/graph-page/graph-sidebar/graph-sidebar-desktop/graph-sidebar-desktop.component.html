<div class="background">
  <p-tree
    [value]="treeNodes"
    styleClass="w-full md:w-[30rem]"
    selectionMode="single"
    (onNodeSelect)="nodeSelect()"
    [(selection)]="selectedNode"
    [filter]="true"
    filterPlaceholder="Select Data Type"
    styleClass="w-full"
    [autofocus]="true"
    [style]="{ height: '80vh', overflow: 'auto' }"
  />
</div>
