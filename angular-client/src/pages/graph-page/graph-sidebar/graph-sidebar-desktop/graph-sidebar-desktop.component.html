<div class="mt-2.5 flex max-h-[80vh] w-[28vw] flex-col gap-2">
  <div class="flex items-center justify-start gap-1.5">
    <select-dropdown
      class="max-w-full min-w-0 flex-[0_1_auto]"
      [options]="presetSelectorConfig().options"
      [placeholder]="presetSelectorConfig().placeholder"
      [defaultValue]="activePresetName()"
    />
    <argos-button class="shrink-0" [onClick]="openPresetsDialog" label="Manage Presets" size="sm" variant="tonal" />
  </div>
  <div class="flex flex-wrap items-center justify-start gap-4">
    <argos-button [onClick]="clearSelections" label="Clear Topics" size="sm" variant="tonal" />
    <div class="inline-flex items-center gap-4">
      <label class="inline-flex cursor-pointer items-center gap-2">
        <span class="font-sans text-base font-bold text-fg select-none">Selected</span>
        <ui-switch
          [checked]="selectedOnly()"
          (checkedChange)="toggleSelectedOnly($event)"
          ariaLabel="Show only selected topics"
        />
      </label>
      <label class="inline-flex cursor-pointer items-center gap-2">
        <span class="font-sans text-base font-bold text-fg select-none">Flat</span>
        <ui-switch [checked]="flattenMode()" (checkedChange)="toggleFlattenMode($event)" ariaLabel="Flatten topic tree" />
      </label>
    </div>
  </div>
  <topic-tree
    [nodes]="activeNodes()"
    [selectedKeys]="selectedKeys()"
    (nodeSelect)="nodeSelect($event)"
    (nodeUnselect)="onNodeUnselect($event)"
    filterPlaceholder="Select Data Type"
    height="80vh"
  />
</div>
