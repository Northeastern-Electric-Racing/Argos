<div
  class="relative m-2 mb-0 h-5 w-full cursor-pointer rounded-sm bg-page pr-2.5 text-center text-fg transition-colors duration-300 hover:bg-surface-3 [&.selected]:bg-surface-3-hover"
  [id]="title()"
  (click)="selectCard()"
>
  @if (dropDown()) {
    <mat-icon
      [id]="iconId()"
      [class]="icon.lg"
      class="absolute inset-y-0 left-1.25 my-auto transition-transform duration-300"
      [class.rotate-90]="open()"
      svgIcon="arrow_right"
      >arrow_right</mat-icon
    >
  }
  <div class="flex h-full items-center justify-between">
    <span class="font-sans text-base" [class]="dropDown() ? titleWithIcon : titleCentred">{{ title() }}</span>
    <span class="mr-1.25 font-sans text-lg font-bold text-fg-muted">{{ dataValue() }}</span>
  </div>
</div>
