<button tuiButton type="button" appearance="primary" iconStart="@tui.list-tree" class="toggle-btn" (click)="toggleSidebar()">
  Select Topics
</button>

<tui-drawer *tuiPopup="sidebarVisible" direction="end" class="topics-drawer" [overlay]="true" (tuiClose)="closeSidebar()">
  <header>
    <div tuiHeader="h6">
      <div tuiTitle>Topics</div>
      <div tuiAccessories>
        <button
          appearance="icon"
          iconStart="@tui.x"
          size="s"
          tuiAutoFocus
          tuiIconButton
          type="button"
          (click)="closeSidebar()"
        >
          Close topics
        </button>
      </div>
    </div>
  </header>
  <div class="sidebar-content">
    <div class="presets-row">
      <select-dropdown
        class="preset-select"
        [options]="presetSelectorConfig().options"
        [placeholder]="presetSelectorConfig().placeholder"
        [defaultValue]="activePresetName()"
      />
      <button tuiButton type="button" size="s" appearance="secondary-grayscale" (click)="openPresetsDialog()">Manage</button>
    </div>
    <button
      tuiButton
      type="button"
      size="s"
      appearance="secondary-grayscale"
      iconStart="@tui.eraser"
      (click)="clearSelections()"
    >
      Clear Topics
    </button>
    <div class="toggle-group">
      <label class="flatten-toggle">
        <typography content="Selected" variant="sidebar-label" additionalStyles="padding: 0px;" />
        <input
          tuiSwitch
          type="checkbox"
          size="s"
          aria-label="Show only selected topics"
          [showIcons]="false"
          [ngModel]="selectedOnly()"
          (ngModelChange)="toggleSelectedOnly($event)"
        />
      </label>
      <label class="flatten-toggle">
        <typography content="Flat" variant="sidebar-label" additionalStyles="padding: 0px;" />
        <input
          tuiSwitch
          type="checkbox"
          size="s"
          aria-label="Flatten topic tree"
          [showIcons]="false"
          [ngModel]="flattenMode()"
          (ngModelChange)="toggleFlattenMode($event)"
        />
      </label>
    </div>
    <topic-tree
      class="tree"
      [nodes]="activeNodes()"
      [selection]="selectedNodes()"
      (nodeSelect)="nodeSelect($event)"
      (nodeUnselect)="onNodeUnselect($event)"
    />
  </div>
</tui-drawer>
