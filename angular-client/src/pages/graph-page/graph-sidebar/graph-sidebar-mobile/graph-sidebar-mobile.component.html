<button type="button" class="toggle-btn" (click)="toggleSidebar()">Select Topics</button>

<tui-drawer *tuiPopup="sidebarVisible" direction="end" class="topics-drawer" [overlay]="true">
  <header class="drawer-header">
    <typography style="width: 100%; text-align: center" variant="large-header" content="Topics" />
    <button appearance="flat-grayscale" iconStart="@tui.x" size="s" tuiIconButton type="button" (click)="toggleSidebar()">
      Close topics
    </button>
  </header>
  <div class="sidebar-content">
    <div class="presets-row">
      <select-dropdown
        class="preset-select"
        [options]="presetSelectorConfig().options"
        [placeholder]="presetSelectorConfig().placeholder"
        [defaultValue]="activePresetName()"
      />
      <argos-button
        [onClick]="openPresetsDialog"
        label="Manage"
        size="sm"
        additionalStyles="background-color: #323232; border: 1.4px solid #027bd7;"
      />
    </div>
    <argos-button
      [onClick]="clearSelections"
      label="Clear Topics"
      size="sm"
      additionalStyles="background-color: #323232; border: 1.4px solid #027bd7; width: 100%;"
    />
    <div class="toggle-group">
      <label class="flatten-toggle">
        <typography content="Selected" variant="sidebar-label" additionalStyles="padding: 0px;" />
        <input
          tuiSwitch
          type="checkbox"
          size="s"
          aria-label="Show only selected topics"
          [showIcons]="false"
          [ngModel]="selectedOnly()"
          (ngModelChange)="toggleSelectedOnly($event)"
        />
      </label>
      <label class="flatten-toggle">
        <typography content="Flat" variant="sidebar-label" additionalStyles="padding: 0px;" />
        <input
          tuiSwitch
          type="checkbox"
          size="s"
          aria-label="Flatten topic tree"
          [showIcons]="false"
          [ngModel]="flattenMode()"
          (ngModelChange)="toggleFlattenMode($event)"
        />
      </label>
    </div>
    <topic-tree
      class="tree"
      [nodes]="activeNodes()"
      [selection]="selectedNodes()"
      (nodeSelect)="nodeSelect($event)"
      (nodeUnselect)="onNodeUnselect($event)"
    />
  </div>
</tui-drawer>
