<button hlmBtn size="lg" type="button" class="toggle-btn" aria-haspopup="dialog" (click)="toggleSidebar()">
  <ng-icon name="lucideListTree" />
  Select Topics
</button>

<hlm-sheet side="right" [state]="sidebarVisible ? 'open' : 'closed'" (stateChanged)="sidebarVisible = $event === 'open'">
  <hlm-sheet-content *hlmSheetPortal="let ctx" class="w-[85vw] sm:max-w-none">
    <hlm-sheet-header>
      <h2 hlmSheetTitle class="text-center">
        <typography variant="large-header" content="Topics" />
      </h2>
    </hlm-sheet-header>
    <div class="sidebar-content px-4 pb-4">
      <div class="presets-row">
        <select-dropdown
          class="preset-select"
          [options]="presetSelectorConfig().options"
          [placeholder]="presetSelectorConfig().placeholder"
          [defaultValue]="activePresetName()"
        />
        <button hlmBtn variant="outline" size="sm" type="button" aria-haspopup="dialog" (click)="openPresetsDialog()">
          <ng-icon name="lucideBookmark" />
          Manage
        </button>
      </div>
      <button hlmBtn variant="outline" size="sm" type="button" class="w-full" (click)="clearSelections()">
        <ng-icon name="lucideEraser" />
        Clear Topics
      </button>
      <div class="toggle-group">
        <label hlmLabel class="flatten-toggle">
          Selected
          <hlm-switch
            [checked]="selectedOnly()"
            (checkedChange)="toggleSelectedOnly($event)"
            [inputId]="switchId + '-selected'"
            aria-label="Show only selected topics"
          />
        </label>
        <label hlmLabel class="flatten-toggle">
          Flat
          <hlm-switch
            [checked]="flattenMode()"
            (checkedChange)="toggleFlattenMode($event)"
            [inputId]="switchId + '-flat'"
            aria-label="Flatten topic tree"
          />
        </label>
      </div>
      <topic-tree
        [nodes]="activeNodes()"
        [(selection)]="selectedNodes"
        (nodeSelect)="nodeSelect($event)"
        (nodeUnselect)="onNodeUnselect($event)"
        filterPlaceholder="Search topics..."
        height="calc(100vh - 220px)"
      />
    </div>
  </hlm-sheet-content>
</hlm-sheet>
