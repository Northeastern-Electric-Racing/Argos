<button matFab extended class="toggle-btn" [attr.aria-expanded]="sidebarVisible" (click)="toggleSidebar()">
  <mat-icon>checklist</mat-icon>Select Topics
</button>

<mat-sidenav-container class="topics-drawer" [class.topics-drawer--open]="sidebarVisible" [hasBackdrop]="true">
  <mat-sidenav
    mode="over"
    position="end"
    class="topics-sidenav"
    [(opened)]="sidebarVisible"
    role="region"
    aria-label="Topics"
  >
    <div class="sidebar-content dense-actions">
      <typography style="width: 100%; text-align: center" variant="large-header" content="Topics" />
      <div class="presets-row">
        <select-dropdown
          class="preset-select"
          [options]="presetSelectorConfig().options"
          [placeholder]="presetSelectorConfig().placeholder"
          [defaultValue]="activePresetName()"
        />
        <button matButton="outlined" (click)="openPresetsDialog()">Manage</button>
      </div>
      <button matButton="outlined" (click)="clearSelections()">Clear Topics</button>
      <div class="toggle-group">
        <mat-slide-toggle
          class="flatten-toggle"
          [checked]="selectedOnly()"
          (change)="toggleSelectedOnly($event.checked)"
          aria-label="Show only selected topics"
        >
          Selected
        </mat-slide-toggle>
        <mat-slide-toggle
          class="flatten-toggle"
          [checked]="flattenMode()"
          (change)="toggleFlattenMode($event.checked)"
          aria-label="Flatten topic tree"
        >
          Flat
        </mat-slide-toggle>
      </div>
      <topic-tree
        [nodes]="activeNodes()"
        [selectedNames]="selectedNames()"
        filterPlaceholder="Search topics..."
        height="calc(100vh - 220px)"
        (nodeSelect)="nodeSelect($event)"
        (nodeUnselect)="onNodeUnselect($event)"
      />
    </div>
  </mat-sidenav>
</mat-sidenav-container>
