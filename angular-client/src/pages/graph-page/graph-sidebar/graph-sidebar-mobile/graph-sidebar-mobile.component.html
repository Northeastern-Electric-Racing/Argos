<button class="toggle-btn" (click)="toggleSidebar()">Select Topics</button>

<hlm-sheet side="right" [state]="sidebarVisible ? 'open' : 'closed'" (stateChanged)="sidebarVisible = $event === 'open'">
  <hlm-sheet-content *hlmSheetPortal="let ctx" class="w-[85vw] sm:max-w-none">
    <hlm-sheet-header>
      <h2 hlmSheetTitle class="text-center">
        <typography variant="large-header" content="Topics" />
      </h2>
    </hlm-sheet-header>
    <div class="sidebar-content">
      <div class="presets-row">
        <select-dropdown
          class="preset-select"
          [options]="presetSelectorConfig().options"
          [placeholder]="presetSelectorConfig().placeholder"
          [defaultValue]="activePresetName()"
        />
        <argos-button
          [onClick]="openPresetsDialog"
          label="Manage"
          size="sm"
          additionalStyles="background-color: #323232; border: 1.4px solid #027bd7;"
        />
      </div>
      <argos-button
        [onClick]="clearSelections"
        label="Clear Topics"
        size="sm"
        additionalStyles="background-color: #323232; border: 1.4px solid #027bd7; width: 100%;"
      />
      <div class="toggle-group">
        <label class="flatten-toggle">
          <typography content="Selected" variant="sidebar-label" additionalStyles="padding: 0px;" />
          <hlm-switch
            [checked]="selectedOnly()"
            (checkedChange)="toggleSelectedOnly($event)"
            aria-label="Show only selected topics"
          />
        </label>
        <label class="flatten-toggle">
          <typography content="Flat" variant="sidebar-label" additionalStyles="padding: 0px;" />
          <hlm-switch
            [checked]="flattenMode()"
            (checkedChange)="toggleFlattenMode($event)"
            aria-label="Flatten topic tree"
          />
        </label>
      </div>
      <topic-tree
        [nodes]="activeNodes()"
        [(selection)]="selectedNodes"
        (nodeSelect)="nodeSelect($event)"
        (nodeUnselect)="onNodeUnselect($event)"
        filterPlaceholder="Search topics..."
        height="calc(100vh - 220px)"
      />
    </div>
  </hlm-sheet-content>
</hlm-sheet>
