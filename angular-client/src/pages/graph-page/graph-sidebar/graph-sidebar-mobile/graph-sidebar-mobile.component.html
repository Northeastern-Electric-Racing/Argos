<button class="toggle-btn" (click)="toggleSidebar()">Select Topics</button>

<mat-sidenav-container class="topics-drawer" [class.topics-drawer--open]="sidebarVisible" [hasBackdrop]="true">
  <mat-sidenav mode="over" position="end" class="topics-sidenav" [(opened)]="sidebarVisible" aria-label="Topics">
    <div class="sidebar-content">
      <typography style="width: 100%; text-align: center" variant="large-header" content="Topics" />
      <div class="presets-row">
        <select-dropdown
          class="preset-select"
          [options]="presetSelectorConfig().options"
          [placeholder]="presetSelectorConfig().placeholder"
          [defaultValue]="activePresetName()"
        />
        <argos-button
          [onClick]="openPresetsDialog"
          label="Manage"
          size="sm"
          additionalStyles="background-color: #323232; border: 1.4px solid #027bd7;"
        />
      </div>
      <argos-button
        [onClick]="clearSelections"
        label="Clear Topics"
        size="sm"
        additionalStyles="background-color: #323232; border: 1.4px solid #027bd7; width: 100%;"
      />
      <div class="toggle-group">
        <mat-slide-toggle
          class="flatten-toggle"
          [checked]="selectedOnly()"
          (change)="toggleSelectedOnly($event.checked)"
          aria-label="Show only selected topics"
        >
          Selected
        </mat-slide-toggle>
        <mat-slide-toggle
          class="flatten-toggle"
          [checked]="flattenMode()"
          (change)="toggleFlattenMode($event.checked)"
          aria-label="Flatten topic tree"
        >
          Flat
        </mat-slide-toggle>
      </div>
      <topic-tree
        [nodes]="activeNodes()"
        [selectedNames]="selectedNames()"
        filterPlaceholder="Search topics..."
        height="calc(100vh - 220px)"
        (nodeSelect)="nodeSelect($event)"
        (nodeUnselect)="onNodeUnselect($event)"
      />
    </div>
  </mat-sidenav>
</mat-sidenav-container>
