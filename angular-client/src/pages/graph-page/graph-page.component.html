@if (dataTypesIsError) {
  <div>
    <error-page [errorMessage]="dataTypesError!.message" />
  </div>
} @else {
  @if (!dataTypes || dataTypesIsLoading) {
    <div>
      <loading-page />
    </div>
  } @else {
    <div class="container">
      <hstack alignItems="start" justifyContent="space-between" style="align-self: flex-start; width: 100%" spacing="0px">
        <hstack spacing="0px">
          <argos-button
            [onClick]="this.toggleSideBar"
            label="Toggle Sidebar"
            additionalStyles="background-color: #0c2026; border: 1.4px solid #8fcadd;"
          />
          <argos-button
            [onClick]="this.toggleMultiYaxis"
            label="Toggle Mult Yaxis"
            additionalStyles="background-color: #0c2026; border: 1.4px solid #8fcadd; width: 160px;"
          />
          @if (realTime === true) {
            <argos-button
              [onClick]="this.togglePause"
              [label]="isPaused ? 'Play' : 'Pause'"
              additionalStyles="background-color: #0c2026; border: 1.4px solid #8fcadd; width: 80px;"
            />
          }

          @if (onFaultPage) {
            <fault-buttons [onClearData]="clearDataType" />
          } @else {
            <general-buttons
              [onRunSelected]="onRunSelected"
              [onClearDataType]="clearDataType"
              [onSetRealTime]="onSetRealtime"
              [historicalOn]="this.run !== undefined || this.minutesToQuery !== undefined"
              [selectorConfig]="this.queryMinutesConfig"
            />
          }
        </hstack>

        <typography
          variant="large-header"
          additionalStyles="margin-top: 5px; margin-bottom: 0px; padding-right: 15px;"
          [content]="this.rightHeader"
        />
      </hstack>

      <div class="content-div">
        @if (this.showSideBar) {
          <graph-sidebar
            [dataTypes]="dataTypes"
            [selectDataTypes]="this.setSelectedDataTypes"
            [currentSelectedDataTypes]="this.selectedDataTypes"
            class="desktop-sidebar"
          />
        }
        <div class="right-container">
          <graph
            [limitRange]="realTime === true"
            [realTime]="this.realTime === true"
            [valuesSubject]="selectedDataTypeValuesSubject"
            class="graph"
            [showMultipleYAxes]="this.showMultiYaxis"
            [isPaused]="this.isPaused"
            [clearGraph]="this.clearGraph"
          />
        </div>
        <graph-sidebar
          [dataTypes]="dataTypes!"
          [selectDataTypes]="this.setSelectedDataTypes"
          [currentSelectedDataTypes]="this.selectedDataTypes"
          class="mobile-sidebar"
        />
      </div>
    </div>
  }
}
