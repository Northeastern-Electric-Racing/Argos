@if (dataTypesIsError) {
  <div>
    <error-page [errorMessage]="dataTypesError!.message" />
  </div>
} @else {
  @if (!dataTypes || dataTypesIsLoading) {
    <div>
      <loading-page />
    </div>
  } @else {
    <div class="graph-container">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="toolbar-group">
            <button
              hlmToggle
              variant="outline"
              size="sm"
              class="max-md:hidden"
              aria-label="Sidebar"
              hlmTooltip="Show topic sidebar"
              [state]="showSideBar ? 'on' : 'off'"
              (stateChange)="toggleSideBar()"
            >
              <ng-icon name="lucidePanelLeft" />
            </button>
            <button
              hlmToggle
              variant="outline"
              size="sm"
              aria-label="Multiple Y axes"
              hlmTooltip="One Y axis per topic"
              [state]="showMultiYaxis ? 'on' : 'off'"
              (stateChange)="toggleMultiYaxis()"
            >
              <ng-icon name="lucideChartLine" />
            </button>
            @if (realTime === true) {
              <button
                hlmBtn
                variant="outline"
                size="icon-sm"
                type="button"
                [attr.aria-label]="isPaused ? 'Play' : 'Pause'"
                [hlmTooltip]="isPaused ? 'Resume live data' : 'Pause live data'"
                (click)="togglePause()"
              >
                <ng-icon [name]="isPaused ? 'lucidePlay' : 'lucidePause'" />
              </button>
            }
          </div>

          <!-- Graph Configuration Inputs -->
          @if (this.realTime === true) {
            <div class="toolbar-group config-group">
              <button hlmBtn variant="outline" size="sm" type="button" (click)="toggleRangeMode()">
                <ng-icon name="lucideArrowLeftRight" />
                {{ rangeMode === 'time' ? 'Time Range' : 'Point Range' }}
              </button>
              <label hlmLabel class="input-label" for="graph-x-range">{{
                rangeMode === 'time' ? 'X (sec):' : 'X (points):'
              }}</label>
              <input
                hlmInput
                id="graph-x-range"
                type="number"
                class="h-8 w-[70px] text-xs md:text-xs md:w-20"
                [ngModel]="rangeValue"
                (ngModelChange)="rangeValue = $event; onGraphConfigChange()"
                min="1"
                step="1"
                [placeholder]="rangeMode === 'time' ? '30' : 'Auto'"
                [attr.aria-label]="rangeMode === 'time' ? 'X range in seconds' : 'X range in points'"
              />
            </div>
          }

          <div class="toolbar-group config-group">
            <label hlmLabel class="input-label" for="graph-y-min">Y Min:</label>
            <input
              hlmInput
              id="graph-y-min"
              type="number"
              class="h-8 w-[55px] px-1.5 text-xs md:text-xs md:w-[60px]"
              [ngModel]="yAxisMin"
              (ngModelChange)="yAxisMin = $event; onGraphConfigChange()"
              step="any"
              placeholder="Auto"
              aria-label="Y axis minimum"
            />

            <label hlmLabel class="input-label" for="graph-y-max">Y Max:</label>
            <input
              hlmInput
              id="graph-y-max"
              type="number"
              class="h-8 w-[55px] px-1.5 text-xs md:text-xs md:w-[60px]"
              [ngModel]="yAxisMax"
              (ngModelChange)="yAxisMax = $event; onGraphConfigChange()"
              step="any"
              placeholder="Auto"
              aria-label="Y axis maximum"
            />
          </div>

          <div class="toolbar-group">
            @if (onFaultPage) {
              <fault-buttons [onClearData]="clearDataType" />
            } @else {
              <general-buttons
                [onRunSelected]="onRunSelected"
                [onClearDataType]="clearDataType"
                [onSetRealTime]="onSetRealtime"
                [historicalOn]="this.run !== undefined || this.historicalRangeActive()"
                [presets]="rangePresets"
                [selectedPresetMinutes]="selectedPresetMinutes()"
                [customActive]="customRangeActive()"
                [customCaption]="customRangeCaption()"
                [activeLastXMinutes]="customLastXMinutes()"
                [activeDateRange]="customDateRange()"
                [onSelectPreset]="onSelectPreset"
                [onApplyCustomLastX]="onApplyCustomLastX"
                [onApplyCustomDateRange]="onApplyCustomDateRange"
              />
            }
          </div>
        </div>

        <typography
          variant="large-header"
          class="toolbar-header"
          [content]="this.rightHeader"
          additionalStyles="margin: 0; font-size: 1.5rem;"
        />
      </div>

      @if (selectedDataTypes.length > 0) {
        <live-value-strip [dataTypes]="selectedDataTypes" class="mobile-value-strip" />
      }

      <div class="content-div">
        @if (this.showSideBar) {
          <graph-sidebar [dataTypes]="dataTypes" class="desktop-sidebar" />
        }
        <div class="right-container">
          <graph
            [limitRange]="realTime === true"
            [realTime]="this.realTime === true"
            [valuesSubject]="selectedDataTypeValuesSubject"
            class="graph"
            [showMultipleYAxes]="this.showMultiYaxis"
            [isPaused]="this.isPaused"
            [clearGraph]="this.clearGraph"
            [graphConfig]="this.graphConfig"
          />
        </div>
        <graph-sidebar [dataTypes]="dataTypes!" class="mobile-sidebar" />
      </div>
    </div>
  }
}
