@if (dataTypesIsError) {
  <div>
    <error-page [errorMessage]="dataTypesError!.message" />
  </div>
} @else {
  @if (!dataTypes || dataTypesIsLoading) {
    <div>
      <loading-page />
    </div>
  } @else {
    <div class="container">
      <graph-header class="graph-header" [rightHeader]="rightHeader" />
      <hstack alignItems="start" style="align-self: flex-start" spacing="0px">
        <argos-button
          [onClick]="this.toggleSideBar"
          label="Toggle Sidebar"
          additionalStyles="background-color: #0c2026; border: 1.4px solid #8fcadd;"
        />
        @if (onFaultPage) {
          <fault-buttons [onClearData]="clearDataType" />
        } @else {
          <general-buttons
            [onRunSelected]="onRunSelected"
            [onClearDataType]="clearDataType"
            [onSetRealTime]="onSetRealtime"
            [historicalOn]="this.run !== undefined || this.minutesToQuery !== undefined"
            [selectorConfig]="this.queryMinutesConfig"
          />
        }
      </hstack>

      <div class="content-div">
        @if (this.showSideBar) {
          <graph-sidebar [dataTypes]="dataTypes" [selectDataTypes]="this.setSelectedDataTypes" class="desktop-sidebar" />
        }
        <div class="right-container">
          <graph [limitRange]="realTime === true" [valuesSubject]="selectedDataTypeValuesSubject" class="graph" />
        </div>
        <graph-sidebar [dataTypes]="dataTypes!" [selectDataTypes]="this.setSelectedDataTypes" class="mobile-sidebar" />
      </div>
    </div>
  }
}
