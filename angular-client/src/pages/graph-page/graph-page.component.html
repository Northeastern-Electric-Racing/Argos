@if (dataTypesIsError) {
  <div>
    <error-page [errorMessage]="dataTypesError!.message" />
  </div>
} @else {
  @if (!dataTypes || dataTypesIsLoading) {
    <div>
      <loading-page />
    </div>
  } @else {
    <div class="flex h-full flex-col">
      <div
        class="flex w-full items-center justify-between self-start max-md:flex-col max-md:items-stretch max-md:gap-1.5 max-md:px-2 max-md:py-1"
      >
        <div class="flex flex-wrap items-center gap-1 max-md:flex-col max-md:items-stretch max-md:gap-1.5">
          <div class="flex items-center gap-1.25 max-md:flex-wrap max-md:gap-1.5">
            <argos-button
              [onClick]="this.toggleSideBar"
              label="Tog Sidebar"
              size="sm"
              variant="tonal"
              [ariaPressed]="showSideBar"
            />
            <argos-button
              [onClick]="this.toggleMultiYaxis"
              label="Tog Mult Yaxis"
              size="sm"
              variant="tonal"
              [ariaPressed]="showMultiYaxis"
            />
            @if (realTime === true) {
              <argos-button [onClick]="this.togglePause" [label]="isPaused ? 'Play' : 'Pause'" size="sm" variant="tonal" />
            }
          </div>

          <!-- Graph Configuration Inputs -->
          @if (this.realTime === true) {
            <div class="ml-3.75 flex items-center gap-1.25 max-md:ml-0 max-md:flex-wrap max-md:gap-1.5">
              <argos-button
                [onClick]="this.toggleRangeMode"
                [label]="rangeMode === 'time' ? 'Time Range' : 'Point Range'"
                size="sm"
                variant="tonal"
              />
              <label class="text-xs whitespace-nowrap text-fg" for="graph-range-value">{{
                rangeMode === 'time' ? 'X (sec):' : 'X (points):'
              }}</label>
              <input
                id="graph-range-value"
                type="number"
                uiInput="sm"
                [class]="rangeInputClass"
                [(ngModel)]="rangeValue"
                min="1"
                step="1"
                [placeholder]="rangeMode === 'time' ? '30' : 'Auto'"
                (ngModelChange)="onGraphConfigChange()"
              />
            </div>
          }

          <div class="ml-3.75 flex items-center gap-1.25 max-md:ml-0 max-md:flex-wrap max-md:gap-1.5">
            <label class="text-xs whitespace-nowrap text-fg" for="graph-y-min">Y Min:</label>
            <input
              id="graph-y-min"
              type="number"
              uiInput="sm"
              [class]="yAxisInputClass"
              [(ngModel)]="yAxisMin"
              step="any"
              placeholder="Auto"
              (ngModelChange)="onGraphConfigChange()"
            />

            <label class="text-xs whitespace-nowrap text-fg" for="graph-y-max">Y Max:</label>
            <input
              id="graph-y-max"
              type="number"
              uiInput="sm"
              [class]="yAxisInputClass"
              [(ngModel)]="yAxisMax"
              step="any"
              placeholder="Auto"
              (ngModelChange)="onGraphConfigChange()"
            />
          </div>

          <div class="flex items-center gap-1.25 max-md:flex-wrap max-md:gap-1.5">
            @if (onFaultPage) {
              <fault-buttons [onClearData]="clearDataType" />
            } @else {
              <general-buttons
                [onRunSelected]="onRunSelected"
                [onClearDataType]="clearDataType"
                [onSetRealTime]="onSetRealtime"
                [historicalOn]="this.run !== undefined || this.historicalRangeActive()"
                [presets]="rangePresets"
                [selectedPresetMinutes]="selectedPresetMinutes()"
                [customActive]="customRangeActive()"
                [customCaption]="customRangeCaption()"
                [activeLastXMinutes]="customLastXMinutes()"
                [activeDateRange]="customDateRange()"
                [onSelectPreset]="onSelectPreset"
                [onApplyCustomLastX]="onApplyCustomLastX"
                [onApplyCustomDateRange]="onApplyCustomDateRange"
              />
            }
          </div>
        </div>

        <p
          class="m-0 shrink-0 pr-3.75 font-sans text-title font-bold text-fg select-none max-md:mt-0.5 max-md:pr-0 max-md:text-center"
        >
          {{ this.rightHeader }}
        </p>
      </div>

      @if (selectedDataTypes.length > 0) {
        <live-value-strip [dataTypes]="selectedDataTypes" class="hidden max-md:block" />
      }

      <!-- min-h-0: a flex item held at the canvas's height never gives Chart.js a smaller box, and the x-axis and
           legend end up below the fold -->
      <div class="flex min-h-0 w-full flex-auto flex-row max-md:flex-col">
        @if (this.showSideBar) {
          <graph-sidebar [dataTypes]="dataTypes" class="flex-[0_1_auto] max-md:hidden" />
        }
        <div
          class="flex min-h-0 flex-auto flex-col overflow-hidden pr-4 pb-10 max-md:h-[50vh] max-md:min-h-62.5 max-md:px-2"
        >
          <graph
            [realTime]="this.realTime === true"
            [valuesSubject]="selectedDataTypeValuesSubject"
            class="flex-auto"
            [showMultipleYAxes]="this.showMultiYaxis"
            [isPaused]="this.isPaused"
            [clearGraph]="this.clearGraph"
            [graphConfig]="this.graphConfig"
          />
        </div>
        <graph-sidebar [dataTypes]="dataTypes!" class="hidden max-md:block" />
      </div>
    </div>
  }
}
