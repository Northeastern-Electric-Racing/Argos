@if (dataTypesIsError) {
  <div>
    <error-page [errorMessage]="dataTypesError!.message" />
  </div>
} @else {
  @if (!dataTypes || dataTypesIsLoading) {
    <div>
      <loading-page />
    </div>
  } @else {
    <div class="graph-container">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="toolbar-group">
            <argos-button
              [onClick]="this.toggleSideBar"
              label="Tog Sidebar"
              size="sm"
              additionalStyles="background-color: #0c2026; border: 1.4px solid #8fcadd;"
            />
            <argos-button
              [onClick]="this.toggleMultiYaxis"
              label="Tog Mult Yaxis"
              size="sm"
              additionalStyles="background-color: #0c2026; border: 1.4px solid #8fcadd;"
            />
            @if (realTime === true) {
              <argos-button
                [onClick]="this.togglePause"
                [label]="isPaused ? 'Play' : 'Pause'"
                size="sm"
                additionalStyles="background-color: #0c2026; border: 1.4px solid #8fcadd;"
              />
            }
          </div>

          <!-- Graph Configuration Inputs -->
          @if (this.realTime === true) {
            <div class="toolbar-group config-group">
              <argos-button
                [onClick]="this.toggleRangeMode"
                [label]="rangeMode === 'time' ? 'Time Range' : 'Point Range'"
                size="sm"
                additionalStyles="background-color: #0c2026; border: 1.4px solid #8fcadd;"
              />
              <label class="input-label">{{ rangeMode === 'time' ? 'X (sec):' : 'X (points):' }}</label>
              <input
                hlmInput
                type="number"
                class="h-8 w-[70px] text-xs md:w-20"
                [ngModel]="rangeValue"
                (ngModelChange)="rangeValue = $event; onGraphConfigChange()"
                min="1"
                step="1"
                [placeholder]="rangeMode === 'time' ? '30' : 'Auto'"
                [attr.aria-label]="rangeMode === 'time' ? 'X range in seconds' : 'X range in points'"
              />
            </div>
          }

          <div class="toolbar-group config-group">
            <label class="input-label">Y Min:</label>
            <input
              hlmInput
              type="number"
              class="h-8 w-[55px] px-1.5 text-xs md:w-[60px]"
              [ngModel]="yAxisMin"
              (ngModelChange)="yAxisMin = $event; onGraphConfigChange()"
              step="any"
              placeholder="Auto"
              aria-label="Y axis minimum"
            />

            <label class="input-label">Y Max:</label>
            <input
              hlmInput
              type="number"
              class="h-8 w-[55px] px-1.5 text-xs md:w-[60px]"
              [ngModel]="yAxisMax"
              (ngModelChange)="yAxisMax = $event; onGraphConfigChange()"
              step="any"
              placeholder="Auto"
              aria-label="Y axis maximum"
            />
          </div>

          <div class="toolbar-group">
            @if (onFaultPage) {
              <fault-buttons [onClearData]="clearDataType" />
            } @else {
              <general-buttons
                [onRunSelected]="onRunSelected"
                [onClearDataType]="clearDataType"
                [onSetRealTime]="onSetRealtime"
                [historicalOn]="this.run !== undefined || this.historicalRangeActive()"
                [presets]="rangePresets"
                [selectedPresetMinutes]="selectedPresetMinutes()"
                [customActive]="customRangeActive()"
                [customCaption]="customRangeCaption()"
                [activeLastXMinutes]="customLastXMinutes()"
                [activeDateRange]="customDateRange()"
                [onSelectPreset]="onSelectPreset"
                [onApplyCustomLastX]="onApplyCustomLastX"
                [onApplyCustomDateRange]="onApplyCustomDateRange"
              />
            }
          </div>
        </div>

        <typography
          variant="large-header"
          class="toolbar-header"
          [content]="this.rightHeader"
          additionalStyles="margin: 0; font-size: 1.5rem;"
        />
      </div>

      @if (selectedDataTypes.length > 0) {
        <live-value-strip [dataTypes]="selectedDataTypes" class="mobile-value-strip" />
      }

      <div class="content-div">
        @if (this.showSideBar) {
          <graph-sidebar [dataTypes]="dataTypes" class="desktop-sidebar" />
        }
        <div class="right-container">
          <graph
            [limitRange]="realTime === true"
            [realTime]="this.realTime === true"
            [valuesSubject]="selectedDataTypeValuesSubject"
            class="graph"
            [showMultipleYAxes]="this.showMultiYaxis"
            [isPaused]="this.isPaused"
            [clearGraph]="this.clearGraph"
            [graphConfig]="this.graphConfig"
          />
        </div>
        <graph-sidebar [dataTypes]="dataTypes!" class="mobile-sidebar" />
      </div>
    </div>
  }
}
