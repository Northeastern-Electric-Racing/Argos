@if (dataTypesIsError) {
  <div>
    <error-page [errorMessage]="dataTypesError!.message" />
  </div>
} @else {
  @if (!dataTypes || dataTypesIsLoading) {
    <div>
      <loading-page />
    </div>
  } @else {
    <div class="container">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="toolbar-group">
            <button
              nz-button
              nzSize="small"
              class="sidebar-toggle"
              [attr.aria-pressed]="showSideBar"
              (click)="toggleSideBar()"
            >
              <nz-icon aria-hidden="true" [nzType]="showSideBar ? 'menu-fold' : 'menu-unfold'" />
              Sidebar
            </button>
            <button
              nz-button
              nzSize="small"
              [nzType]="showMultiYaxis ? 'primary' : 'default'"
              [attr.aria-pressed]="showMultiYaxis"
              (click)="toggleMultiYaxis()"
            >
              Multi Y-axis
            </button>
            @if (realTime === true) {
              <button nz-button nzSize="small" (click)="togglePause()">
                <nz-icon aria-hidden="true" [nzType]="isPaused ? 'caret-right' : 'pause'" />
                {{ isPaused ? 'Play' : 'Pause' }}
              </button>
            }
          </div>

          <!-- Graph Configuration Inputs -->
          @if (this.realTime === true) {
            <div class="toolbar-group config-group">
              <nz-segmented
                nzSize="small"
                aria-label="X range unit"
                [nzOptions]="rangeModeOptions"
                [ngModel]="rangeMode"
                (ngModelChange)="setRangeMode($event)"
              />
              <label class="input-label" for="graph-x-range">{{ rangeMode === 'time' ? 'X (sec):' : 'X (points):' }}</label>
              <nz-input-number
                nzId="graph-x-range"
                [(ngModel)]="rangeValue"
                class="time-range-input"
                nzSize="small"
                [nzMin]="1"
                [nzStep]="1"
                [nzPlaceHolder]="rangeMode === 'time' ? '30' : 'Auto'"
                (ngModelChange)="onGraphConfigChange()"
              />
            </div>
          }

          <div class="toolbar-group config-group">
            <label class="input-label" for="graph-y-min">Y Min:</label>
            <nz-input-number
              nzId="graph-y-min"
              [(ngModel)]="yAxisMin"
              class="y-axis-input"
              nzSize="small"
              nzPlaceHolder="Auto"
              (ngModelChange)="onGraphConfigChange()"
            />

            <label class="input-label" for="graph-y-max">Y Max:</label>
            <nz-input-number
              nzId="graph-y-max"
              [(ngModel)]="yAxisMax"
              class="y-axis-input"
              nzSize="small"
              nzPlaceHolder="Auto"
              (ngModelChange)="onGraphConfigChange()"
            />
          </div>

          <div class="toolbar-group">
            @if (onFaultPage) {
              <fault-buttons [onClearData]="clearDataType" />
            } @else {
              <general-buttons
                [onRunSelected]="onRunSelected"
                [onClearDataType]="clearDataType"
                [onSetRealTime]="onSetRealtime"
                [historicalOn]="this.run !== undefined || this.historicalRangeActive()"
                [presets]="rangePresets"
                [selectedPresetMinutes]="selectedPresetMinutes()"
                [customActive]="customRangeActive()"
                [customCaption]="customRangeCaption()"
                [activeLastXMinutes]="customLastXMinutes()"
                [activeDateRange]="customDateRange()"
                [onSelectPreset]="onSelectPreset"
                [onApplyCustomLastX]="onApplyCustomLastX"
                [onApplyCustomDateRange]="onApplyCustomDateRange"
              />
            }
          </div>
        </div>

        <typography
          variant="large-header"
          class="toolbar-header"
          [content]="this.rightHeader"
          additionalStyles="margin: 0; font-size: 1.5rem;"
        />
      </div>

      @if (selectedDataTypes.length > 0) {
        <live-value-strip [dataTypes]="selectedDataTypes" class="mobile-value-strip" />
      }

      <div class="content-div">
        @if (this.showSideBar) {
          <graph-sidebar [dataTypes]="dataTypes" class="desktop-sidebar" />
        }
        <div class="right-container">
          <graph
            [limitRange]="realTime === true"
            [realTime]="this.realTime === true"
            [valuesSubject]="selectedDataTypeValuesSubject"
            class="graph"
            [showMultipleYAxes]="this.showMultiYaxis"
            [isPaused]="this.isPaused"
            [clearGraph]="this.clearGraph"
            [graphConfig]="this.graphConfig"
          />
        </div>
        <graph-sidebar [dataTypes]="dataTypes!" class="mobile-sidebar" />
      </div>
    </div>
  }
}
