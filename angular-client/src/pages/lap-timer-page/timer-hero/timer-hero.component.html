<info-background
  svgIcon="timer"
  title="Lap Timer"
  [topRightInfo]="timer.activeSession()?.name"
  style="width: 100%; height: 100%"
>
  <div class="timer-hero">
    <div class="hero-label">TOTAL</div>
    <div class="hero-total">{{ timer.formattedTotal() }}</div>
    <div class="hero-divider"></div>
    <div class="hero-current-row">
      <div class="hero-label">LAP {{ timer.lapCount() + 1 }}</div>
      <div class="hero-current-time">{{ timer.formattedCurrentLap() }}</div>
      <div class="hero-current-delta" [class]="currentLapDeltaClass()">{{ currentLapDeltaText() }}</div>
    </div>
    <div class="hero-actions">
      @if (!timer.activeSession()) {
        <button matButton="filled" class="go-action" (click)="onStart()"><mat-icon>play_arrow</mat-icon>Start</button>
      } @else if (timer.isIdle()) {
        <button matButton="filled" class="go-action" (click)="onStart()"><mat-icon>play_arrow</mat-icon>Start</button>
        <button matButton="filled" class="danger-action" (click)="onDeleteActiveButton()">
          <mat-icon>delete</mat-icon>Delete
        </button>
      } @else if (timer.isRunning()) {
        <button matButton="filled" class="hold-action" (click)="onPause()"><mat-icon>pause</mat-icon>Pause</button>
        <button matButton="filled" class="go-action" (click)="onLap()"><mat-icon>flag</mat-icon>Lap</button>
        <button matButton="filled" class="danger-action" (click)="onStop()"><mat-icon>stop</mat-icon>Stop</button>
      } @else if (timer.isPaused()) {
        <button matButton="filled" class="go-action" (click)="onResume()"><mat-icon>play_arrow</mat-icon>Resume</button>
        <button matButton="filled" class="danger-action" (click)="onReset()"><mat-icon>restart_alt</mat-icon>Reset</button>
        <button matButton="outlined" (click)="onDownloadActiveButton()"><mat-icon>download</mat-icon>Download</button>
        <button matButton="outlined" (click)="onEndActiveSession()"><mat-icon>done</mat-icon>End Session</button>
      }
    </div>
  </div>
</info-background>
