<info-background
  svgIcon="timer"
  title="Lap Timer"
  [topRightInfo]="timer.activeSession()?.name"
  style="width: 100%; height: 100%"
>
  <div class="timer-hero">
    <div class="hero-label">TOTAL</div>
    <div class="hero-total">{{ timer.formattedTotal() }}</div>
    <div class="hero-divider"></div>
    <div class="hero-current-row">
      <div class="hero-label">LAP {{ timer.lapCount() + 1 }}</div>
      <div class="hero-current-time">{{ timer.formattedCurrentLap() }}</div>
      <div class="hero-current-delta" [class]="currentLapDeltaClass()">{{ currentLapDeltaText() }}</div>
    </div>
    <div class="hero-actions">
      @if (!timer.activeSession() || timer.isIdle()) {
        <button nz-button nzSize="large" class="argos-btn-go" (click)="onStart()">Start</button>
        @if (timer.activeSession()) {
          <button nz-button nzSize="large" nzType="primary" nzDanger (click)="onDeleteActiveButton()">Delete</button>
        }
      } @else if (timer.isRunning()) {
        <button nz-button nzSize="large" class="argos-btn-caution" (click)="onPause()">Pause</button>
        <button nz-button nzSize="large" class="argos-btn-go" (click)="onLap()">Lap</button>
        <button nz-button nzSize="large" nzType="primary" nzDanger (click)="onStop()">Stop</button>
      } @else if (timer.isPaused()) {
        <button nz-button nzSize="large" class="argos-btn-go" (click)="onResume()">Resume</button>
        <button nz-button nzSize="large" nzType="primary" nzDanger (click)="onReset()">Reset</button>
        <button nz-button nzSize="large" (click)="onDownloadActiveButton()">Download</button>
        <button nz-button nzSize="large" (click)="onEndActiveSession()">End Session</button>
      }
    </div>
  </div>
</info-background>
