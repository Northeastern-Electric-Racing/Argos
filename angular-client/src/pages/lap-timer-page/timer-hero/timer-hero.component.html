<info-background
  svgIcon="timer"
  title="Lap Timer"
  [topRightInfo]="timer.activeSession()?.name"
  style="width: 100%; height: 100%"
>
  <div class="timer-hero">
    <div class="hero-label">TOTAL</div>
    <div class="hero-total">{{ timer.formattedTotal() }}</div>
    <div class="hero-divider"></div>
    <div class="hero-current-row">
      <div class="hero-label">LAP {{ timer.lapCount() + 1 }}</div>
      <div class="hero-current-time">{{ timer.formattedCurrentLap() }}</div>
      <div class="hero-current-delta" [class]="currentLapDeltaClass()">{{ currentLapDeltaText() }}</div>
    </div>
    <div class="hero-actions">
      @if (!timer.activeSession()) {
        <button tuiButton type="button" class="hero-action" appearance="go" iconStart="@tui.play" (click)="onStart()">
          Start
        </button>
      } @else if (timer.isIdle()) {
        <button tuiButton type="button" class="hero-action" appearance="go" iconStart="@tui.play" (click)="onStart()">
          Start
        </button>
        <button
          tuiButton
          type="button"
          class="hero-action"
          appearance="primary"
          iconStart="@tui.trash"
          (click)="onDeleteActiveButton()"
        >
          Delete
        </button>
      } @else if (timer.isRunning()) {
        <button tuiButton type="button" class="hero-action" appearance="caution" iconStart="@tui.pause" (click)="onPause()">
          Pause
        </button>
        <button tuiButton type="button" class="hero-action" appearance="go" iconStart="@tui.flag" (click)="onLap()">
          Lap
        </button>
        <button tuiButton type="button" class="hero-action" appearance="primary" iconStart="@tui.square" (click)="onStop()">
          Stop
        </button>
      } @else if (timer.isPaused()) {
        <button tuiButton type="button" class="hero-action" appearance="go" iconStart="@tui.play" (click)="onResume()">
          Resume
        </button>
        <button
          tuiButton
          type="button"
          class="hero-action"
          appearance="primary"
          iconStart="@tui.rotate-ccw"
          (click)="onReset()"
        >
          Reset
        </button>
        <button
          tuiButton
          type="button"
          class="hero-action"
          appearance="secondary-grayscale"
          iconStart="@tui.download"
          (click)="onDownloadActiveButton()"
        >
          Download
        </button>
        <button
          tuiButton
          type="button"
          class="hero-action"
          appearance="secondary-grayscale"
          iconStart="@tui.square-x"
          (click)="onEndActiveSession()"
        >
          End Session
        </button>
      }
    </div>
  </div>
</info-background>
