<info-background
  svgIcon="timer"
  title="Lap Timer"
  [topRightInfo]="timer.activeSession()?.name"
  style="width: 100%; height: 100%"
>
  <div class="timer-hero">
    <div class="hero-label">TOTAL</div>
    <div class="hero-total">{{ timer.formattedTotal() }}</div>
    <div class="hero-divider"></div>
    <div class="hero-current-row">
      <div class="hero-label">LAP {{ timer.lapCount() + 1 }}</div>
      <div class="hero-current-time">{{ timer.formattedCurrentLap() }}</div>
      <div class="hero-current-delta" [class]="currentLapDeltaClass()">{{ currentLapDeltaText() }}</div>
    </div>
    <div class="hero-actions">
      @if (!timer.activeSession() || timer.isIdle()) {
        <p-button label="Start" icon="pi pi-play" severity="success" size="large" (onClick)="onStart()" />
      }
      @if (timer.activeSession() && timer.isIdle()) {
        <p-button
          label="Delete"
          icon="pi pi-trash"
          severity="danger"
          [outlined]="true"
          size="large"
          (onClick)="onDeleteActiveButton()"
        />
      } @else if (timer.isRunning()) {
        <p-button label="Pause" icon="pi pi-pause" severity="warn" size="large" (onClick)="onPause()" />
        <p-button label="Lap" icon="pi pi-flag" severity="success" size="large" (onClick)="onLap()" />
        <p-button label="Stop" icon="pi pi-stop" severity="danger" size="large" (onClick)="onStop()" />
      } @else if (timer.isPaused()) {
        <p-button label="Resume" icon="pi pi-play" severity="success" size="large" (onClick)="onResume()" />
        <p-button label="Reset" icon="pi pi-refresh" severity="danger" size="large" (onClick)="onReset()" />
        <p-button
          label="Download"
          icon="pi pi-download"
          severity="secondary"
          size="large"
          (onClick)="onDownloadActiveButton()"
        />
        <p-button
          label="End Session"
          icon="pi pi-sign-out"
          severity="secondary"
          [outlined]="true"
          size="large"
          (onClick)="onEndActiveSession()"
        />
      }
    </div>
  </div>
</info-background>
