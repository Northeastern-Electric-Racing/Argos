<info-background svgIcon="timer" title="Lap Timer" [topRightInfo]="timer.activeSession()?.name" class="h-full w-full">
  <div class="flex w-full flex-col items-center gap-2 py-2">
    <div [class]="cls.heroLabel">TOTAL</div>
    <div [class]="cls.total">{{ timer.formattedTotal() }}</div>
    <div [class]="dividerClass"></div>
    <div class="grid w-4/5 grid-cols-[auto_1fr_auto] items-baseline gap-3">
      <div [class]="cls.heroLabel">LAP {{ timer.lapCount() + 1 }}</div>
      <div class="text-center font-sans text-xl font-semibold text-fg-label tabular-nums">
        {{ timer.formattedCurrentLap() }}
      </div>
      <div [class]="currentLapDeltaClass()">{{ currentLapDeltaText() }}</div>
    </div>
    <div class="mt-2 flex flex-wrap justify-center gap-3" #actions role="group" aria-label="Timer controls">
      @if (!timer.activeSession()) {
        <argos-button label="Start" [onClick]="onStart" variant="success" />
      } @else if (timer.isIdle()) {
        <argos-button label="Start" [onClick]="onStart" variant="success" />
        <argos-button label="Delete" [onClick]="onDeleteActiveButton" variant="danger" />
      } @else if (timer.isRunning()) {
        <argos-button label="Pause" [onClick]="onPause" variant="warn" />
        <argos-button label="Lap" [onClick]="onLap" variant="success" />
        <argos-button label="Stop" [onClick]="onStop" />
      } @else if (timer.isPaused()) {
        <argos-button label="Resume" [onClick]="onResume" variant="success" />
        <argos-button label="Reset" [onClick]="onReset" variant="danger" />
        <argos-button label="Download" [onClick]="onDownloadActiveButton" variant="neutral" />
        <argos-button label="End Session" [onClick]="onEndActiveSession" variant="neutral" />
      }
    </div>
  </div>
</info-background>
