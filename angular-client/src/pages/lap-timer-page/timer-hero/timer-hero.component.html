<info-background
  svgIcon="timer"
  title="Lap Timer"
  [topRightInfo]="timer.activeSession()?.name"
  style="width: 100%; height: 100%"
>
  <div class="timer-hero">
    <div class="hero-label">TOTAL</div>
    <div class="hero-total">{{ timer.formattedTotal() }}</div>
    <div class="hero-divider"></div>
    <div class="hero-current-row">
      <div class="hero-label">LAP {{ timer.lapCount() + 1 }}</div>
      <div class="hero-current-time">{{ timer.formattedCurrentLap() }}</div>
      <div class="hero-current-delta" [class]="currentLapDeltaClass()">{{ currentLapDeltaText() }}</div>
    </div>
    <div class="hero-actions">
      @if (!timer.activeSession()) {
        <button hlmBtn size="lg" type="button" class="timer-btn timer-btn--go" (click)="onStart()">Start</button>
      } @else if (timer.isIdle()) {
        <button hlmBtn size="lg" type="button" class="timer-btn timer-btn--go" (click)="onStart()">Start</button>
        <button hlmBtn size="lg" type="button" class="timer-btn timer-btn--halt" (click)="onDeleteActiveButton()">
          Delete
        </button>
      } @else if (timer.isRunning()) {
        <button hlmBtn size="lg" type="button" class="timer-btn timer-btn--hold" (click)="onPause()">Pause</button>
        <button hlmBtn size="lg" type="button" class="timer-btn timer-btn--go" (click)="onLap()">Lap</button>
        <button hlmBtn size="lg" type="button" class="timer-btn timer-btn--halt" (click)="onStop()">Stop</button>
      } @else if (timer.isPaused()) {
        <button hlmBtn size="lg" type="button" class="timer-btn timer-btn--go" (click)="onResume()">Resume</button>
        <button hlmBtn size="lg" type="button" class="timer-btn timer-btn--halt" (click)="onReset()">Reset</button>
        <button hlmBtn variant="outline" size="lg" type="button" class="timer-btn" (click)="onDownloadActiveButton()">
          Download
        </button>
        <button hlmBtn variant="outline" size="lg" type="button" class="timer-btn" (click)="onEndActiveSession()">
          End Session
        </button>
      }
    </div>
  </div>
</info-background>
