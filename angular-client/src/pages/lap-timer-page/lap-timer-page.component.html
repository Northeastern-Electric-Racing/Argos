<ng-template #speedGauge>
  <info-background svgIcon="speed" title="Speed" style="width: 100%; height: 100%">
    <div class="gauge-wrap">
      <half-gauge [current]="liveSpeed()" [max]="100" [min]="0" unit="mph" [color]="speedGaugeColor()" [size]="320" />
    </div>
  </info-background>
</ng-template>
<ng-template #batteryStat>
  <info-background title="Battery" style="width: 100%; height: 100%">
    <gauge-stat [value]="liveSoc()" unit="%" [color]="socColor()" />
  </info-background>
</ng-template>
<ng-template #motorStat>
  <info-background title="Motor" style="width: 100%; height: 100%">
    <gauge-stat [value]="liveMotorTemp()" unit="°C" [color]="motorTempColor()" />
  </info-background>
</ng-template>

@if (compact()) {
  <!-- Phones: tiles take their content's height; only the two scrolling tables get a set height. -->
  <div class="page-grid compact-grid">
    <sessions-panel class="wide table-tile" />
    <timer-hero class="wide" />
    <session-summary class="wide" />
    <div class="wide"><ng-container [ngTemplateOutlet]="speedGauge" /></div>
    <div><ng-container [ngTemplateOutlet]="batteryStat" /></div>
    <div><ng-container [ngTemplateOutlet]="motorStat" /></div>
    <laps-table class="wide table-tile" />
  </div>
} @else {
  <div class="page-grid">
    <mat-grid-list cols="6" gutterSize="15px" rowHeight="1.5rem">
      <mat-grid-tile [colspan]="6" [rowspan]="8">
        <sessions-panel />
      </mat-grid-tile>

      <mat-grid-tile [colspan]="3" [rowspan]="9">
        <timer-hero />
      </mat-grid-tile>

      <mat-grid-tile [colspan]="1" [rowspan]="9">
        <session-summary />
      </mat-grid-tile>

      <mat-grid-tile [colspan]="2" [rowspan]="5">
        <ng-container [ngTemplateOutlet]="speedGauge" />
      </mat-grid-tile>

      <mat-grid-tile [colspan]="1" [rowspan]="4">
        <ng-container [ngTemplateOutlet]="batteryStat" />
      </mat-grid-tile>

      <mat-grid-tile [colspan]="1" [rowspan]="4">
        <ng-container [ngTemplateOutlet]="motorStat" />
      </mat-grid-tile>

      <mat-grid-tile [colspan]="6" [rowspan]="22">
        <laps-table />
      </mat-grid-tile>
    </mat-grid-list>
  </div>
}
