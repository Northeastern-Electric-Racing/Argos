<!-- #909's 6-column mat-grid-list (1.5rem rows, 15px gutter) as a CSS grid; each tile centres and clips its card -->
<div class="mx-4 grid auto-rows-[1.5rem] grid-cols-6 gap-3.75">
  <div [class]="tile" class="col-span-6 row-span-8">
    <sessions-panel />
  </div>

  <div [class]="tile" class="col-span-3 row-span-9">
    <timer-hero />
  </div>

  <div [class]="tile" class="col-span-1 row-span-9">
    <session-summary />
  </div>

  <div [class]="tile" class="col-span-2 row-span-5">
    <info-background svgIcon="speed" title="Speed" class="h-full w-full">
      <div class="flex h-full w-full items-center justify-center overflow-hidden">
        <half-gauge [current]="liveSpeed()" [max]="100" [min]="0" unit="mph" [color]="speedGaugeColor()" [size]="320" />
      </div>
    </info-background>
  </div>

  <div [class]="tile" class="col-span-1 row-span-4">
    <info-background title="Battery" class="h-full w-full">
      <gauge-stat [value]="liveSoc()" unit="%" [color]="socColor()" />
    </info-background>
  </div>

  <div [class]="tile" class="col-span-1 row-span-4">
    <info-background title="Motor" class="h-full w-full">
      <gauge-stat [value]="liveMotorTemp()" unit="°C" [color]="motorTempColor()" />
    </info-background>
  </div>

  <div [class]="tile" class="col-span-6 row-span-22">
    <laps-table />
  </div>
</div>
