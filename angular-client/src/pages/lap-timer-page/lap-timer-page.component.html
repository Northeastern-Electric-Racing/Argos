<div class="page-grid">
  <mat-grid-list [cols]="layout().cols" gutterSize="15px" rowHeight="1.5rem">
    <mat-grid-tile [colspan]="layout().sessions[0]" [rowspan]="layout().sessions[1]">
      <sessions-panel />
    </mat-grid-tile>

    <mat-grid-tile [colspan]="layout().timer[0]" [rowspan]="layout().timer[1]">
      <timer-hero />
    </mat-grid-tile>

    <mat-grid-tile [colspan]="layout().summary[0]" [rowspan]="layout().summary[1]">
      <session-summary />
    </mat-grid-tile>

    <mat-grid-tile [colspan]="layout().speed[0]" [rowspan]="layout().speed[1]">
      <info-background svgIcon="speed" title="Speed" style="width: 100%; height: 100%">
        <div class="gauge-wrap">
          <half-gauge [current]="liveSpeed()" [max]="100" [min]="0" unit="mph" [color]="speedGaugeColor()" [size]="320" />
        </div>
      </info-background>
    </mat-grid-tile>

    <mat-grid-tile [colspan]="layout().battery[0]" [rowspan]="layout().battery[1]">
      <info-background title="Battery" style="width: 100%; height: 100%">
        <gauge-stat [value]="liveSoc()" unit="%" [color]="socColor()" />
      </info-background>
    </mat-grid-tile>

    <mat-grid-tile [colspan]="layout().motor[0]" [rowspan]="layout().motor[1]">
      <info-background title="Motor" style="width: 100%; height: 100%">
        <gauge-stat [value]="liveMotorTemp()" unit="°C" [color]="motorTempColor()" />
      </info-background>
    </mat-grid-tile>

    <mat-grid-tile [colspan]="layout().laps[0]" [rowspan]="layout().laps[1]">
      <laps-table />
    </mat-grid-tile>
  </mat-grid-list>
</div>
