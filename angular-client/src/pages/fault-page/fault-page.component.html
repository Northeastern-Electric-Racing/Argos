<div class="container">
  <typography
    class="title-style"
    variant="x-large-title"
    content="Faults"
    additionalStyles="font-size: 4vw; letter-spacing: 0.2rem; word-spacing: 0.2rem; text-align: left; margin-top: 0;"
  />
  <hlm-accordion type="multiple">
    @for (node of nodeArray; track node.node) {
      <hlm-accordion-item>
        <hlm-accordion-trigger>{{ node.node }}</hlm-accordion-trigger>
        <hlm-accordion-content>
          <table hlmTable>
            <thead hlmTHead>
              <tr hlmTr>
                <th hlmTh>Name</th>
                <th hlmTh>Occurred At</th>
                <th hlmTh>Last Seen</th>
                <th hlmTh>Expired?</th>
              </tr>
            </thead>
            <tbody hlmTBody>
              @for (fault of node.data; track $index) {
                <tr
                  hlmTr
                  class="cursor-pointer even:bg-muted/30"
                  tabindex="0"
                  (click)="onRowSelect(fault)"
                  (keydown.enter)="onRowSelect(fault)"
                >
                  <td hlmTd>{{ fault.name }}</td>
                  <td hlmTd>{{ fault.occurredAt | date: 'HH:mm:ss' }}</td>
                  <td hlmTd>{{ fault.lastSeen | date: 'HH:mm:ss' }}</td>
                  <td hlmTd>{{ fault.expired ? 'Yes' : 'No' }}</td>
                </tr>
              }
            </tbody>
          </table>
        </hlm-accordion-content>
      </hlm-accordion-item>
    }
  </hlm-accordion>
</div>
