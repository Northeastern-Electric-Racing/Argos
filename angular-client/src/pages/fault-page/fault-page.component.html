<div class="container">
  <typography
    class="title-style"
    variant="x-large-title"
    content="Faults"
    additionalStyles="font-size: 4vw; letter-spacing: 0.2rem; word-spacing: 0.2rem; text-align: left; margin-top: 0;"
  />
  <nz-collapse>
    @for (node of nodeArray; track node.node) {
      <nz-collapse-panel [nzHeader]="node.node">
        <nz-table #faultTable nzSize="small" [nzData]="node.data" [nzFrontPagination]="false" [nzShowPagination]="false">
          <thead>
            <tr>
              <th>Name</th>
              <th>Occurred At</th>
              <th>Last Seen</th>
              <th>Expired?</th>
            </tr>
          </thead>
          <tbody>
            @for (fault of faultTable.data; track $index) {
              <tr class="fault-row" tabindex="0" (click)="onRowSelect(fault)" (keydown.enter)="onRowSelect(fault)">
                <td>{{ fault.name }}</td>
                <td>{{ fault.occurredAt | date: 'HH:mm:ss' }}</td>
                <td>{{ fault.lastSeen | date: 'HH:mm:ss' }}</td>
                <td>{{ fault.expired ? 'Yes' : 'No' }}</td>
              </tr>
            }
          </tbody>
        </nz-table>
      </nz-collapse-panel>
    }
  </nz-collapse>
</div>
