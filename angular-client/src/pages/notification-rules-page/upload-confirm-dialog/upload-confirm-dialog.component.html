<h2 mat-dialog-title>Confirm Rule Upload</h2>
<mat-dialog-content>
  <p>The following {{ rules.length }} rule(s) will be added:</p>
  <div class="rules-preview">
    <table mat-table [dataSource]="rules">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let rule">{{ rule.id }}</td>
      </ng-container>
      <ng-container matColumnDef="topic">
        <th mat-header-cell *matHeaderCellDef>Topic</th>
        <td mat-cell *matCellDef="let rule">{{ rule.topic }}</td>
      </ng-container>
      <ng-container matColumnDef="expr">
        <th mat-header-cell *matHeaderCellDef>Expression</th>
        <td mat-cell *matCellDef="let rule">{{ rule.expr }}</td>
      </ng-container>
      <ng-container matColumnDef="debounce_time">
        <th mat-header-cell *matHeaderCellDef>Debounce (s)</th>
        <td mat-cell *matCellDef="let rule">{{ rule.debounce_time }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
      <tr mat-row *matRowDef="let rule; columns: columns"></tr>
    </table>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton (click)="onCancel()">Cancel</button>
  <button matButton="filled" (click)="onConfirm()">Confirm Upload</button>
</mat-dialog-actions>
