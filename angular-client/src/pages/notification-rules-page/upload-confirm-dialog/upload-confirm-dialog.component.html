<hlm-dialog-header>
  <h2 hlmDialogTitle>Confirm Rule Upload</h2>
  <p hlmDialogDescription>The following {{ rules.length }} rule(s) will be added:</p>
</hlm-dialog-header>
<div class="confirm-content">
  <div hlmTableContainer class="rules-preview">
    <table hlmTable>
      <thead hlmTHead>
        <tr hlmTr>
          <th hlmTh>ID</th>
          <th hlmTh>Topic</th>
          <th hlmTh>Expression</th>
          <th hlmTh>Debounce (s)</th>
        </tr>
      </thead>
      <tbody hlmTBody>
        @for (rule of rules; track rule.id) {
          <tr hlmTr>
            <td hlmTd>{{ rule.id }}</td>
            <td hlmTd>{{ rule.topic }}</td>
            <td hlmTd>{{ rule.expr }}</td>
            <td hlmTd>{{ rule.debounce_time }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
<hlm-dialog-footer>
  <button hlmBtn variant="ghost" (click)="onCancel()">Cancel</button>
  <button hlmBtn (click)="onConfirm()">Confirm Upload</button>
</hlm-dialog-footer>
