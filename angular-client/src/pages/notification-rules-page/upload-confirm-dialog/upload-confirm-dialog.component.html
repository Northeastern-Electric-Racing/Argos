<div class="confirm-content">
  <p>The following {{ rules.length }} rule(s) will be added:</p>
  <div class="rules-preview">
    <table tuiTable size="s" class="preview-table">
      <thead>
        <tr>
          <th tuiTh>ID</th>
          <th tuiTh>Topic</th>
          <th tuiTh>Expression</th>
          <th tuiTh>Debounce (s)</th>
        </tr>
      </thead>
      <tbody tuiTbody>
        @for (rule of rules; track rule.id) {
          <tr tuiTr>
            <td tuiTd>{{ rule.id }}</td>
            <td tuiTd>{{ rule.topic }}</td>
            <td tuiTd>{{ rule.expr }}</td>
            <td tuiTd>{{ rule.debounce_time }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="button-row">
    <button appearance="secondary-grayscale" tuiButton type="button" (click)="onCancel()">Cancel</button>
    <button tuiButton type="button" (click)="onConfirm()">Confirm Upload</button>
  </div>
</div>
