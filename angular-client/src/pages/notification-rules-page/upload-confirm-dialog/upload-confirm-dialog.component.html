<p class="mt-0 mb-3 text-fg-label">The following {{ rules.length }} rule(s) will be added:</p>
<div class="mb-2 max-h-75 overflow-y-auto rounded-md border border-solid border-border">
  <table [class]="table">
    <thead>
      <tr>
        <th [class]="th" class="sticky top-0">ID</th>
        <th [class]="th" class="sticky top-0">Topic</th>
        <th [class]="th" class="sticky top-0">Expression</th>
        <th [class]="th" class="sticky top-0">Debounce (s)</th>
      </tr>
    </thead>
    <tbody>
      @for (rule of rules; track rule.id) {
        <tr [class]="row">
          <td [class]="td">{{ rule.id }}</td>
          <td [class]="td">{{ rule.topic }}</td>
          <td [class]="td">{{ rule.expr }}</td>
          <td [class]="td">{{ rule.debounce_time }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
<div [class]="f.actions">
  <button type="button" uiButton variant="text" (click)="onCancel()">Cancel</button>
  <button type="button" uiButton (click)="onConfirm()">Confirm Upload</button>
</div>
