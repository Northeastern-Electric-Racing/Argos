<form tuiForm="m" [formGroup]="form" (ngSubmit)="onSubmit()">
  <tui-textfield>
    <label tuiLabel>Rule ID</label>
    <input tuiInput formControlName="id" placeholder="e.g. high-voltage-alert" />
  </tui-textfield>
  <tui-error formControlName="id" />

  <tui-textfield tuiChevron>
    <label tuiLabel>Topic</label>
    <input tuiComboBox formControlName="topic" placeholder="e.g. BMS/Pack/Voltage" />
    <tui-data-list-wrapper *tuiDropdown [items]="allTopics() | tuiFilterByInput" />
  </tui-textfield>
  <tui-error formControlName="topic" />

  <tui-textfield>
    <label tuiLabel>Expression</label>
    <input tuiInput formControlName="expr" placeholder="e.g. a > 5.0 || a < 1.0" />
  </tui-textfield>
  <tui-error formControlName="expr" />

  <tui-textfield>
    <label tuiLabel>Debounce Time (seconds)</label>
    <input tuiInputNumber formControlName="debounce_time" placeholder="e.g. 60" [min]="0" />
  </tui-textfield>
  <tui-error formControlName="debounce_time" />

  <footer>
    <button appearance="secondary" tuiButton type="button" (click)="onCancel()">Cancel</button>
    <button tuiButton type="submit">Add Rule</button>
  </footer>
</form>
