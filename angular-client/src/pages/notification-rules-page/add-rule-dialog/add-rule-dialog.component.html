<form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="onSubmit()">
  <nz-form-item>
    <nz-form-label nzFor="rule-id">Rule ID</nz-form-label>
    <nz-form-control nzErrorTip="Rule ID is required">
      <input id="rule-id" nz-input formControlName="id" placeholder="e.g. high-voltage-alert" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="rule-topic">Topic</nz-form-label>
    <nz-form-control nzErrorTip="Topic is required">
      <!-- Searchable, and only a listed topic can be picked. -->
      <nz-select nzId="rule-topic" nzShowSearch nzAllowClear formControlName="topic" nzPlaceHolder="e.g. BMS/Pack/Voltage">
        @for (topic of allTopics(); track topic) {
          <nz-option [nzValue]="topic" [nzLabel]="topic" />
        }
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="rule-expr">Expression</nz-form-label>
    <nz-form-control nzErrorTip="Expression is required">
      <input id="rule-expr" nz-input formControlName="expr" placeholder="e.g. a > 5.0 || a < 1.0" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="rule-debounce">Debounce Time (seconds)</nz-form-label>
    <nz-form-control [nzErrorTip]="debounceError">
      <input id="rule-debounce" nz-input formControlName="debounce_time" type="number" placeholder="e.g. 60" />
      <ng-template #debounceError let-control>
        {{ control.hasError('min') ? 'Must be 0 or greater' : 'Debounce time is required' }}
      </ng-template>
    </nz-form-control>
  </nz-form-item>

  <div class="button-row">
    <button nz-button nzType="text" type="button" (click)="onCancel()">Cancel</button>
    <button nz-button nzType="primary" type="submit">Add Rule</button>
  </div>
</form>
