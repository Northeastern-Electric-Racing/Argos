<div class="page-container">
  <input
    #fileInput
    type="file"
    accept=".csv"
    class="hidden-file-input"
    (change)="onFileSelected($event)"
    aria-label="Upload CSV file"
  />

  <div class="page-layout">
    <div class="main-content">
      <div class="header-row">
        <typography variant="x-large-title" content="Notification Rules" />
        <div class="header-buttons">
          <p-button label="View Log" icon="pi pi-list" (onClick)="onViewLog()" />
          <p-button label="Upload" icon="pi pi-upload" severity="secondary" (onClick)="onUpload()" />
          <p-button label="Download" icon="pi pi-download" severity="secondary" (onClick)="onDownload()" />
        </div>
      </div>

      <div class="rules-bar">
        <typography variant="header" content="Rules" />
        <div class="rules-bar-actions">
          <p-button label="Add" icon="pi pi-plus" (onClick)="onAddRule()" />
          <p-button
            label="Remove"
            icon="pi pi-trash"
            severity="danger"
            [outlined]="true"
            [disabled]="!hasSelection()"
            (onClick)="onRemoveSelected()"
          />
          <p-button
            label="Toggle Subscription"
            icon="pi pi-bell"
            severity="secondary"
            [disabled]="!hasSelection()"
            (onClick)="onToggleSubscription()"
          />
        </div>
        <p-iconfield class="search-container">
          <p-inputicon class="pi pi-search" />
          <input
            pInputText
            type="text"
            placeholder="Search rules"
            [value]="searchTerm()"
            (input)="onSearchInput($event)"
            aria-label="Search rules"
            class="search-input"
          />
        </p-iconfield>
      </div>

      <rules-table
        #rulesTable
        [clientId]="clientId"
        [searchTerm]="searchTerm()"
        (selectionChanged)="onSelectionChanged($event)"
      />
    </div>

    <p-button
      class="stream-toggle"
      [icon]="streamRailOpen() ? 'pi pi-angle-right' : 'pi pi-angle-left'"
      severity="secondary"
      [outlined]="true"
      size="small"
      [ariaLabel]="streamRailOpen() ? 'Hide notification stream' : 'Show notification stream'"
      [pTooltip]="streamRailOpen() ? 'Hide stream' : 'Show stream'"
      tooltipPosition="left"
      (onClick)="toggleStreamRail()"
    />

    <aside
      class="stream-rail"
      [class.collapsed]="!streamRailOpen()"
      [attr.aria-hidden]="!streamRailOpen()"
      aria-label="Live notification stream"
    >
      <notification-list variant="stream" />
    </aside>
  </div>
</div>
