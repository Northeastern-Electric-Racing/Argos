<div class="page-container">
  <input
    #fileInput
    type="file"
    accept=".csv"
    class="hidden-file-input"
    (change)="onFileSelected($event)"
    aria-label="Upload CSV file"
  />

  <div class="page-layout">
    <div class="main-content">
      <div class="header-row">
        <typography variant="x-large-title" content="Notification Rules" />
        <div class="header-buttons">
          <button hlmBtn variant="outline" type="button" (click)="onViewLog()">
            <ng-icon name="lucideHistory" />
            View Log
          </button>
          <button hlmBtn variant="outline" type="button" [disabled]="uploading()" (click)="onUpload()">
            <ng-icon name="lucideUpload" />
            Upload
          </button>
          <button hlmBtn variant="outline" type="button" [disabled]="downloading()" (click)="onDownload()">
            <ng-icon name="lucideDownload" />
            Download
          </button>
        </div>
      </div>

      <div class="rules-bar">
        <typography variant="header" content="Rules" />
        <div class="rules-bar-actions">
          <button hlmBtn type="button" aria-haspopup="dialog" (click)="onAddRule()">
            <ng-icon name="lucidePlus" />
            Add
          </button>
          <button hlmBtn variant="destructive" type="button" [disabled]="!hasSelection()" (click)="onRemoveSelected()">
            <ng-icon name="lucideTrash2" />
            Remove
          </button>
          <button hlmBtn variant="secondary" type="button" [disabled]="!hasSelection()" (click)="onToggleSubscription()">
            <ng-icon name="lucideBellRing" />
            Toggle Subscription
          </button>
        </div>
        <div hlmInputGroup class="search-container">
          <input
            hlmInputGroupInput
            type="search"
            placeholder="Search rules..."
            [value]="searchTerm()"
            (input)="onSearchInput($event)"
            aria-label="Search rules"
          />
          <div hlmInputGroupAddon>
            <ng-icon name="lucideSearch" />
          </div>
        </div>
      </div>

      <rules-table
        #rulesTable
        [clientId]="clientId"
        [searchTerm]="searchTerm()"
        (selectionChanged)="onSelectionChanged($event)"
      />
    </div>

    <button
      hlmBtn
      variant="outline"
      size="icon-sm"
      type="button"
      class="stream-toggle"
      (click)="toggleStreamRail()"
      [attr.aria-label]="streamRailOpen() ? 'Hide notification stream' : 'Show notification stream'"
      [attr.aria-expanded]="streamRailOpen()"
      [hlmTooltip]="streamRailOpen() ? 'Hide stream' : 'Show stream'"
    >
      <ng-icon [name]="streamRailOpen() ? 'lucideChevronRight' : 'lucideChevronLeft'" />
    </button>

    <aside
      class="stream-rail"
      [class.collapsed]="!streamRailOpen()"
      [attr.aria-hidden]="!streamRailOpen()"
      aria-label="Live notification stream"
    >
      <notification-list variant="stream" />
    </aside>
  </div>
</div>
