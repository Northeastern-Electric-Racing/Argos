<div class="page-container">
  <input
    #fileInput
    type="file"
    accept=".csv"
    class="hidden-file-input"
    (change)="onFileSelected($event)"
    aria-label="Upload CSV file"
  />

  <div class="page-layout">
    <div class="main-content">
      <div class="header-row">
        <typography variant="x-large-title" content="Notification Rules" />
        <div class="header-buttons">
          <argos-button label="View Log" [onClick]="onViewLog" additionalStyles="background-color: #ef4345;" />
          <argos-button label="Upload" [onClick]="onUpload" additionalStyles="background-color: #555;" />
          <argos-button label="Download" [onClick]="onDownload" additionalStyles="background-color: #555;" />
        </div>
      </div>

      <div class="rules-bar">
        <typography variant="header" content="Rules" />
        <div class="rules-bar-actions">
          <argos-button label="Add" [onClick]="onAddRule" />
          <argos-button label="Remove" [onClick]="onRemoveSelected" [disabled]="!hasSelection()" />
          <argos-button label="Toggle Subscription" [onClick]="onToggleSubscription" [disabled]="!hasSelection()" />
        </div>
        <mat-form-field class="search-container dense-controls" subscriptSizing="dynamic">
          <mat-icon matPrefix>search</mat-icon>
          <input
            matInput
            type="search"
            placeholder="Search rules"
            aria-label="Search rules"
            [value]="searchTerm()"
            (input)="onSearchInput($event)"
          />
        </mat-form-field>
      </div>

      <rules-table
        #rulesTable
        [clientId]="clientId"
        [searchTerm]="searchTerm()"
        (selectionChanged)="onSelectionChanged($event)"
      />
    </div>

    <button
      mat-icon-button
      type="button"
      class="stream-toggle"
      (click)="toggleStreamRail()"
      [attr.aria-label]="streamRailOpen() ? 'Hide notification stream' : 'Show notification stream'"
      [attr.title]="streamRailOpen() ? 'Hide stream' : 'Show stream'"
    >
      <mat-icon>{{ streamRailOpen() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>

    <aside
      class="stream-rail"
      [class.collapsed]="!streamRailOpen()"
      [attr.aria-hidden]="!streamRailOpen()"
      aria-label="Live notification stream"
    >
      <notification-list variant="stream" />
    </aside>
  </div>
</div>
