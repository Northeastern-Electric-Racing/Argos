<div class="page-container">
  <input
    #fileInput
    type="file"
    accept=".csv"
    class="hidden-file-input"
    (change)="onFileSelected($event)"
    aria-label="Upload CSV file"
  />

  <div class="page-layout">
    <div class="main-content">
      <div class="header-row">
        <typography variant="x-large-title" content="Notification Rules" />
        <div class="header-buttons">
          <button tuiButton type="button" size="m" appearance="primary" iconStart="@tui.scroll-text" (click)="onViewLog()">
            View Log
          </button>
          <button
            tuiButton
            type="button"
            size="m"
            appearance="secondary-grayscale"
            iconStart="@tui.upload"
            (click)="onUpload()"
          >
            Upload
          </button>
          <button
            tuiButton
            type="button"
            size="m"
            appearance="secondary-grayscale"
            iconStart="@tui.download"
            (click)="onDownload()"
          >
            Download
          </button>
        </div>
      </div>

      <div class="rules-bar">
        <typography variant="header" content="Rules" />
        <div class="rules-bar-actions">
          <button tuiButton type="button" size="s" appearance="primary" iconStart="@tui.plus" (click)="onAddRule()">
            Add
          </button>
          <button
            tuiButton
            type="button"
            size="s"
            appearance="secondary-destructive"
            iconStart="@tui.trash"
            [disabled]="!hasSelection()"
            (click)="onRemoveSelected()"
          >
            Remove
          </button>
          <button
            tuiButton
            type="button"
            size="s"
            appearance="secondary-grayscale"
            iconStart="@tui.bell-ring"
            [disabled]="!hasSelection()"
            (click)="onToggleSubscription()"
          >
            Toggle Subscription
          </button>
        </div>
        <div class="search-container">
          <tui-textfield iconStart="@tui.search" tuiTextfieldSize="s" class="search-input">
            <input
              tuiInput
              type="text"
              placeholder="Search..."
              [value]="searchTerm()"
              (input)="onSearchInput($event)"
              aria-label="Search rules"
            />
          </tui-textfield>
        </div>
      </div>

      <rules-table
        #rulesTable
        [clientId]="clientId"
        [searchTerm]="searchTerm()"
        (selectionChanged)="onSelectionChanged($event)"
      />
    </div>

    <button
      tuiIconButton
      type="button"
      size="s"
      appearance="secondary-grayscale"
      class="stream-toggle"
      [iconStart]="streamRailOpen() ? '@tui.chevron-right' : '@tui.chevron-left'"
      [attr.aria-expanded]="streamRailOpen()"
      [attr.title]="streamRailOpen() ? 'Hide stream' : 'Show stream'"
      (click)="toggleStreamRail()"
    >
      {{ streamRailOpen() ? 'Hide notification stream' : 'Show notification stream' }}
    </button>

    <aside
      class="stream-rail"
      [class.collapsed]="!streamRailOpen()"
      [attr.aria-hidden]="!streamRailOpen()"
      aria-label="Live notification stream"
    >
      <notification-list variant="stream" />
    </aside>
  </div>
</div>
