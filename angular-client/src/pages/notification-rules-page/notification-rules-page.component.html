<div class="page-container">
  <input
    #fileInput
    type="file"
    accept=".csv"
    class="hidden-file-input"
    (change)="onFileSelected($event)"
    aria-label="Upload CSV file"
  />

  <div class="page-layout">
    <div class="main-content">
      <div class="header-row">
        <typography variant="x-large-title" content="Notification Rules" />
        <div class="header-buttons">
          <button nz-button nzType="primary" (click)="onViewLog()">View Log</button>
          <button nz-button [nzLoading]="uploading()" (click)="onUpload()">
            <nz-icon aria-hidden="true" nzType="upload" />
            Upload
          </button>
          <button nz-button [nzLoading]="downloading()" (click)="onDownload()">
            <nz-icon aria-hidden="true" nzType="download" />
            Download
          </button>
        </div>
      </div>

      <div class="rules-bar">
        <typography variant="header" content="Rules" />
        <div class="rules-bar-actions">
          <button nz-button nzType="primary" (click)="onAddRule()">
            <nz-icon aria-hidden="true" nzType="plus" />
            Add
          </button>
          <button nz-button nzDanger [disabled]="!hasSelection()" (click)="onRemoveSelected()">Remove</button>
          <button nz-button [disabled]="!hasSelection()" (click)="onToggleSubscription()">Toggle Subscription</button>
        </div>
        <div class="search-container">
          <nz-input-wrapper nzAllowClear class="search-input">
            <nz-icon aria-hidden="true" nzInputPrefix nzType="search" />
            <input
              nz-input
              type="text"
              placeholder="Search rules"
              [ngModel]="searchTerm()"
              (ngModelChange)="searchTerm.set($event ?? '')"
              aria-label="Search rules"
            />
          </nz-input-wrapper>
        </div>
      </div>

      <rules-table
        #rulesTable
        [clientId]="clientId"
        [searchTerm]="searchTerm()"
        (selectionChanged)="onSelectionChanged($event)"
      />
    </div>

    <button
      nz-button
      type="button"
      class="stream-toggle"
      (click)="toggleStreamRail()"
      [attr.aria-label]="streamRailOpen() ? 'Hide notification stream' : 'Show notification stream'"
      [attr.title]="streamRailOpen() ? 'Hide stream' : 'Show stream'"
    >
      <nz-icon aria-hidden="true" [nzType]="streamRailOpen() ? 'right' : 'left'" />
    </button>

    <aside
      class="stream-rail"
      [class.collapsed]="!streamRailOpen()"
      [attr.aria-hidden]="!streamRailOpen()"
      aria-label="Live notification stream"
    >
      <notification-list variant="stream" />
    </aside>
  </div>
</div>
