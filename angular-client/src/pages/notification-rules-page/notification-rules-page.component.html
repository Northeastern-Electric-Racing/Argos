<div class="page-container">
  <input
    #fileInput
    type="file"
    accept=".csv"
    class="hidden-file-input"
    (change)="onFileSelected($event)"
    aria-label="Upload CSV file"
  />

  <div class="page-layout">
    <div class="main-content">
      <div class="header-row">
        <typography variant="x-large-title" content="Notification Rules" />
        <div class="header-buttons">
          <button matButton="outlined" (click)="onViewLog()"><mat-icon>history</mat-icon>View Log</button>
          <button matButton="outlined" (click)="onUpload()"><mat-icon>upload</mat-icon>Upload</button>
          <button matButton="outlined" (click)="onDownload()"><mat-icon>download</mat-icon>Download</button>
        </div>
      </div>

      <div class="rules-bar">
        <typography variant="header" content="Rules" />
        <div class="rules-bar-actions">
          <button matButton="filled" (click)="onAddRule()"><mat-icon>add</mat-icon>Add</button>
          <button matButton="outlined" class="danger-action" (click)="onRemoveSelected()" [disabled]="!hasSelection()">
            <mat-icon>delete</mat-icon>Remove
          </button>
          <button matButton="outlined" (click)="onToggleSubscription()" [disabled]="!hasSelection()">
            <mat-icon>notifications</mat-icon>Toggle Subscription
          </button>
        </div>
        <mat-form-field class="search-container dense-controls" subscriptSizing="dynamic">
          <mat-icon matPrefix>search</mat-icon>
          <input
            matInput
            type="search"
            placeholder="Search rules"
            aria-label="Search rules"
            [value]="searchTerm()"
            (input)="onSearchInput($event)"
          />
        </mat-form-field>
      </div>

      <rules-table
        #rulesTable
        [clientId]="clientId"
        [searchTerm]="searchTerm()"
        (selectionChanged)="onSelectionChanged($event)"
      />
    </div>

    <button
      matIconButton
      type="button"
      class="stream-toggle"
      (click)="toggleStreamRail()"
      [attr.aria-label]="streamRailOpen() ? 'Hide notification stream' : 'Show notification stream'"
      [matTooltip]="streamRailOpen() ? 'Hide stream' : 'Show stream'"
    >
      <mat-icon>{{ streamRailOpen() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>

    <aside
      class="stream-rail"
      [class.collapsed]="!streamRailOpen()"
      [attr.aria-hidden]="!streamRailOpen()"
      aria-label="Live notification stream"
    >
      <notification-list variant="stream" />
    </aside>
  </div>
</div>
