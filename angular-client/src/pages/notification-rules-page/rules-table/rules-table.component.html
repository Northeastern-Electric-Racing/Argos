<div [class]="t.wrapper" class="max-h-150" [attr.aria-busy]="loading()">
  <table cdk-table [class]="table" [dataSource]="filteredRules()" [trackBy]="trackById">
    <ng-container cdkColumnDef="select">
      <th cdk-header-cell *cdkHeaderCellDef [class]="th" class="w-12 max-md:w-10">
        <input
          type="checkbox"
          [class]="checkbox"
          aria-label="Select all rules"
          [disabled]="filteredRules().length === 0"
          [checked]="allSelected()"
          [indeterminate]="someSelected()"
          (change)="toggleAll()"
        />
      </th>
      <td cdk-cell *cdkCellDef="let rule" [class]="td" class="w-12 max-md:w-10">
        <input
          type="checkbox"
          [class]="checkbox"
          [attr.aria-label]="'Select rule ' + rule.id"
          [checked]="isSelected(rule)"
          (change)="toggleRow(rule)"
        />
      </td>
    </ng-container>

    <ng-container cdkColumnDef="expr">
      <th cdk-header-cell *cdkHeaderCellDef [class]="th">Rule</th>
      <td cdk-cell *cdkCellDef="let rule" [class]="td">{{ rule.expr }}</td>
    </ng-container>

    <ng-container cdkColumnDef="topic">
      <th cdk-header-cell *cdkHeaderCellDef [class]="th">Applied To</th>
      <td cdk-cell *cdkCellDef="let rule" [class]="td">{{ rule.topic }}</td>
    </ng-container>

    <!-- TODO: Uploaded By column once backend supports it -->
    <ng-container cdkColumnDef="uploadedBy">
      <th cdk-header-cell *cdkHeaderCellDef [class]="th" class="max-md:hidden">Uploaded By</th>
      <td cdk-cell *cdkCellDef="let rule" [class]="td" class="max-md:hidden">-</td>
    </ng-container>

    <!-- TODO: Description column once backend supports it -->
    <ng-container cdkColumnDef="description">
      <th cdk-header-cell *cdkHeaderCellDef [class]="th" class="max-md:hidden">Description</th>
      <td cdk-cell *cdkCellDef="let rule" [class]="td" class="max-md:hidden">-</td>
    </ng-container>

    <ng-container cdkColumnDef="subscribed">
      <th cdk-header-cell *cdkHeaderCellDef [class]="th">Subscribed</th>
      <td cdk-cell *cdkCellDef="let rule" [class]="td">
        <ui-switch
          [checked]="rule.is_subscribed"
          (checkedChange)="onToggleSubscription(rule, $event)"
          [ariaLabel]="'Subscribed to ' + rule.id"
        />
      </td>
    </ng-container>

    <ng-container cdkColumnDef="actions">
      <th cdk-header-cell *cdkHeaderCellDef [class]="th" class="w-22 max-md:w-18">
        <span class="cdk-visually-hidden">Actions</span>
      </th>
      <td cdk-cell *cdkCellDef="let rule" [class]="td" class="w-22 max-md:w-18">
        <div class="flex items-center gap-0.5 max-md:gap-0">
          <button
            type="button"
            uiButton
            variant="text"
            size="icon"
            (click)="onEdit(rule)"
            [attr.aria-label]="'Edit rule ' + rule.id"
          >
            <ui-icon name="edit" class="text-ctrl-lg" />
          </button>
          <button
            type="button"
            uiButton
            variant="danger-text"
            size="icon"
            data-action="delete"
            (click)="onDelete(rule)"
            [attr.aria-label]="'Delete rule ' + rule.id"
          >
            <ui-icon name="delete" class="text-ctrl-lg" />
          </button>
        </div>
      </td>
    </ng-container>

    <tr cdk-header-row *cdkHeaderRowDef="columns; sticky: true"></tr>
    <tr cdk-row *cdkRowDef="let rule; columns: columns" [class]="row" [attr.data-selected]="isSelected(rule)"></tr>
    <tr *cdkNoDataRow>
      <td [attr.colspan]="columns.length" [class]="t.empty">
        @if (loading()) {
          <div
            class="mx-auto size-8 animate-spin rounded-full border-4 border-solid border-fg/15 border-t-accent"
            role="status"
            aria-label="Loading rules"
          ></div>
        } @else if (rules().length === 0) {
          No rules yet. Add a rule or upload a CSV to get started.
        } @else {
          No rules match your search.
        }
      </td>
    </tr>
  </table>
</div>
