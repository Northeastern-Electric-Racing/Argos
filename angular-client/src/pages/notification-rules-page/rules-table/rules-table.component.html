<p-table
  #dt
  [value]="rules()"
  [globalFilterFields]="['expr', 'topic', 'id']"
  [selection]="selectedRules()"
  (selectionChange)="onSelectionChange($any($event))"
  dataKey="id"
  [size]="compact() ? 'small' : undefined"
  [stripedRows]="true"
  [rowHover]="true"
  [scrollable]="true"
  scrollHeight="600px"
  [loading]="loading()"
>
  <ng-template #header>
    <tr>
      <th style="width: 3rem">
        <!-- camelCase selector: PrimeNG 21 has no p-table-header-checkbox; keep on the fork -->
        <p-tableHeaderCheckbox />
      </th>
      <th>Rule</th>
      <th>Applied To</th>
      <!-- TODO: Uploaded By column once backend supports it -->
      <th class="hide-mobile">Uploaded By</th>
      <!-- TODO: Description column once backend supports it -->
      <th class="hide-mobile">Description</th>
      <th>Subscribed</th>
      <th style="width: 5rem" aria-label="Actions"></th>
    </tr>
  </ng-template>
  <ng-template #body let-rule>
    <tr>
      <td>
        <!-- camelCase selector: PrimeNG 21 has no p-table-checkbox; keep on the fork -->
        <p-tableCheckbox [value]="rule" />
      </td>
      <td>{{ rule.expr }}</td>
      <td>{{ rule.topic }}</td>
      <td class="hide-mobile">-</td>
      <td class="hide-mobile">-</td>
      <td>
        <p-toggleswitch
          [ngModel]="rule.is_subscribed"
          (ngModelChange)="onToggleSubscription(rule, $event)"
          [ariaLabel]="'Subscribe to ' + rule.expr + ' on ' + rule.topic"
        />
      </td>
      <td class="action-icons">
        <p-button
          icon="pi pi-pencil"
          severity="secondary"
          [text]="true"
          [rounded]="true"
          size="small"
          ariaLabel="Edit rule"
          (onClick)="onEdit(rule)"
        />
        <p-button
          icon="pi pi-trash"
          severity="danger"
          [text]="true"
          [rounded]="true"
          size="small"
          ariaLabel="Delete rule"
          (onClick)="onDelete(rule)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="7">
        <div class="empty-state">
          @if (rules().length === 0) {
            No rules yet. Add a rule or upload a CSV to get started.
          } @else {
            No rules match your search.
          }
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
