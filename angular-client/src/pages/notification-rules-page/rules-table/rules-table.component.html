<tui-loader class="table-loader" [loading]="loading()" [overlay]="true">
  <div class="table-scroll">
    <table tuiTable size="m" class="rules-table" [ngModel]="selectedRules()" (ngModelChange)="onSelectionChange($event)">
      <thead>
        <tr>
          <th tuiTh class="col-select">
            <input tuiCheckbox tuiCheckboxTable type="checkbox" size="s" aria-label="Select all rules" />
          </th>
          <th tuiTh>Rule</th>
          <th tuiTh>Applied To</th>
          <!-- TODO: Uploaded By column once backend supports it -->
          <th tuiTh class="col-optional">Uploaded By</th>
          <!-- TODO: Description column once backend supports it -->
          <th tuiTh class="col-optional">Description</th>
          <th tuiTh>Subscribed</th>
          <th tuiTh class="col-actions"><span class="visually-hidden">Actions</span></th>
        </tr>
      </thead>
      <tbody tuiTbody>
        @for (rule of filteredRules(); track rule.id) {
          <tr tuiTr>
            <td tuiTd class="col-select">
              <input
                tuiCheckbox
                type="checkbox"
                size="s"
                [attr.aria-label]="'Select rule ' + rule.id"
                [tuiCheckboxRow]="rule"
              />
            </td>
            <td tuiTd>{{ rule.expr }}</td>
            <td tuiTd>{{ rule.topic }}</td>
            <td tuiTd class="col-optional">-</td>
            <td tuiTd class="col-optional">-</td>
            <td tuiTd>
              <input
                tuiSwitch
                type="checkbox"
                size="s"
                [attr.aria-label]="'Subscribe to rule ' + rule.id"
                [ngModel]="rule.is_subscribed"
                (ngModelChange)="onToggleSubscription(rule, $event)"
              />
            </td>
            <td tuiTd class="col-actions">
              <span class="action-icons">
                <button
                  appearance="flat-grayscale"
                  iconStart="@tui.pencil"
                  size="xs"
                  tuiIconButton
                  type="button"
                  (click)="onEdit(rule)"
                >
                  Edit rule
                </button>
                <button
                  appearance="flat-destructive"
                  iconStart="@tui.trash-2"
                  size="xs"
                  tuiIconButton
                  type="button"
                  (click)="onDelete(rule)"
                >
                  Delete rule
                </button>
              </span>
            </td>
          </tr>
        } @empty {
          <tr>
            <td tuiTd colspan="7">
              <div class="empty-state">
                @if (rules().length === 0) {
                  No rules yet. Add a rule or upload a CSV to get started.
                } @else {
                  No rules match your search.
                }
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</tui-loader>
