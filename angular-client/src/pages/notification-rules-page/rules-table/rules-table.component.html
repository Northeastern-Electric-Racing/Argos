<p-table
  #dt
  [value]="rules()"
  [globalFilterFields]="['expr', 'topic', 'id']"
  [selection]="selectedRules()"
  (selectionChange)="onSelectionChange($any($event))"
  dataKey="id"
  [scrollable]="true"
  scrollHeight="600px"
  [loading]="loading()"
>
  <ng-template #header>
    <tr>
      <th style="width: 3rem">
        <!-- camelCase selector: PrimeNG 21 has no p-table-header-checkbox; keep on the fork -->
        <p-tableHeaderCheckbox />
      </th>
      <th>Rule</th>
      <th>Applied To</th>
      <!-- TODO: Uploaded By column once backend supports it -->
      <th>Uploaded By</th>
      <!-- TODO: Description column once backend supports it -->
      <th>Description</th>
      <th>Subscribed</th>
      <th style="width: 5rem" aria-label="Actions"></th>
    </tr>
  </ng-template>
  <ng-template #body let-rule>
    <tr>
      <td>
        <!-- camelCase selector: PrimeNG 21 has no p-table-checkbox; keep on the fork -->
        <p-tableCheckbox [value]="rule" />
      </td>
      <td>{{ rule.expr }}</td>
      <td>{{ rule.topic }}</td>
      <td>-</td>
      <td>-</td>
      <td>
        <p-toggleswitch [ngModel]="rule.is_subscribed" (ngModelChange)="onToggleSubscription(rule, $event)" />
      </td>
      <td class="action-icons">
        <button pButton [text]="true" size="small" (click)="onEdit(rule)" aria-label="Edit rule">
          <i class="pi pi-pencil" pButtonIcon></i>
        </button>
        <button pButton [text]="true" size="small" severity="danger" (click)="onDelete(rule)" aria-label="Delete rule">
          <i class="pi pi-trash" pButtonIcon></i>
        </button>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="7">
        <div class="empty-state">
          @if (rules().length === 0) {
            No rules yet. Add a rule or upload a CSV to get started.
          } @else {
            No rules match your search.
          }
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
