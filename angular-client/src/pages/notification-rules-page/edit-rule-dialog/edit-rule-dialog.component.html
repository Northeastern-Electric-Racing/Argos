<h2 mat-dialog-title>Edit Rule: {{ data.id }}</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="fields">
    <mat-form-field>
      <mat-label>Expression</mat-label>
      <input matInput formControlName="expr" required />
      @if (form.get('expr')?.hasError('required')) {
        <mat-error>Expression is required</mat-error>
      }
    </mat-form-field>
    <mat-form-field>
      <mat-label>Debounce Time (seconds)</mat-label>
      <input matInput formControlName="debounce_time" type="number" required />
      @if (form.get('debounce_time')?.hasError('required')) {
        <mat-error>Debounce time is required</mat-error>
      }
      @if (form.get('debounce_time')?.hasError('min')) {
        <mat-error>Must be 0 or greater</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="onCancel()">Cancel</button>
    <button matButton="filled" type="submit">Save</button>
  </mat-dialog-actions>
</form>
