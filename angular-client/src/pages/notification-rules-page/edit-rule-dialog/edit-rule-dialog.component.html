<form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="onSubmit()">
  <nz-form-item>
    <nz-form-label nzFor="edit-expr">Expression</nz-form-label>
    <nz-form-control nzErrorTip="Expression is required">
      <input id="edit-expr" nz-input formControlName="expr" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="edit-debounce">Debounce Time (seconds)</nz-form-label>
    <nz-form-control [nzErrorTip]="debounceError">
      <input id="edit-debounce" nz-input formControlName="debounce_time" type="number" />
      <ng-template #debounceError let-control>
        {{ control.hasError('min') ? 'Must be 0 or greater' : 'Debounce time is required' }}
      </ng-template>
    </nz-form-control>
  </nz-form-item>

  <div class="button-row">
    <button nz-button nzType="text" type="button" (click)="onCancel()">Cancel</button>
    <button nz-button nzType="primary" type="submit">Save</button>
  </div>
</form>
