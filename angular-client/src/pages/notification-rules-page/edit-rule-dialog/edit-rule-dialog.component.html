<hlm-dialog-header>
  <h2 hlmDialogTitle>{{ context.header }}</h2>
</hlm-dialog-header>
<form class="grid gap-6" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div hlmFieldGroup>
    <div hlmField>
      <label hlmFieldLabel for="edit-expr">Expression</label>
      <input id="edit-expr" hlmInput formControlName="expr" />
      <hlm-field-error validator="required">Expression is required</hlm-field-error>
    </div>

    <div hlmField>
      <label hlmFieldLabel for="edit-debounce">Debounce Time (seconds)</label>
      <input id="edit-debounce" hlmInput formControlName="debounce_time" type="number" />
      <hlm-field-error validator="required">Debounce time is required</hlm-field-error>
      <hlm-field-error validator="min">Must be 0 or greater</hlm-field-error>
    </div>
  </div>

  <hlm-dialog-footer>
    <button hlmBtn variant="ghost" type="button" (click)="onCancel()">Cancel</button>
    <button hlmBtn type="submit">Save</button>
  </hlm-dialog-footer>
</form>
