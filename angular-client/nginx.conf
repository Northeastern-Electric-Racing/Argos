server{ 
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # A missing asset is a 404, not index.html (the 3D view still checks a model's bytes, see load-car-model.ts)
    location /assets/ {
        try_files $uri =404;
    }

    # The Draco decoder; browsers only stream-compile WebAssembly served as application/wasm
    location ~ \.wasm$ {
        types { application/wasm wasm; }
    }

    # mime.types has no mjs, and browsers refuse a module worker served as application/octet-stream
    location ~ \.mjs$ {
        types { application/javascript mjs; }
    }
}



